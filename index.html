<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,
maximum-scale=1,user-scalable=no,
viewport-fit=cover">

<meta name="theme-color" content="#02040a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ship Builder">

<title>Ship Builder</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    background:#02040a;
    color:white;
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body{
    overflow:hidden;
    padding:0;
}

button,
input{
    font:inherit;
}

button{
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
}

#shipCustomizer{
    position:fixed;
    z-index:50;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:radial-gradient(circle at center, rgba(15,35,80,.35), rgba(0,0,0,.82));
    backdrop-filter:blur(7px);
    overflow-y:auto;
    -webkit-user-select:none;
    user-select:none;
}

#shipCustomizer.show{
    display:flex;
}

.customizer-card{
    width:min(520px,100%);
    max-height:90vh;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:24px 18px;
    border-radius:22px;
    background:linear-gradient(180deg, rgba(8,17,38,.94), rgba(3,7,18,.96));
    border:1px solid rgba(100,190,255,.18);
    box-shadow:0 25px 80px rgba(0,0,0,.5);
    position:relative;
    z-index:51;
}

.customizer-title{
    font-size:28px;
    font-weight:950;
    color:#69dfff;
    text-align:center;
    margin-bottom:8px;
}

.customizer-subtitle{
    color:#6d88aa;
    font-size:10px;
    letter-spacing:3px;
    text-transform:uppercase;
    text-align:center;
    margin-bottom:20px;
}

.customizer-preview{
    width:100%;
    height:280px;
    border:1px solid rgba(100,190,255,.25);
    border-radius:16px;
    background:rgba(0,0,0,.3);
    margin-bottom:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    z-index:30;
}

#customPreview{
    display:block;
    touch-action:none;
    -webkit-touch-callout:none;
}

.customizer-section{
    text-align:left;
    margin-bottom:18px;
    position:relative;
    z-index:52;
}

.customizer-section-title{
    color:#70ddff;
    font-size:10px;
    font-weight:900;
    letter-spacing:2px;
    text-transform:uppercase;
    margin-bottom:10px;
}

.shape-buttons{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(60px,1fr));
    gap:8px;
    margin-bottom:12px;
}

.shape-btn{
    padding:10px;
    border:1px solid rgba(100,190,255,.25);
    border-radius:10px;
    background:rgba(255,255,255,.04);
    color:#bcd7f3;
    font-size:10px;
    font-weight:800;
    cursor:pointer;
    position:relative;
    z-index:52;
}

.shape-btn:hover{
    border-color:rgba(100,190,255,.5);
    background:rgba(100,190,255,.1);
}

.color-picker-group{
    display:flex;
    gap:10px;
    align-items:center;
    margin-bottom:10px;
    position:relative;
    z-index:52;
}

.color-picker-label{
    color:#8fa7c7;
    font-size:10px;
    flex:1;
}

.color-input{
    width:50px;
    height:40px;
    border:1px solid rgba(100,190,255,.25);
    border-radius:8px;
    cursor:pointer;
}

.control-buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:6px;
    margin-bottom:10px;
}

.control-btn{
    padding:8px;
    border:1px solid rgba(100,190,255,.25);
    border-radius:8px;
    background:rgba(255,255,255,.04);
    color:#bcd7f3;
    font-size:12px;
    cursor:pointer;
    position:relative;
    z-index:52;
}

.control-btn:hover{
    border-color:rgba(100,190,255,.5);
    background:rgba(100,190,255,.1);
}

.slider-group{
    display:flex;
    gap:10px;
    align-items:center;
    margin-bottom:10px;
    position:relative;
    z-index:52;
}

.slider-label{
    color:#8fa7c7;
    font-size:10px;
    min-width:60px;
}

.slider-input{
    flex:1;
    height:6px;
    border-radius:3px;
    background:rgba(100,190,255,.2);
    outline:none;
    -webkit-appearance:none;
    appearance:none;
}

.slider-input::-webkit-slider-thumb{
    width:16px;
    height:16px;
    border-radius:50%;
    background:#63e6ff;
    cursor:pointer;
    border:1px solid rgba(100,190,255,.5);
    -webkit-appearance:none;
}

.slider-input::-moz-range-thumb{
    width:16px;
    height:16px;
    border-radius:50%;
    background:#63e6ff;
    cursor:pointer;
    border:1px solid rgba(100,190,255,.5);
}

.customizer-actions{
    display:flex;
    gap:10px;
    margin-top:20px;
    position:relative;
    z-index:52;
}

.big-button{
    width:100%;
    border:1px solid rgba(100,210,255,.28);
    border-radius:13px;
    padding:13px;
    background:linear-gradient(90deg, rgba(55,190,255,.18), rgba(120,100,255,.15));
    color:#bcecff;
    font-weight:850;
    font-size:12px;
    letter-spacing:1px;
    cursor:pointer;
    position:relative;
    z-index:52;
}

.big-button:hover{
    border-color:rgba(100,210,255,.5);
}

.big-button.secondary-button{
    background:rgba(255,255,255,.035);
    color:#9eb4d0;
}

.selected-shape-info{
    background:rgba(100,190,255,.1);
    border:1px solid rgba(100,190,255,.25);
    border-radius:10px;
    padding:10px;
    margin-bottom:12px;
    font-size:10px;
    color:#a9d4f0;
    position:relative;
    z-index:52;
}

.remove-btn{
    padding:6px 12px;
    margin-top:8px;
    background:#ff4444;
    border:1px solid #ff6666;
    border-radius:6px;
    color:white;
    font-size:9px;
    font-weight:800;
    cursor:pointer;
    width:100%;
    position:relative;
    z-index:52;
}

.remove-btn:hover{
    background:#ff5555;
}

.hidden{
    display:none !important;
}

</style>

</head>

<body>

<div id="shipCustomizer">
    <div class="customizer-card">
        <div class="customizer-title">⚙ SHIP BUILDER</div>
        <div class="customizer-subtitle">Design Your Vessel</div>

        <div class="customizer-preview">
            <canvas id="customPreview" width="400" height="280"></canvas>
        </div>

        <div class="customizer-section">
            <div class="customizer-section-title">Add Shapes</div>
            <div class="shape-buttons" id="shapeButtons"></div>
            <button class="big-button secondary-button" id="customPolygonBtn">+ Custom Polygon</button>
        </div>

        <div class="customizer-section hidden" id="polygonSection">
            <div class="customizer-section-title">Define Polygon Points</div>
            <div id="polygonInput"></div>
            <button class="big-button" id="createPolygonBtn">Create Polygon</button>
        </div>

        <div class="customizer-section">
            <div id="selectedShapeInfo"></div>
        </div>

        <div class="customizer-section" id="colorSection" style="display:none;">
            <div class="customizer-section-title">Color</div>
            <div class="color-picker-group">
                <label class="color-picker-label">RGB Color:</label>
                <input type="color" id="shapeColor" class="color-input" value="#00ff00">
            </div>
        </div>

        <div class="customizer-section" id="transformSection" style="display:none;">
            <div class="customizer-section-title">Position & Transform</div>
            <div class="control-buttons">
                <button class="control-btn" id="moveUpBtn">↑</button>
                <button class="control-btn" id="moveDownBtn">↓</button>
                <button class="control-btn" id="moveLeftBtn">←</button>
                <button class="control-btn" id="moveRightBtn">→</button>
            </div>

            <div class="slider-group">
                <label class="slider-label">Scale:</label>
                <input type="range" id="scaleSlider" class="slider-input" min="0.5" max="3" step="0.1" value="1">
            </div>

            <div class="slider-group">
                <label class="slider-label">Rotate:</label>
                <input type="range" id="rotateSlider" class="slider-input" min="0" max="360" step="5" value="0">
            </div>
        </div>

        <div class="customizer-actions">
            <button class="big-button secondary-button" id="resetCustomizerBtn">Reset</button>
            <button class="big-button" id="startGameBtn">Start Game</button>
        </div>
    </div>
</div>

<script>
class ShapeObject {
    constructor(type, x = 200, y = 140, color = '#00ff00', scale = 1, rotation = 0, points = null) {
        this.type = type;
        this.x = x;
        this.y = y;
        this.color = color;
        this.scale = scale;
        this.rotation = rotation;
        this.points = points;
        this.id = Math.random();
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate((this.rotation * Math.PI) / 180);
        ctx.fillStyle = this.color;
        ctx.strokeStyle = 'rgba(100,190,255,0.5)';
        ctx.lineWidth = 1.5;

        switch(this.type) {
            case 'circle':
                ctx.beginPath();
                ctx.arc(0, 0, 25 * this.scale, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                break;
            case 'square':
                const size = 50 * this.scale;
                ctx.fillRect(-size/2, -size/2, size, size);
                ctx.strokeRect(-size/2, -size/2, size, size);
                break;
            case 'triangle':
                ctx.beginPath();
                ctx.moveTo(0, -30 * this.scale);
                ctx.lineTo(30 * this.scale, 30 * this.scale);
                ctx.lineTo(-30 * this.scale, 30 * this.scale);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                break;
            case 'rectangle':
                const w = 50 * this.scale;
                const h = 30 * this.scale;
                ctx.fillRect(-w/2, -h/2, w, h);
                ctx.strokeRect(-w/2, -h/2, w, h);
                break;
            case 'hexagon':
                this.drawPolygon(ctx, 6, 25 * this.scale);
                break;
            case 'pentagon':
                this.drawPolygon(ctx, 5, 25 * this.scale);
                break;
            case 'diamond':
                ctx.beginPath();
                ctx.moveTo(0, -35 * this.scale);
                ctx.lineTo(35 * this.scale, 0);
                ctx.lineTo(0, 35 * this.scale);
                ctx.lineTo(-35 * this.scale, 0);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                break;
            case 'emp-cube':
                ctx.fillStyle = '#ff6b9d';
                ctx.strokeStyle = 'rgba(255,107,157,0.8)';
                const cubeSize = 30 * this.scale;
                ctx.fillRect(-cubeSize/2, -cubeSize/2, cubeSize, cubeSize);
                ctx.strokeRect(-cubeSize/2, -cubeSize/2, cubeSize, cubeSize);
                break;
        }

        ctx.restore();
    }

    drawPolygon(ctx, sides, radius) {
        ctx.beginPath();
        for (let i = 0; i < sides; i++) {
            const angle = (i / sides) * Math.PI * 2 - Math.PI / 2;
            const x = Math.cos(angle) * radius;
            const y = Math.sin(angle) * radius;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
    }
}

const shipCustomizer = {
    shapes: [],
    selectedShape: null,
    isDragging: false,
    dragOffsetX: 0,
    dragOffsetY: 0,

    init() {
        this.loadCustomShip();
        this.setupEventListeners();
        this.ensureEMPCube();
        this.render();
        document.getElementById('shipCustomizer').classList.add('show');
    },

    setupEventListeners() {
        const canvas = document.getElementById('customPreview');

        ['circle', 'square', 'triangle', 'rectangle', 'hexagon', 'pentagon', 'diamond'].forEach(shape => {
            const btn = document.createElement('button');
            btn.className = 'shape-btn';
            btn.textContent = this.getShapeEmoji(shape);
            btn.addEventListener('click', () => this.addShape(shape));
            document.getElementById('shapeButtons').appendChild(btn);
        });

        document.getElementById('customPolygonBtn').addEventListener('click', () => this.showPolygonInput());
        document.getElementById('createPolygonBtn').addEventListener('click', () => this.createCustomPolygon());
        document.getElementById('resetCustomizerBtn').addEventListener('click', () => this.reset());
        document.getElementById('startGameBtn').addEventListener('click', () => this.finishCustomization());

        document.getElementById('shapeColor').addEventListener('change', (e) => {
            if (this.selectedShape) this.selectedShape.color = e.target.value;
            this.render();
        });

        document.getElementById('moveUpBtn').addEventListener('click', () => this.moveShape(0, -5));
        document.getElementById('moveDownBtn').addEventListener('click', () => this.moveShape(0, 5));
        document.getElementById('moveLeftBtn').addEventListener('click', () => this.moveShape(-5, 0));
        document.getElementById('moveRightBtn').addEventListener('click', () => this.moveShape(5, 0));

        document.getElementById('scaleSlider').addEventListener('input', (e) => {
            if (this.selectedShape) this.selectedShape.scale = parseFloat(e.target.value);
            this.render();
        });

        document.getElementById('rotateSlider').addEventListener('input', (e) => {
            if (this.selectedShape) this.selectedShape.rotation = parseFloat(e.target.value);
            this.render();
        });

        canvas.addEventListener('mousedown', (e) => this.canvasMouseDown(e, canvas));
        canvas.addEventListener('mousemove', (e) => this.canvasMouseMove(e, canvas));
        canvas.addEventListener('mouseup', () => this.isDragging = false);
        canvas.addEventListener('mouseleave', () => this.isDragging = false);

        canvas.addEventListener('touchstart', (e) => this.canvasTouchStart(e, canvas), false);
        canvas.addEventListener('touchmove', (e) => this.canvasTouchMove(e, canvas), false);
        canvas.addEventListener('touchend', () => this.isDragging = false);
    },

    getShapeEmoji(type) {
        const emojis = { circle: '●', square: '▪', triangle: '▲', rectangle: '▬', hexagon: '⬡', pentagon: '⬠', diamond: '◆' };
        return emojis[type] || '○';
    },

    addShape(type) {
        const shape = new ShapeObject(type, 200, 140);
        this.shapes.push(shape);
        this.selectShape(shape);
        this.render();
    },

    showPolygonInput() {
        document.getElementById('polygonSection').classList.remove('hidden');
        const container = document.getElementById('polygonInput');
        container.innerHTML = '';
        for (let i = 0; i < 4; i++) {
            const input = document.createElement('input');
            input.type = 'text';
            input.placeholder = `Point ${i+1} (x,y)`;
            input.value = i === 0 ? '0,-30' : i === 1 ? '30,30' : i === 2 ? '-30,30' : '0,-30';
            input.style.flex = '1';
            input.style.minWidth = '70px';
            input.style.padding = '8px';
            input.style.border = '1px solid rgba(100,190,255,.25)';
            input.style.borderRadius = '8px';
            input.style.background = 'rgba(0,0,0,.25)';
            input.style.color = 'white';
            input.style.fontSize = '11px';
            input.style.textAlign = 'center';
            container.appendChild(input);
        }
    },

    createCustomPolygon() {
        const inputs = document.querySelectorAll('#polygonInput input[type="text"]');
        const points = Array.from(inputs).map(input => {
            const [x, y] = input.value.split(',').map(Number);
            return [x, y];
        }).filter(p => !isNaN(p[0]) && !isNaN(p[1]));

        if (points.length >= 3) {
            const shape = new ShapeObject('custom', 200, 140, '#00ff00', 1, 0, points);
            this.shapes.push(shape);
            this.selectShape(shape);
            document.getElementById('polygonSection').classList.add('hidden');
            this.render();
        }
    },

    selectShape(shape) {
        this.selectedShape = shape;
        this.updateShapeInfo();
    },

    updateShapeInfo() {
        const info = document.getElementById('selectedShapeInfo');
        if (this.selectedShape) {
            const shapeType = this.selectedShape.type === 'emp-cube' ? '⚡ EMP Core' : this.selectedShape.type.toUpperCase();
            let html = `<div class="selected-shape-info"><strong>${shapeType}</strong> selected`;
            if (this.selectedShape.type !== 'emp-cube') {
                html += `<button class="remove-btn" onclick="shipCustomizer.removeShape()">Remove Shape</button>`;
            } else {
                html += '<div style="font-size:9px;color:#ffd700;margin-top:8px;">⚡ Core System (Required)</div>';
            }
            html += '</div>';
            info.innerHTML = html;
            document.getElementById('colorSection').style.display = 'block';
            document.getElementById('transformSection').style.display = 'block';
            document.getElementById('shapeColor').value = this.selectedShape.color;
            document.getElementById('scaleSlider').value = this.selectedShape.scale;
            document.getElementById('rotateSlider').value = this.selectedShape.rotation;
        } else {
            info.innerHTML = '';
            document.getElementById('colorSection').style.display = 'none';
            document.getElementById('transformSection').style.display = 'none';
        }
    },

    moveShape(dx, dy) {
        if (this.selectedShape) {
            this.selectedShape.x += dx;
            this.selectedShape.y += dy;
            this.render();
        }
    },

    removeShape() {
        if (this.selectedShape && this.selectedShape.type !== 'emp-cube') {
            this.shapes = this.shapes.filter(s => s.id !== this.selectedShape.id);
            this.selectedShape = null;
            this.updateShapeInfo();
            this.render();
        }
    },

    canvasMouseDown(e, canvas) {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        this.selectShapeAt(x, y);
        if (this.selectedShape) {
            this.isDragging = true;
            this.dragOffsetX = x - this.selectedShape.x;
            this.dragOffsetY = y - this.selectedShape.y;
        }
    },

    canvasMouseMove(e, canvas) {
        if (!this.isDragging) return;
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        this.selectedShape.x = x - this.dragOffsetX;
        this.selectedShape.y = y - this.dragOffsetY;
        this.render();
    },

    canvasTouchStart(e, canvas) {
        if (e.touches.length !== 1) return;
        const touch = e.touches[0];
        const rect = canvas.getBoundingClientRect();
        const x = touch.clientX - rect.left;
        const y = touch.clientY - rect.top;
        this.selectShapeAt(x, y);
        if (this.selectedShape) {
            this.isDragging = true;
            this.dragOffsetX = x - this.selectedShape.x;
            this.dragOffsetY = y - this.selectedShape.y;
        }
    },

    canvasTouchMove(e, canvas) {
        if (!this.isDragging || e.touches.length !== 1) return;
        e.preventDefault();
        const touch = e.touches[0];
        const rect = canvas.getBoundingClientRect();
        const x = touch.clientX - rect.left;
        const y = touch.clientY - rect.top;
        this.selectedShape.x = x - this.dragOffsetX;
        this.selectedShape.y = y - this.dragOffsetY;
        this.render();
    },

    selectShapeAt(x, y) {
        for (let i = this.shapes.length - 1; i >= 0; i--) {
            const shape = this.shapes[i];
            const dist = Math.sqrt((x - shape.x) ** 2 + (y - shape.y) ** 2);
            if (dist < 40 * shape.scale) {
                this.selectShape(shape);
                return;
            }
        }
    },

    ensureEMPCube() {
        if (!this.shapes.some(s => s.type === 'emp-cube')) {
            const empCube = new ShapeObject('emp-cube', 200, 140, '#ff6b9d');
            this.shapes.push(empCube);
            this.selectShape(empCube);
        }
    },

    render() {
        const canvas = document.getElementById('customPreview');
        const ctx = canvas.getContext('2d');
        
        // Clear canvas completely
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Draw background
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw all shapes
        for (const shape of this.shapes) {
            shape.draw(ctx);
        }

        // Draw selection highlight
        if (this.selectedShape) {
            ctx.strokeStyle = '#63e6ff';
            ctx.lineWidth = 2;
            ctx.globalAlpha = 0.5;
            ctx.beginPath();
            ctx.arc(this.selectedShape.x, this.selectedShape.y, 50, 0, Math.PI * 2);
            ctx.stroke();
            ctx.globalAlpha = 1;
        }
    },

    reset() {
        if (confirm('Reset ship to default?')) {
            this.shapes = [];
            this.selectedShape = null;
            this.ensureEMPCube();
            localStorage.removeItem('customShip');
            this.render();
            this.updateShapeInfo();
        }
    },

    saveCustomShip() {
        const shipData = this.shapes.map(s => ({
            type: s.type,
            x: s.x,
            y: s.y,
            color: s.color,
            scale: s.scale,
            rotation: s.rotation,
            points: s.points
        }));
        localStorage.setItem('customShip', JSON.stringify(shipData));
    },

    loadCustomShip() {
        const saved = localStorage.getItem('customShip');
        if (saved) {
            const shipData = JSON.parse(saved);
            this.shapes = shipData.map(s => new ShapeObject(s.type, s.x, s.y, s.color, s.scale, s.rotation, s.points));
        }
        this.ensureEMPCube();
    },

    finishCustomization() {
        this.saveCustomShip();
        alert('Ship saved! Ready to customize more or export.');
    }
};

shipCustomizer.init();
</script>

</body>

</html>
