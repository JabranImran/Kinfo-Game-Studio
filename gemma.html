<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Local Gemma">
<title>Local Gemma — V0.4.0</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#090b10;color:#f4f5f7}
.app{max-width:820px;margin:auto;min-height:100dvh;display:flex;flex-direction:column}
header{padding:calc(14px + env(safe-area-inset-top)) 16px 12px;display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid #222630}
h1{font-size:19px;margin:0}
.small{font-size:12px;color:#9098a6;line-height:1.4}
.badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.badge{font-size:10px;padding:5px 8px;border-radius:999px;background:#171a22;color:#9098a6}
.ok{color:#75e3a2}.bad{color:#ff8f8f}.warn{color:#ffd27a}
main{flex:1;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel{background:#11141a;border:1px solid #292e39;border-radius:15px;padding:14px;display:flex;flex-direction:column;gap:10px}
select,button,textarea{font:inherit;color:#fff}
select{width:100%;background:#151821;border:1px solid #303644;border-radius:12px;padding:11px}
label.small{display:flex;flex-direction:column;gap:4px}
button{border:1px solid #303644;background:#151821;border-radius:12px;padding:10px 14px;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.primary{background:#245eea;border-color:#245eea}
.row{display:flex;gap:8px;flex-wrap:wrap}
.bar{height:7px;background:#242934;border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#4d8dff;transition:width .2s}
.notice{background:#2a2312;border:1px solid #5a4a1c;color:#ffd27a;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.4}
#messages{flex:1;display:flex;flex-direction:column;gap:12px;min-height:30vh}
.msg{max-width:92%;padding:11px 14px;border-radius:17px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.user{align-self:flex-end;background:#245eea}
.assistant{align-self:flex-start;background:#171a22;border:1px solid #252a35}
.composer{position:sticky;bottom:0;background:linear-gradient(transparent,#090b10 20%);padding:18px 0 calc(8px + env(safe-area-inset-bottom))}
.composer .row{flex-wrap:nowrap}
textarea{flex:1;min-height:50px;max-height:160px;resize:none;border:1px solid #303644;border-radius:16px;background:#11141b;padding:12px;font-size:16px}
details summary{cursor:pointer;font-size:12px;color:#9098a6}
.log{background:#080a0f;border:1px solid #242934;border-radius:10px;padding:10px;max-height:220px;overflow:auto;font:11px ui-monospace,Menlo,monospace;white-space:pre-wrap;margin-top:8px}
</style>
</head>
<body>
<div class="app">
<header>
  <div><h1>Local Gemma</h1><div class="small">Runs on your device · V0.4.0</div></div>
  <div class="badges"><span id="gpuBadge" class="badge">WebGPU…</span><span id="netBadge" class="badge">…</span></div>
</header>
<main>
  <section class="panel" id="setup">
    <div id="notice" class="notice" hidden></div>
    <label class="small">Model<select id="modelSelect"></select></label>
    <div id="modelNote" class="small"></div>
    <label class="small">Engine
      <select id="engineSelect">
        <option value="gpu">GPU (WebGPU): faster</option>
        <option value="cpu">CPU: slower, but uses less memory and is often more stable on iPhone</option>
      </select>
    </label>
    <div class="row">
      <button id="loadBtn" class="primary">Download &amp; load</button>
      <button id="clearCacheBtn">Delete downloaded models</button>
    </div>
    <div class="bar"><i id="progress"></i></div>
    <div id="status" class="small">Downloads are saved on this phone in pieces. If the app restarts, tap the button again and it carries on where it stopped.</div>
    <div id="storage" class="small"></div>
    <details><summary>Diagnostic log</summary><div id="log" class="log">App started.</div><button id="copyLogBtn" style="margin-top:8px">Copy log</button></details>
  </section>

  <div id="messages"></div>

  <div class="composer">
    <div class="row">
      <textarea id="prompt" placeholder="Load a model first…" enterkeyhint="send" disabled></textarea>
      <button id="sendBtn" class="primary" disabled>Send</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button id="stopBtn" disabled>Stop</button>
      <button id="clearChatBtn">New chat</button>
      <button id="setupBtn">Model setup</button>
    </div>
  </div>
</main>
</div>

<script type="module">
const TRANSFORMERS_URL = "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4/dist/transformers.min.js";

const MODELS = [
  { id: "onnx-community/gemma-4-E2B-it-ONNX", name: "Gemma 4 E2B (≈3 GB)",
    note: "The real Gemma 4. The download can now finish, but loading 3 GB into memory is very likely more than Safari allows on an iPhone." },
  { id: "onnx-community/gemma-3-1b-it-ONNX-GQA", name: "Gemma 3 1B (≈1 GB)",
    note: "Middle ground. Best chance on an iPhone 15 Pro or newer." },
  { id: "onnx-community/gemma-3-270m-it-ONNX", name: "Gemma 3 270M (≈0.3 GB)",
    note: "Tiny and fast. Should run on almost any recent iPhone. Simple answers." },
];
const MAX_NEW_TOKENS = 384;   // shorter replies = less memory
const HISTORY_TURNS  = 8;     // only the last few messages are sent to the model

const $ = id => document.getElementById(id);
let lib=null, generator=null, loadedModel=null, history=[], stopper=null, busy=false;

// ---------- small helpers ----------
const ls = { get(k){try{return localStorage.getItem(k)}catch{return null}}, set(k,v){try{localStorage.setItem(k,v)}catch{}}, del(k){try{localStorage.removeItem(k)}catch{}} };
function log(msg){ const l=`[${new Date().toLocaleTimeString()}] ${msg}`; $("log").textContent+="\n"+l; console.log("[LocalGemma]",msg); }
function setStatus(t,cls=""){ $("status").textContent=t; $("status").className="small "+cls; }
function setProgress(p){ $("progress").style.width=Math.max(0,Math.min(100,p))+"%"; }
function badge(id,text,cls){ $(id).textContent=text; $(id).className="badge "+cls; }
function addMessage(role,text,scroll=true){ const e=document.createElement("div"); e.className="msg "+role; e.textContent=text; $("messages").appendChild(e); if(scroll) e.scrollIntoView({block:"end"}); return e; }
function fmtMB(b){ return b>=1073741824 ? (b/1073741824).toFixed(2)+" GB" : (b/1048576).toFixed(0)+" MB"; }
const short = url => url.split("/").pop();
const modelName = id => MODELS.find(m=>m.id===id)?.name.split(" (")[0] ?? id;

// ---------- device checks ----------
let gpuInfo = { available:false, f16:false };
async function checkDevice(){
  badge("netBadge", navigator.onLine?"ONLINE":"OFFLINE", navigator.onLine?"ok":"warn");
  if(!navigator.gpu){ badge("gpuBadge","No WebGPU","warn"); gpuInfo={available:false,f16:false}; return; }
  try{
    const a = await navigator.gpu.requestAdapter();
    if(!a) throw new Error("no adapter");
    gpuInfo = { available:true, f16:a.features.has("shader-f16") };
    badge("gpuBadge", gpuInfo.f16?"WebGPU · f16":"WebGPU", "ok");
  }catch(e){ badge("gpuBadge","WebGPU blocked","warn"); gpuInfo={available:false,f16:false}; }
}
addEventListener("online",checkDevice); addEventListener("offline",checkDevice);
await checkDevice();
if(!gpuInfo.available){ $("engineSelect").value="cpu"; log("WebGPU not available; using CPU engine."); }

// ======================================================================
// Resumable, disk-backed model storage.
// Files are downloaded in 16 MB pieces straight into IndexedDB, so the
// phone never holds a whole multi-GB file in memory while downloading,
// and every finished piece survives the app being closed or reset.
// Transformers.js reads the files through env.customCache.
// ======================================================================
const PIECE = 16*1024*1024;
let dbPromise=null;
function openDB(){
  return dbPromise ||= new Promise((res,rej)=>{
    const r=indexedDB.open("local-gemma-store",1);
    r.onupgradeneeded=()=>{ const d=r.result; d.createObjectStore("chunks"); d.createObjectStore("meta"); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
async function tx(store,mode,fn){
  const d=await openDB();
  return new Promise((res,rej)=>{
    const t=d.transaction(store,mode); let out; const r=fn(t.objectStore(store));
    if(r) r.onsuccess=()=>{ out=r.result; };
    t.oncomplete=()=>res(out); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error||new Error("storage write aborted (phone storage full?)"));
  });
}
const getMeta   = url => tx("meta","readonly", s=>s.get(url));
const putMeta   = (url,m) => tx("meta","readwrite", s=>s.put(m,url));
const putPiece  = (url,i,blob) => tx("chunks","readwrite", s=>s.put(blob,[url,i]));
const getPieces = url => tx("chunks","readonly", s=>s.getAll(IDBKeyRange.bound([url,0],[url,Infinity])));
async function deleteFile(url){
  await tx("chunks","readwrite", s=>s.delete(IDBKeyRange.bound([url,0],[url,Infinity])));
  await tx("meta","readwrite", s=>s.delete(url));
}

// download progress shared across files
const dl = new Map();
function showDownload(){
  let L=0,T=0; for(const f of dl.values()){ L+=f.loaded; T+=Math.max(f.total,f.loaded); }
  if(T){ setProgress(L/T*90); setStatus(`Downloading… ${fmtMB(L)} of ${fmtMB(T)} (saved as it goes)`); }
}

const inflight = new Map();
function ensureFile(url){
  if(!inflight.has(url)) inflight.set(url, downloadFile(url).finally(()=>inflight.delete(url)));
  return inflight.get(url);
}
async function downloadFile(url){
  let m = await getMeta(url) || { bytes:0, pieces:0, total:0, done:false };
  if(m.done) return m;
  if(m.bytes) log(`Resuming ${short(url)} from ${fmtMB(m.bytes)}`);
  for(let attempt=1;;attempt++){
    try{
      const r = await fetch(url, m.bytes ? { headers:{ Range:`bytes=${m.bytes}-` } } : {});
      if(r.status===404 || r.status===401 || r.status===403) return null;     // optional file that doesn't exist
      if(!r.ok) throw new Error("HTTP "+r.status);
      if(m.bytes && r.status!==206){ log(`Server wouldn't resume ${short(url)}; restarting that file`); await deleteFile(url); m={bytes:0,pieces:0,total:0,done:false}; }
      if(!m.total){ const cr=r.headers.get("content-range"); m.total = cr ? +cr.split("/")[1] || 0 : +(r.headers.get("content-length")||0); }
      const reader = r.body.getReader();
      let parts=[], size=0;
      const flush = async () => {
        if(!size) return;
        await putPiece(url, m.pieces, new Blob(parts));
        m.pieces++; m.bytes+=size; parts=[]; size=0;
        await putMeta(url, m);
      };
      for(;;){
        const { done, value } = await reader.read();
        if(done) break;
        parts.push(value); size += value.byteLength;
        dl.set(url,{ loaded:m.bytes+size, total:m.total }); showDownload();
        if(size >= PIECE) await flush();
      }
      await flush();
      m.done = true; m.total = m.bytes; await putMeta(url, m);
      log(`Saved ${short(url)} (${fmtMB(m.bytes)})`);
      return m;
    }catch(e){
      if(attempt>=8) throw e;
      log(`Connection hiccup on ${short(url)} (${e.message}). Retrying from ${fmtMB(m.bytes)}…`);
      await new Promise(r=>setTimeout(r, Math.min(15000, 1000*attempt)));
    }
  }
}

// Which files a model needs: asks Hugging Face for the file list (remembered for offline use).
// Vision/audio encoders are skipped: this app is text-only.
async function fileList(id, dtype){
  const key = `lg-files:${id}:${dtype}`;
  try{
    const r = await fetch(`https://huggingface.co/api/models/${id}/tree/main?recursive=true`);
    if(!r.ok) throw new Error("HTTP "+r.status);
    const want = new RegExp(`_${dtype}\\.onnx(_data(_\\d+)?)?$`);
    const files = (await r.json()).filter(f=>f.type==="file").map(f=>f.path).filter(p =>
      (!p.includes("/") && /\.(json|jinja)$/.test(p)) ||
      (p.startsWith("onnx/") && want.test(p) && !/vision|audio/i.test(p)));
    if(!files.some(p=>p.endsWith(".onnx"))) throw new Error(`no ${dtype} model files in this repo`);
    ls.set(key, JSON.stringify(files));
    return files;
  }catch(e){
    const saved = ls.get(key);
    if(saved) return JSON.parse(saved);
    throw new Error("Couldn't get the model's file list: "+e.message);
  }
}
const fileURL = (id,path) => `https://huggingface.co/${id}/resolve/main/${path}`;

// Download everything into on-device storage first (3 files at a time).
async function prefetch(id, dtype){
  const files = await fileList(id, dtype);
  log(`${files.length} files needed: ${files.map(short).join(", ")}`);
  const queue = files.map(p=>fileURL(id,p));
  const worker = async () => { while(queue.length) await ensureFile(queue.shift()); };
  await Promise.all([worker(),worker(),worker()]);
}

// Talk to sw.js, which hands saved files to the AI runtime whenever it asks Hugging Face for them.
function askSW(msg){
  return new Promise(res=>{
    const c=navigator.serviceWorker?.controller; if(!c) return res(null);
    const ch=new MessageChannel(); ch.port1.onmessage=e=>res(e.data); c.postMessage(msg,[ch.port2]);
    setTimeout(()=>res(null),1500);
  });
}
async function ensureSW(){
  if(!("serviceWorker" in navigator)) return false;
  await navigator.serviceWorker.ready;
  if(!navigator.serviceWorker.controller)
    await new Promise(r=>{ navigator.serviceWorker.addEventListener("controllerchange",r,{once:true}); setTimeout(r,4000); });
  const pong = await askSW({type:"ping"});
  return !!(pong && pong.servesModels);
}

async function showStorage(){
  if(!navigator.storage?.estimate) return;
  try{ const e=await navigator.storage.estimate(); $("storage").textContent=`Using ${fmtMB(e.usage||0)} of phone storage (up to ${fmtMB(e.quota||0)} allowed).`; }catch{}
}

// ---------- model picker ----------
function fillModels(){
  const cur=$("modelSelect").value; $("modelSelect").innerHTML="";
  for(const m of MODELS){ const o=document.createElement("option"); o.value=m.id; o.textContent=m.name+(ls.get("lg-ready:"+m.id)?"  ✓ downloaded":""); $("modelSelect").appendChild(o); }
  if(cur) $("modelSelect").value=cur;
}
fillModels();
const lastModel = ls.get("lg-model");
if(lastModel && MODELS.some(m=>m.id===lastModel)) $("modelSelect").value=lastModel;
const savedEngine = ls.get("lg-engine"); if(savedEngine && gpuInfo.available) $("engineSelect").value=savedEngine;
const showNote=()=>{ $("modelNote").textContent = MODELS.find(m=>m.id===$("modelSelect").value).note; };
$("modelSelect").onchange=()=>{ showNote(); ls.set("lg-model",$("modelSelect").value); };
$("engineSelect").onchange=()=>ls.set("lg-engine",$("engineSelect").value);
showNote(); showStorage();

// ---------- loading ----------
async function loadModel(){
  if(busy) return;
  const id = $("modelSelect").value;
  const useGPU = $("engineSelect").value==="gpu" && gpuInfo.available;
  busy=true; $("loadBtn").disabled=true; $("notice").hidden=true; setProgress(1);
  ls.set("lg-model",id);
  ls.set("lg-loading", JSON.stringify({ id, engine:useGPU?"gpu":"cpu", at:Date.now() }));   // crash detector
  dl.clear();
  try{
    if(navigator.storage?.persist){ try{ log("Persistent storage granted: "+await navigator.storage.persist()); }catch{} }

    const device = useGPU ? "webgpu" : "wasm";
    const dtype  = useGPU && gpuInfo.f16 ? "q4f16" : "q4";

    // 1) Make sure the offline helper is running, so saved files can be handed over.
    const swOK = await ensureSW();
    if(!swOK) log("WARNING: offline helper (sw.js) isn't active or is out of date. Upload the new sw.js and reopen the app. Loading without saved files.");

    // 2) Download (or resume) every needed file into on-device storage.
    if(swOK){
      setStatus("Checking downloaded files…");
      await prefetch(id, dtype);
      setProgress(90);
    }

    // 3) Load. The runtime thinks it's downloading from Hugging Face; sw.js answers from storage.
    if(!lib){
      setStatus("Loading the AI runtime…");
      lib = await import(TRANSFORMERS_URL);
      log("Transformers.js loaded"+(lib.env?.version?` v${lib.env.version}`:""));
    }
    lib.env.allowLocalModels = false;
    lib.env.useBrowserCache  = !swOK;   // don't store a second copy when sw.js has the files

    if(generator){ try{ await generator.dispose?.(); }catch{} generator=null; loadedModel=null; }
    log(`Loading ${id} on ${device} (${dtype})`);
    const before = (await askSW({type:"ping"}))?.served ?? 0;

    const reading = new Map();
    const progress_callback = p => {
      if(p.status==="progress" && p.file){
        reading.set(p.file,{loaded:p.loaded||0,total:p.total||0});
        let L=0,T=0; for(const f of reading.values()){L+=f.loaded;T+=f.total}
        if(T){ setProgress(90+L/T*7); setStatus(`Loading into memory… ${fmtMB(L)} of ${fmtMB(T)}`); }
      } else if(p.status==="ready"){ setStatus("Preparing the model… (can take a minute)"); setProgress(98); }
    };

    generator = await lib.pipeline("text-generation", id, { device, dtype, progress_callback });

    if(swOK){ const after=(await askSW({type:"ping"}))?.served ?? 0; log(`${after-before} file(s) loaded from on-device storage.`); }
    loadedModel=id; setProgress(100);
    ls.del("lg-loading"); ls.set("lg-ready:"+id,"1"); fillModels(); showStorage();
    setStatus(`${modelName(id)} is ready and running on this phone. Works offline from now on.`,"ok");
    $("prompt").disabled=false; $("sendBtn").disabled=false; $("prompt").placeholder="Ask anything…";
    $("setup").hidden=true;
    if(!history.length) addMessage("assistant", `${modelName(id)} is ready. Everything runs on your phone.`);
  }catch(e){
    console.error(e); log(`LOAD ERROR: ${e?.name||"Error"}: ${e?.message||e}\n${e?.stack||""}`); setProgress(0); ls.del("lg-loading");
    const msg=String(e?.message||e);
    if(/memory|allocat|OOM|buffer|device lost/i.test(msg)) setStatus("Ran out of memory. Try the CPU engine or a smaller model.","bad");
    else if(!navigator.onLine) setStatus("You're offline and this model isn't fully downloaded yet. Downloaded parts are saved.","bad");
    else setStatus("Load failed: "+msg+". Downloaded parts are saved; open the log for details.","bad");
  }finally{ busy=false; $("loadBtn").disabled=false; showStorage(); }
}
$("loadBtn").onclick = loadModel;

// ---------- chat ----------
function saveChat(){ ls.set("lg-chat", JSON.stringify(history.slice(-40))); }
async function send(){
  const text=$("prompt").value.trim();
  if(!text || !generator || busy) return;
  busy=true; $("prompt").value=""; $("sendBtn").disabled=true; $("stopBtn").disabled=false;
  addMessage("user",text); history.push({role:"user",content:text}); saveChat();
  const out=addMessage("assistant","…"); let streamed="";
  try{
    const streamer=new lib.TextStreamer(generator.tokenizer,{ skip_prompt:true, skip_special_tokens:true,
      callback_function:t=>{ streamed+=t; out.textContent=streamed; out.scrollIntoView({block:"end"}); } });
    stopper = lib.InterruptableStoppingCriteria ? new lib.InterruptableStoppingCriteria() : null;
    const t0=performance.now();
    const result=await generator(history.slice(-HISTORY_TURNS), { max_new_tokens:MAX_NEW_TOKENS, do_sample:false, streamer, ...(stopper?{stopping_criteria:stopper}:{}) });
    const reply=(result?.[0]?.generated_text?.at?.(-1)?.content ?? streamed).trim() || "(no response)";
    out.textContent=reply; history.push({role:"assistant",content:reply}); saveChat();
    log(`Reply in ${((performance.now()-t0)/1000).toFixed(1)} s`);
  }catch(e){
    console.error(e); log(`GENERATION ERROR: ${e?.name}: ${e?.message}\n${e?.stack||""}`);
    out.textContent="Error: "+(e?.message||e); history.pop(); saveChat();
  }finally{ busy=false; stopper=null; $("sendBtn").disabled=false; $("stopBtn").disabled=true; }
}
$("sendBtn").onclick=send;
$("prompt").addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); send(); } });
$("stopBtn").onclick=()=>stopper?.interrupt();
$("clearChatBtn").onclick=()=>{ history=[]; saveChat(); $("messages").innerHTML=""; };
$("setupBtn").onclick=()=>{ $("setup").hidden=!$("setup").hidden; };
$("copyLogBtn").onclick=async()=>{ try{ await navigator.clipboard.writeText($("log").textContent); setStatus("Log copied."); }catch{ setStatus("Couldn't copy; long-press the log to select it."); } };

$("clearCacheBtn").onclick=async()=>{
  if(busy) return;
  if(!confirm("Delete all downloaded models from this phone?")) return;
  try{
    if(generator){ try{ await generator.dispose?.(); }catch{} generator=null; }
    if(dbPromise){ (await dbPromise).close(); dbPromise=null; }
    await new Promise((res,rej)=>{ const r=indexedDB.deleteDatabase("local-gemma-store"); r.onsuccess=res; r.onerror=()=>rej(r.error); r.onblocked=res; });
    for(const k of await caches.keys()) if(/transformers/i.test(k)) await caches.delete(k);
    for(const m of MODELS) ls.del("lg-ready:"+m.id);
    fillModels(); showStorage(); setProgress(0);
    $("prompt").disabled=true; $("sendBtn").disabled=true;
    setStatus("Downloaded models deleted."); log("Storage cleared.");
  }catch(e){ setStatus("Couldn't clear: "+e.message,"bad"); }
};

// ---------- startup: restore chat, detect crashes, auto-load ----------
try{ history = JSON.parse(ls.get("lg-chat")||"[]"); }catch{ history=[]; }
for(const h of history) addMessage(h.role,h.content,false);

const crashed = (()=>{ try{ return JSON.parse(ls.get("lg-loading")); }catch{ return null; } })();
if(crashed){
  ls.del("lg-loading");
  const n=$("notice"); n.hidden=false;
  n.textContent = `The app restarted while loading ${modelName(crashed.id)}. This usually means Safari ran out of memory (or the app was closed mid-way). `+
    (ls.get("lg-ready:"+crashed.id) || crashed.engine==="cpu"
      ? "Try a smaller model."
      : "Downloaded parts are saved: tap “Download & load” to continue. If it keeps restarting after the download finishes, switch the engine to CPU or pick a smaller model.");
  log("Detected a restart during the previous load.");
} else if(lastModel && ls.get("lg-ready:"+lastModel)){
  log("Auto-loading "+modelName(lastModel)+" from on-device storage.");
  loadModel();
}

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./sw.js").then(()=>log("Offline support on.")).catch(e=>log("Service worker not registered: "+e.message));
}
</script>
</body>
</html>
