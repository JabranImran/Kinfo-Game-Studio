<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>HTML Game Studio</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #070910;
    color: white;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body::before {

    content: "";

    position: fixed;

    inset: 0;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(80,120,255,.12),
            transparent 30%
        ),
        radial-gradient(
            circle at 80% 70%,
            rgba(180,70,255,.10),
            transparent 30%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(0,220,255,.08),
            transparent 35%
        );

    pointer-events: none;
}

button,
input,
textarea,
select {
    font-family: inherit;
}


/* =====================================================
   APP
===================================================== */

#app {

    position: relative;

    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;
}


/* =====================================================
   HEADER
===================================================== */

header {

    height: 70px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 20px;

    border-bottom:
        1px solid
        rgba(255,255,255,.08);

    background:
        rgba(8,10,20,.75);

    backdrop-filter: blur(20px);

    z-index: 20;
}

.logo {

    display: flex;
    align-items: center;

    gap: 10px;

    font-size: 20px;
    font-weight: 800;
}

.logoIcon {

    width: 38px;
    height: 38px;

    border-radius: 12px;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            135deg,
            #5d7cff,
            #b05cff
        );

    box-shadow:
        0 0 25px
        rgba(100,100,255,.35);
}

.status {

    font-size: 12px;

    color: #8d96a8;
}


/* =====================================================
   NAVIGATION
===================================================== */

nav {

    height: 64px;

    display: flex;

    padding: 8px;

    gap: 8px;

    background:
        rgba(5,7,14,.85);

    border-bottom:
        1px solid
        rgba(255,255,255,.07);

    z-index: 20;
}

.navButton {

    flex: 1;

    border: 0;

    border-radius: 12px;

    background: transparent;

    color: #8d96a8;

    font-size: 14px;
    font-weight: 700;

    cursor: pointer;
}

.navButton.active {

    color: white;

    background:
        rgba(255,255,255,.09);

    box-shadow:
        inset 0 0 0 1px
        rgba(255,255,255,.08);
}


/* =====================================================
   MAIN
===================================================== */

main {

    flex: 1;

    overflow: hidden;
}

.page {

    display: none;

    width: 100%;
    height: 100%;

    overflow-y: auto;

    padding: 20px;
}

.page.active {
    display: block;
}


/* =====================================================
   COMMON
===================================================== */

h1 {

    margin: 0;

    font-size: 27px;
}

.subtitle {

    margin-top: 5px;

    color: #8992a5;

    font-size: 13px;
}

.primary {

    border: 0;

    padding: 12px 16px;

    border-radius: 12px;

    color: white;

    background:
        linear-gradient(
            135deg,
            #5c79ff,
            #9b54ff
        );

    font-weight: 800;

    cursor: pointer;

    box-shadow:
        0 8px 25px
        rgba(90,80,255,.2);
}

.secondary {

    border:
        1px solid
        rgba(255,255,255,.1);

    padding: 11px 15px;

    border-radius: 12px;

    color: white;

    background:
        rgba(255,255,255,.05);

    font-weight: 700;

    cursor: pointer;
}

.danger {

    color: #ff7c8c !important;
}


/* =====================================================
   GAMES
===================================================== */

.libraryTop {

    display: flex;

    justify-content: space-between;
    align-items: center;

    gap: 15px;

    margin-bottom: 20px;
}

.gameGrid {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(240px,1fr)
        );

    gap: 18px;
}

.gameCard {

    position: relative;

    min-height: 205px;

    padding: 20px;

    border-radius: 20px;

    overflow: hidden;

    background:
        linear-gradient(
            145deg,
            rgba(70,90,180,.22),
            rgba(20,25,45,.9)
        );

    border:
        1px solid
        rgba(255,255,255,.09);

    transition:
        transform .2s,
        border .2s,
        box-shadow .2s;
}

.gameCard:hover {

    transform:
        translateY(-4px);

    border-color:
        rgba(130,150,255,.5);

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.35);
}

.gameIcon {

    width: 58px;
    height: 58px;

    border-radius: 17px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 27px;

    margin-bottom: 15px;

    background:
        rgba(255,255,255,.1);
}

.gameName {

    font-size: 18px;

    font-weight: 800;
}

.gameFile {

    margin-top: 5px;

    font-size: 12px;

    color: #7e8798;
}

.saveInfo {

    margin-top: 10px;

    font-size: 11px;

    color: #7d87a0;
}

.cardButtons {

    display: flex;

    gap: 8px;

    margin-top: 15px;
}

.cardButtons button {

    flex: 1;

    padding: 9px;

    border-radius: 9px;

    border:
        1px solid
        rgba(255,255,255,.1);

    background:
        rgba(255,255,255,.05);

    color: white;

    font-weight: 700;

    cursor: pointer;
}

.cardButtons .playButton {

    background:
        rgba(80,120,255,.2);

    border-color:
        rgba(100,130,255,.3);
}

.saveVersion {

    margin-top: 12px;

    padding-top: 12px;

    border-top:
        1px solid
        rgba(255,255,255,.06);
}

.saveVersionTitle {

    font-size: 12px;

    color: #c5ccda;

    font-weight: 700;
}

.saveVersionButtons {

    display: flex;

    gap: 6px;

    margin-top: 7px;
}

.saveVersionButtons button {

    flex: 1;

    padding: 7px;

    border-radius: 8px;

    border:
        1px solid
        rgba(255,255,255,.08);

    background:
        rgba(255,255,255,.04);

    color: white;

    font-size: 11px;
}

.empty {

    padding: 60px 20px;

    text-align: center;

    color: #737c8f;

    border:
        1px dashed
        rgba(255,255,255,.12);

    border-radius: 20px;
}


/* =====================================================
   GENERATOR
===================================================== */

.generator {

    display: grid;

    grid-template-columns:
        minmax(300px,1fr)
        minmax(300px,1fr);

    gap: 18px;

    height:
        calc(100vh - 154px);
}

.panel {

    min-height: 0;

    display: flex;
    flex-direction: column;

    background:
        rgba(15,18,30,.75);

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius: 18px;

    overflow: hidden;
}

.panelHeader {

    min-height: 58px;

    padding: 12px 15px;

    display: flex;

    justify-content: space-between;
    align-items: center;

    gap: 10px;

    border-bottom:
        1px solid
        rgba(255,255,255,.07);
}

.panelTitle {

    font-weight: 800;
}

.panelControls {

    display: flex;

    gap: 7px;

    flex-wrap: wrap;
}

.smallButton {

    border:
        1px solid
        rgba(255,255,255,.1);

    background:
        rgba(255,255,255,.05);

    color: white;

    border-radius: 9px;

    padding: 7px 10px;

    font-size: 12px;

    cursor: pointer;
}


/* =====================================================
   GAME NAME BAR
===================================================== */

.gameProjectBar {

    padding: 12px;

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 8px;

    border-bottom:
        1px solid
        rgba(255,255,255,.07);
}

.projectInput {

    width: 100%;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius: 9px;

    background:
        rgba(255,255,255,.04);

    color: white;

    padding: 10px;

    outline: none;
}

.projectInput:focus {

    border-color:
        rgba(100,130,255,.5);
}


/* =====================================================
   BLOCK LIST
===================================================== */

.blockList {

    flex: 1;

    overflow-y: auto;

    padding: 12px;
}

.codeBlock {

    margin-bottom: 12px;

    border-radius: 13px;

    overflow: hidden;

    border:
        1px solid
        rgba(255,255,255,.08);

    background:
        #0b0e18;
}

.configBlock {

    border-color:
        rgba(130,100,255,.5);

    box-shadow:
        0 0 20px
        rgba(100,80,255,.08);
}

.blockTop {

    display: flex;

    align-items: center;

    gap: 8px;

    padding: 8px;

    background:
        rgba(255,255,255,.04);
}

.blockName {

    flex: 1;

    min-width: 0;

    border: 0;

    outline: 0;

    background: transparent;

    color: white;

    font-weight: 700;

    padding: 5px;
}

.typeSelect {

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius: 7px;

    padding: 6px;

    background:
        #151a28;

    color: white;
}

.deleteBlock {

    border: 0;

    background: transparent;

    color: #ff6f7f;

    font-size: 17px;

    cursor: pointer;
}

textarea {

    display: block;

    width: 100%;

    min-height: 140px;

    resize: vertical;

    border: 0;

    outline: 0;

    padding: 14px;

    color: #dce2ef;

    background:
        #080b13;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size: 12px;

    line-height: 1.55;
}

.blockBadge {

    font-size: 9px;

    padding: 4px 7px;

    border-radius: 6px;

    background:
        rgba(140,100,255,.15);

    color:
        #b8a3ff;

    font-weight: 800;
}


/* =====================================================
   UNIVERSAL BLOCKS PANEL
===================================================== */

.libraryPanel {

    padding: 12px;

    border-top:
        1px solid
        rgba(255,255,255,.07);

    max-height: 190px;

    overflow-y: auto;
}

.libraryPanelTitle {

    font-size: 11px;

    text-transform: uppercase;

    letter-spacing: 1px;

    color: #788196;

    margin-bottom: 9px;
}

.libraryBlock {

    display: flex;

    align-items: center;

    gap: 8px;

    padding: 8px 9px;

    margin-bottom: 5px;

    border-radius: 8px;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid
        rgba(255,255,255,.05);
}

.libraryBlockName {

    flex: 1;

    font-size: 11px;

    font-weight: 700;
}

.libraryBlockType {

    font-size: 9px;

    color: #778197;
}

.libraryBlock button {

    border: 0;

    background: transparent;

    color: #93a7ff;

    font-weight: 800;

    cursor: pointer;
}


/* =====================================================
   OUTPUT
===================================================== */

.outputArea {

    flex: 1;

    min-height: 0;

    display: flex;

    flex-direction: column;
}

#outputCode {

    flex: 1;

    min-height: 0;

    resize: none;
}

.preview {

    height: 50%;

    min-height: 200px;

    border-top:
        1px solid
        rgba(255,255,255,.08);

    background: white;
}

.preview iframe {

    width: 100%;
    height: 100%;

    border: 0;

    background: white;
}

.generatorToolbar {

    display: flex;

    gap: 8px;

    flex-wrap: wrap;

    padding: 12px;

    border-top:
        1px solid
        rgba(255,255,255,.08);
}


/* =====================================================
   MODAL
===================================================== */

.modal {

    position: fixed;

    inset: 0;

    z-index: 100;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background:
        rgba(0,0,0,.65);

    backdrop-filter:
        blur(10px);
}

.modal.show {

    display: flex;
}

.modalBox {

    width: min(
        600px,
        100%
    );

    max-height: 90vh;

    overflow-y: auto;

    padding: 20px;

    border-radius: 20px;

    background:
        #101420;

    border:
        1px solid
        rgba(255,255,255,.1);

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.5);
}

.modalTitle {

    font-size: 20px;

    font-weight: 800;

    margin-bottom: 15px;
}

.modalField {

    margin-bottom: 13px;
}

.modalField label {

    display: block;

    margin-bottom: 6px;

    color: #8d96a8;

    font-size: 12px;
}

.modalField input,
.modalField select,
.modalField textarea {

    width: 100%;

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius: 9px;

    background:
        #080b13;

    color: white;

    padding: 10px;

    outline: none;
}

.modalField textarea {

    min-height: 220px;
}

.modalButtons {

    display: flex;

    justify-content: flex-end;

    gap: 8px;

    margin-top: 15px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:800px) {

    header {

        height: 62px;

        padding: 0 14px;
    }

    .logo {

        font-size: 17px;
    }

    .status {

        display: none;
    }

    nav {

        height: 58px;
    }

    .page {

        padding: 14px;
    }

    .libraryTop {

        align-items: flex-start;
    }

    .gameGrid {

        grid-template-columns:
            repeat(2,1fr);

        gap: 12px;
    }

    .gameCard {

        min-height: 190px;

        padding: 15px;
    }

    .gameIcon {

        width: 48px;
        height: 48px;

        font-size: 22px;
    }

    .gameName {

        font-size: 15px;
    }

    .generator {

        grid-template-columns: 1fr;

        height: auto;
    }

    .panel {

        min-height: 420px;
    }

    .outputArea {

        min-height: 600px;
    }

    .gameProjectBar {

        grid-template-columns: 1fr;
    }
}

</style>
</head>


<body>

<div id="app">


<header>

    <div class="logo">

        <div class="logoIcon">
            🎮
        </div>

        HTML Game Studio

    </div>

    <div class="status"
         id="statusText">

        V0.1 • Projects

    </div>

</header>


<nav>

    <button
        class="navButton active"
        onclick="showPage('library',this)">

        🎮 Games

    </button>

    <button
        class="navButton"
        onclick="showPage('generator',this)">

        🛠️ Generator

    </button>

</nav>


<main>


<!-- =====================================================
     GAMES
===================================================== -->

<section
    id="library"
    class="page active">


    <div class="libraryTop">

        <div>

            <h1>
                Game Library
            </h1>

            <div class="subtitle">

                Your saved game projects

            </div>

        </div>


        <button
            class="primary"
            onclick="newGame()">

            ＋ New Game

        </button>

    </div>


    <div
        id="gameGrid"
        class="gameGrid">

    </div>


</section>


<!-- =====================================================
     GENERATOR
===================================================== -->

<section
    id="generator"
    class="page">


<div class="generator">


<!-- =====================================================
     LEFT PANEL
===================================================== -->

<div class="panel">


    <div class="panelHeader">

        <div class="panelTitle">

            🧩 Game Blocks

        </div>


        <div class="panelControls">

            <button
                class="smallButton"
                onclick="addUniversalToGame()">

                ＋ Add

            </button>

            <button
                class="smallButton"
                onclick="openUniversalEditor()">

                🧩 Library

            </button>

        </div>

    </div>


    <div class="gameProjectBar">

        <input
            id="gameName"
            class="projectInput"
            placeholder="Game name">

        <input
            id="gameFile"
            class="projectInput"
            placeholder="game.html">

    </div>


    <div
        id="blockList"
        class="blockList">

    </div>


    <div
        id="libraryPanel"
        class="libraryPanel">

        <div class="libraryPanelTitle">

            Universal Block Library

        </div>

        <div
            id="universalList">

        </div>

    </div>


</div>


<!-- =====================================================
     RIGHT PANEL
===================================================== -->

<div class="panel">


    <div class="panelHeader">

        <div class="panelTitle">

            ⚙️ Generated Game

        </div>

        <div
            id="currentSaveLabel"
            class="blockBadge">

            NEW

        </div>

    </div>


    <div class="outputArea">

        <textarea
            id="outputCode"
            spellcheck="false"
            placeholder="Your complete HTML game will appear here..."></textarea>


        <div class="preview">

            <iframe
                id="previewFrame"
                sandbox="allow-scripts allow-pointer-lock">

            </iframe>

        </div>

    </div>


    <div class="generatorToolbar">

        <button
            class="primary"
            onclick="buildGame()">

            🔨 Build

        </button>

        <button
            class="secondary"
            onclick="runGame()">

            ▶️ Test

        </button>

        <button
            class="secondary"
            onclick="saveGame()">

            💾 Save

        </button>

        <button
            class="secondary"
            onclick="saveAsGame()">

            💾 Save As

        </button>

        <button
            class="secondary"
            onclick="downloadGame()">

            ⬇️ HTML

        </button>

        <button
            class="secondary danger"
            onclick="clearGenerator()">

            Clear

        </button>

    </div>


</div>

</div>

</section>

</main>

</div>


<!-- =====================================================
     UNIVERSAL BLOCK MODAL
===================================================== -->

<div
    id="universalModal"
    class="modal">

    <div class="modalBox">

        <div class="modalTitle">

            🧩 Universal Code Block

        </div>


        <div class="modalField">

            <label>
                Block name
            </label>

            <input
                id="universalName"
                placeholder="Example: Player Controller">

        </div>


        <div class="modalField">

            <label>
                Code type
            </label>

            <select id="universalType">

                <option value="html">
                    HTML
                </option>

                <option value="css">
                    CSS
                </option>

                <option value="js">
                    JavaScript
                </option>

            </select>

        </div>


        <div class="modalField">

            <label>
                Code
            </label>

            <textarea
                id="universalCode"
                spellcheck="false"
                placeholder="Enter the reusable code here..."></textarea>

        </div>


        <div class="modalButtons">

            <button
                class="secondary"
                onclick="closeUniversalEditor()">

                Cancel

            </button>

            <button
                class="primary"
                onclick="saveUniversalBlock()">

                Save Block

            </button>

        </div>

    </div>

</div>


<script>


/* =====================================================
   STORAGE
===================================================== */

const STORAGE_KEY =
    "HTML_GAME_STUDIO_V01";


let studio = {

    universalBlocks: [],

    games: [],

    currentGameId: null,

    currentSaveId: null

};


function saveStudio() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(studio)
    );

}


function loadStudio() {

    const saved =
        localStorage.getItem(
            STORAGE_KEY
        );


    if (saved) {

        try {

            studio =
                JSON.parse(saved);

        }

        catch {

            studio = {
                universalBlocks: [],
                games: [],
                currentGameId: null,
                currentSaveId: null
            };

        }

    }


    if (
        !Array.isArray(
            studio.universalBlocks
        )
    ) {

        studio.universalBlocks = [];

    }


    if (
        !Array.isArray(
            studio.games
        )
    ) {

        studio.games = [];

    }

}


/* =====================================================
   IDs
===================================================== */

function id() {

    return (
        Date.now().toString(36) +
        Math.random()
            .toString(36)
            .slice(2,8)
    );

}


/* =====================================================
   DEFAULT UNIVERSAL BLOCKS
===================================================== */

function createDefaultBlocks() {

    if (
        studio.universalBlocks.length
    )
        return;


    studio.universalBlocks = [

        {
            id: id(),
            name: "Core HTML",
            type: "html",
            code:
`<canvas id="game"></canvas>`
        },


        {
            id: id(),
            name: "Game CSS",
            type: "css",
            code:
`html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050816;
}

canvas {
    width: 100%;
    height: 100%;
    display: block;
}`
        },


        {
            id: id(),
            name: "Three.js",
            type: "js",
            code:
`const THREE_SCRIPT =
    document.createElement("script");

THREE_SCRIPT.src =
    "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js";

THREE_SCRIPT.onload = () => {

    if (typeof startGame === "function") {
        startGame();
    }

};

document.head.appendChild(
    THREE_SCRIPT
);`
        },


        {
            id: id(),
            name: "Renderer",
            type: "js",
            code:
`let scene;
let camera;
let renderer;

function createRenderer() {

    scene =
        new THREE.Scene();

    camera =
        new THREE.PerspectiveCamera(
            70,
            window.innerWidth /
            window.innerHeight,
            0.1,
            2000
        );

    renderer =
        new THREE.WebGLRenderer({
            antialias: true
        });

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    document.body.appendChild(
        renderer.domElement
    );

}`
        },


        {
            id: id(),
            name: "Player",
            type: "js",
            code:
`let player;

function createPlayer() {

    player =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                1,
                1,
                2
            ),

            new THREE.MeshStandardMaterial({
                color: 0x5599ff
            })

        );

    scene.add(player);

}`
        },


        {
            id: id(),
            name: "Camera",
            type: "js",
            code:
`function updateCamera() {

    if (!camera || !player)
        return;

    camera.position.lerp(
        new THREE.Vector3(
            player.position.x,
            player.position.y + 4,
            player.position.z + 10
        ),
        0.08
    );

    camera.lookAt(
        player.position
    );

}`
        },


        {
            id: id(),
            name: "Game Loop",
            type: "js",
            code:
`function animate() {

    requestAnimationFrame(
        animate
    );

    if (typeof updateGame === "function") {
        updateGame();
    }

    if (typeof updateCamera === "function") {
        updateCamera();
    }

    renderer.render(
        scene,
        camera
    );

}`
        }

    ];

}

===================================================== */

function loadGame(
    gameId,
    saveId = null
) {

    const game =
        studio.games.find(
            g => g.id === gameId
        );


    if (!game)
        return;


    const save =
        game.saves.find(
            s =>
                s.id ===
                (
                    saveId ||
                    game.saves[
                        game.saves.length - 1
                    ].id
                )
        );


    if (!save)
        return;


    studio.currentGameId =
        game.id;

    studio.currentSaveId =
        save.id;


    saveStudio();

    loadCurrentGame();

    showGenerator();

}

/* =====================================================
   ADD UNIVERSAL BLOCK
===================================================== */

function addUniversalToGame() {

    const names =
        getSelectedNames();


    const available =
        studio.universalBlocks
            .filter(
                b =>
                    !names.includes(
                        b.name
                    )
            );


    if (!available.length) {

        alert(
            "All universal blocks are already in this game."
        );

        return;

    }


    const choice =
        prompt(
            "Enter the exact name of the universal block to add:\n\n" +
            available
                .map(
                    b =>
                        "• " + b.name
                )
                .join("\n")
        );


    if (!choice)
        return;


    const block =
        available.find(
            b =>
                b.name
                    .toLowerCase() ===
                choice
                    .trim()
                    .toLowerCase()
        );


    if (!block) {

        alert(
            "That universal block was not found."
        );

        return;

    }


    names.push(
        block.name
    );


    updateSelectedBlocks(
        names
    );

}


/* =====================================================
   REMOVE BLOCK
===================================================== */

function removeBlockFromGame(
    name
) {

    const names =
        getSelectedNames()
            .filter(
                n =>
                    n !== name
            );


    updateSelectedBlocks(
        names
    );

}

   UNIVERSAL LIBRARY

function renderUniversalList() {

    const container =
        document.getElementById(
            "universalList"
        );


    container.innerHTML = "";


    studio.universalBlocks
        .forEach(
            block => {

                const row =
                    document.createElement(

                    );

                row.className =

                const selected =

                        .includes(

                        );

                        )}

                        }

                );

/* =====================================================
   SAVE UNIVERSAL BLOCK
===================================================== */

function saveUniversalBlock() {

    const name =
        document.getElementById(
            "universalName"
        ).value.trim();


    const type =
        document.getElementById(
            "universalType"
        ).value;


    const code =
        document.getElementById(
            "universalCode"
        ).value;


    if (!name) {

        alert(
            "Please give the block a name."
        );

        return;

    }


    if (!code.trim()) {

        alert(
            "Please enter some code."
        );

        return;

    }


    const duplicate =
        studio.universalBlocks
            .find(
                b =>
                    b.name
                        .toLowerCase() ===
                    name.toLowerCase() &&
                    b.id !==
                    editingUniversalId
            );


    if (duplicate) {

        alert(
            "A universal block with that name already exists."
        );

        return;

    }


    if (editingUniversalId) {

        const block =
            studio.universalBlocks
                .find(
                    b =>
                        b.id ===
                        editingUniversalId
                );


        block.name =
            name;

        block.type =
            type;

        block.code =
            code;

    }

    else {

        studio.universalBlocks.push({

            id: id(),

            name: name,

            type: type,

            code: code

        });

    }


    saveStudio();

    closeUniversalEditor();

    renderUniversalList();

    renderGameBlocks(
        getSelectedNames()
    );

}

/* =====================================================
   BUILD GAME
===================================================== */

function buildGame() {

    const names =
        getSelectedNames();


    const htmlBlocks = [];
    const cssBlocks = [];
    const jsBlocks = [];


    names.forEach(
        name => {

            const block =
                studio.universalBlocks
                    .find(
                        b =>
                            b.name === name
                    );


            if (!block)
                return;


            if (
                block.type === "html"
            ) {

                htmlBlocks.push(
                    "\n<!-- " +
                    block.name +
                    " -->\n" +
                    block.code
                );

            }


            if (
                block.type === "css"
            ) {

                cssBlocks.push(
                    "\n/* " +
                    block.name +
                    " */\n" +
                    block.code
                );

            }


            if (
                block.type === "js"
            ) {

                jsBlocks.push(
                    "\n// " +
                    block.name +
                    "\n" +
                    block.code
                );

            }

        }
    );


    const game =
        studio.games.find(
            g =>
                g.id ===
                studio.currentGameId
        );


    const title =
        game
            ? game.name
            : "Generated HTML Game";


    const result =
`<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>${escapeHTML(title)}</title>

<style>

${cssBlocks.join("\n")}

</style>

</head>

<body>

${htmlBlocks.join("\n")}

<script>

${jsBlocks.join("\n")}

<\/script>

</body>

</html>`;


    document.getElementById(
        "outputCode"
    ).value =
        result;


    saveGeneratedHTML(
        result
    );


    runGame();

}

/* =====================================================
   SAVE GAME
===================================================== */

function saveGame() {

    const game =
        studio.games.find(
            g =>
                g.id ===
                studio.currentGameId
        );


    if (!game) {

        newGame();

        return;

    }


    const name =
        document.getElementById(
            "gameName"
        ).value.trim();


    const file =
        document.getElementById(
            "gameFile"
        ).value.trim();


    if (name)
        game.name =
            name;


    if (file)
        game.file =
            file.endsWith(".html")
                ? file
                : file + ".html";


    saveGeneratedHTML(
        document.getElementById(
            "outputCode"
        ).value
    );


    saveStudio();


    document.getElementById(
        "currentSaveLabel"
    ).textContent =
        game.saves.find(
            s =>
                s.id ===
                studio.currentSaveId
        ).name;


    renderGames();

}

   SAVE AS
===================================================== */

function saveAsGame() {

    const originalGame =
        studio.games.find(
            g =>
                g.id ===
                studio.currentGameId
        );

    const currentSave =

        );

            )
        );

/* =====================================================
   DOWNLOAD
===================================================== */

function downloadGame() {

    let code =
        document.getElementById(
            "outputCode"
        ).value;


    if (!code.trim()) {

        buildGame();

        code =
            document.getElementById(
                "outputCode"
            ).value;

    }


    const game =
        studio.games.find(
            g =>
                g.id ===
                studio.currentGameId
        );


    const filename =
        game &&
        game.file
            ? game.file
            : "my-game.html";


    const blob =
        new Blob(
            [code],
            {
                type:
                    "text/html"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );


    a.href =
        url;

    a.download =
        filename;

    a.click();


    setTimeout(
        () =>
            URL.revokeObjectURL(
                url
            ),
        1000
    );

}


/* =====================================================
   PLAY SAVED GAME
===================================================== */

function playSavedGame(
    gameId,
    saveId
) {

    const game =
        studio.games.find(
            g =>
                g.id === gameId
        );


    if (!game)
        return;


    const save =
        game.saves.find(
            s =>
                s.id === saveId
        );


    if (
        !save ||
        !save.generatedHTML
    ) {

        alert(
            "This save has not been built yet."
        );

        return;

    }


    const blob =
        new Blob(
            [
                save.generatedHTML
            ],
            {
                type:
                    "text/html"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    window.open(
        url,
        "_blank"
    );

}

/* =====================================================
   DELETE SAVE
===================================================== */

function deleteSave(
    gameId,
    saveId
) {

    const game =
        studio.games.find(
            g =>
                g.id === gameId
        );


    if (!game)
        return;


    if (
        game.saves.length <= 1
    ) {

        alert(
            "A game must have at least one save."
        );

        return;

    }


    const save =
        game.saves.find(
            s =>
                s.id === saveId
        );


    if (!save)
        return;


    if (
        !confirm(
            "Delete save '" +
            save.name +
            "'?"
        )
    )
        return;


    game.saves =
        game.saves.filter(
            s =>
                s.id !== saveId
        );


    if (
        studio.currentSaveId ===
        saveId
    ) {

        studio.currentSaveId =
            game.saves[
                game.saves.length - 1
            ].id;

    }


    saveStudio();

    renderGames();

}


/* =====================================================
   DELETE GAME
===================================================== */

function deleteGame(
    gameId
) {

    const game =
        studio.games.find(
            g =>
                g.id === gameId
        );


    if (!game)
        return;


    if (
        !confirm(
            "Delete '" +
            game.name +
            "' and all of its saves?"
        )
    )
        return;


    studio.games =
        studio.games.filter(
            g =>
                g.id !== gameId
        );


    if (
        studio.currentGameId ===
        gameId
    ) {

        studio.currentGameId =
            null;

        studio.currentSaveId =
            null;

    }


    saveStudio();

    renderGames();

}

                    width:100%;
                    margin-top:8px;
                    padding:7px;
                    border-radius:8px;
                    border:1px solid rgba(255,255,255,.06);
                    background:transparent;
                    color:#ff7180;
                    font-size:10px;"
                    onclick="
                    deleteGame(
                        '${game.id}'
                    )">

                    Delete Game

                </button>

            `;


            grid.appendChild(
                card
            );


            const savesContainer =
                document.getElementById(
                    "saves-" +
                    game.id
                );


            game.saves.forEach(
                save => {

                    const button =
                        document.createElement(
                            "button"
                        );


                    button.innerHTML =
                        escapeHTML(
                            save.name
                        );


                    button.onclick =
                        () =>
                            editGame(
                                game.id,
                                save.id
                            );


                    savesContainer.appendChild(
                        button
                    );

                }
            );

        }
    );

}

/* =====================================================

===================================================== */

function getGameIcon(
    index
) {

    const icons = [

        "🚀",
        "🌌",
        "🏎️",
        "🧟",
        "🤖",
        "👾",
        "⚔️",
        "🛸",
        "🌍",
        "💥",
        "🏰",
        "🪐"

    ];


    return icons[
        index %
        icons.length
    ];

}


/* =====================================================
   ESCAPING
===================================================== */

function escapeHTML(
    value
) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(
    value
) {

    return escapeHTML(
        value
    );

}
