<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>HTML Game Studio V2.1</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #070912;
    color: #f5f7ff;
}

body {
    -webkit-tap-highlight-color: transparent;
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
}

.header {
    height: 68px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    background: linear-gradient(180deg, #12172a, #0c1020);
    border-bottom: 1px solid rgba(255,255,255,.08);
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    border-radius: 12px;
    background: linear-gradient(135deg, #527cff, #a64dff);
    font-size: 21px;
    box-shadow: 0 8px 25px rgba(100,90,255,.25);
}

.brandText strong {
    display: block;
    font-size: 15px;
}

.brandText span {
    display: block;
    margin-top: 2px;
    font-size: 10px;
    letter-spacing: 2px;
    color: #8f98b6;
}

.tabs {
    height: 58px;
    flex-shrink: 0;
    display: flex;
    padding: 8px 12px;
    gap: 8px;
    background: #090d19;
    border-bottom: 1px solid rgba(255,255,255,.06);
}

.tab {
    flex: 1;
    border: 0;
    border-radius: 12px;
    color: #8f98b6;
    background: transparent;
    font-weight: 700;
    font-size: 13px;
}

.tab.active {
    color: white;
    background: rgba(95,110,255,.16);
    box-shadow: inset 0 0 0 1px rgba(110,120,255,.18);
}

.content {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 16px;
}

.page {
    display: none;
    max-width: 1100px;
    margin: 0 auto;
}

.page.active {
    display: block;
}

.card {
    background: linear-gradient(145deg, rgba(22,28,48,.94), rgba(12,16,30,.94));
    border: 1px solid rgba(255,255,255,.07);
    border-radius: 20px;
    padding: 18px;
    margin-bottom: 14px;
    box-shadow: 0 12px 40px rgba(0,0,0,.18);
}

.cardTitle {
    font-size: 16px;
    font-weight: 800;
    margin-bottom: 4px;
}

.cardSub {
    color: #7f89a8;
    font-size: 12px;
}

.btn {
    border: 0;
    border-radius: 11px;
    padding: 10px 14px;
    color: white;
    background: #202944;
    font-weight: 700;
    transition: transform .12s, background .12s;
}

.btn:active {
    transform: scale(.97);
}

.btn.primary {
    background: linear-gradient(135deg, #547cff, #984cff);
}

.btn.danger {
    background: rgba(255,70,90,.13);
    color: #ff8190;
}

.btn.small {
    padding: 7px 10px;
    font-size: 11px;
}

.gameGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
}

.gameCard {
    min-height: 170px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 18px;
    border-radius: 18px;
    background: linear-gradient(145deg, #151c32, #0e1324);
    border: 1px solid rgba(255,255,255,.07);
}

.gameIcon {
    width: 50px;
    height: 50px;
    display: grid;
    place-items: center;
    border-radius: 15px;
    background: linear-gradient(135deg, #2d67ff, #8d42ed);
    font-size: 24px;
}

.gameName {
    margin-top: 12px;
    font-weight: 800;
    font-size: 16px;
}

.gameMeta {
    margin-top: 4px;
    color: #7d87a5;
    font-size: 11px;
}

.gameActions {
    display: flex;
    gap: 8px;
    margin-top: 15px;
}

.field {
    margin-bottom: 14px;
}

label {
    display: block;
    margin-bottom: 7px;
    font-size: 11px;
    color: #9ba5c2;
    letter-spacing: .5px;
}

input,
select,
textarea {
    width: 100%;
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px;
    background: #080c18;
    color: white;
    outline: none;
}

input,
select {
    padding: 11px 12px;
}

textarea {
    min-height: 190px;
    padding: 13px;
    resize: vertical;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
    line-height: 1.55;
}

input:focus,
select:focus,
textarea:focus {
    border-color: rgba(110,125,255,.5);
}

.blockList {
    display: flex;
    flex-direction: column;
    gap: 9px;
}

.blockRow {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px;
    border-radius: 13px;
    background: rgba(255,255,255,.025);
    border: 1px solid rgba(255,255,255,.06);
}

.blockCheck {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
}

.blockInfo {
    flex: 1;
    min-width: 0;
}

.blockName {
    font-size: 13px;
    font-weight: 700;
}

.blockDetails {
    margin-top: 3px;
    color: #747f9e;
    font-size: 10px;
}

.typeBadge {
    padding: 4px 7px;
    border-radius: 7px;
    background: rgba(100,120,255,.12);
    color: #9aaaff;
    font-size: 9px;
    font-weight: 800;
}

.report {
    display: none;
    margin-top: 15px;
    border-radius: 16px;
    padding: 15px;
    background: #070b14;
    border: 1px solid rgba(255,255,255,.07);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11px;
    line-height: 1.65;
}

.report.visible {
    display: block;
}

.reportTitle {
    color: white;
    font-weight: 800;
    margin-bottom: 9px;
}

.reportLine {
    color: #8993ae;
}

.reportLine.ok {
    color: #74e4a1;
}

.reportLine.warn {
    color: #f0ca70;
}

.reportLine.error {
    color: #ff7887;
}

.reportSection {
    margin-top: 10px;
    color: #c7cee2;
    font-weight: 800;
}

.empty {
    padding: 35px 15px;
    text-align: center;
    color: #707a98;
    border: 1px dashed rgba(255,255,255,.08);
    border-radius: 17px;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    padding: 20px;
    background: rgba(0,0,0,.72);
    backdrop-filter: blur(10px);
    align-items: center;
    justify-content: center;
}

.modal.visible {
    display: flex;
}

.modalBox {
    width: min(650px, 100%);
    max-height: 90vh;
    overflow: auto;
    border-radius: 22px;
    padding: 20px;
    background: linear-gradient(145deg, #151b30, #0c1121);
    border: 1px solid rgba(255,255,255,.1);
    box-shadow: 0 30px 100px rgba(0,0,0,.55);
}

.modalHeader {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
}

.close {
    width: 34px;
    height: 34px;
    border: 0;
    border-radius: 10px;
    background: #222a42;
    color: white;
}

#errorPanel {
    display: none;
    position: fixed;
    left: 12px;
    right: 12px;
    bottom: 12px;
    z-index: 9999;
    padding: 14px;
    border-radius: 15px;
    background: #35151c;
    border: 1px solid rgba(255,100,120,.4);
    box-shadow: 0 15px 50px rgba(0,0,0,.5);
}

#errorPanel.visible {
    display: block;
}

.errorTitle {
    color: #ff8998;
    font-weight: 800;
    margin-bottom: 6px;
}

#errorMessage {
    color: #ffc4cc;
    font-family: ui-monospace, monospace;
    font-size: 11px;
    white-space: pre-wrap;
    word-break: break-word;
}

#errorClose {
    float: right;
}

@media (max-width: 600px) {
    .header {
        height: 62px;
    }

    .content {
        padding: 11px;
    }

    .gameGrid {
        grid-template-columns: 1fr 1fr;
    }

    .gameActions {
        flex-direction: column;
    }

    .gameActions .btn {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="header">

        <div class="brand">

            <div class="logo">🧩</div>

            <div class="brandText">
                <strong>HTML Game Studio</strong>
                <span>V2.1 • DEPENDENCY ENGINE</span>
            </div>

        </div>

        <button class="btn primary small" onclick="newGame()">
            ＋ New Game
        </button>

    </header>


    <nav class="tabs">

        <button id="gamesTab" class="tab active" onclick="showPage('games')">
            🎮 Games
        </button>

        <button id="blocksTab" class="tab" onclick="showPage('blocks')">
            🧩 Blocks
        </button>

        <button id="studioTab" class="tab" onclick="showPage('studio')">
            ⚙️ Generator
        </button>

    </nav>


    <main class="content">

        <section id="gamesPage" class="page active">

            <div class="card">

                <div class="cardTitle">
                    Your Games
                </div>

                <div class="cardSub">
                    Saved games and generated builds.
                </div>

            </div>

            <div id="gameGrid" class="gameGrid"></div>

        </section>


        <section id="blocksPage" class="page">

            <div class="card">

                <div class="cardTitle">
                    Universal Code Blocks
                </div>

                <div class="cardSub">
                    These blocks are available to every game.
                </div>

            </div>

            <div id="blockList" class="blockList"></div>

            <div style="margin-top:15px">

                <button class="btn primary" onclick="openBlockEditor()">
                    ＋ Create Block
                </button>

            </div>

        </section>


        <section id="studioPage" class="page">

            <div class="card">

                <div class="cardTitle">
                    Game Generator
                </div>

                <div class="cardSub">
                    Select blocks and let the dependency engine build the game.
                </div>

            </div>


            <div class="card">

                <div class="field">

                    <label>GAME NAME</label>

                    <input id="gameName" placeholder="My Awesome Game">

                </div>


                <div class="field">

                    <label>SAVE NAME</label>

                    <input id="saveName" placeholder="Version 1">

                </div>


                <div class="field">

                    <label>BLOCKS USED BY THIS GAME</label>

                    <div id="generatorBlocks" class="blockList"></div>

                </div>


                <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:15px;">

                    <button class="btn" onclick="selectAllBlocks()">
                        Select All
                    </button>

                    <button class="btn" onclick="clearAllBlocks()">
                        Clear
                    </button>

                    <button class="btn primary" onclick="buildCurrentGame()">
                        🔨 Build Game
                    </button>

                </div>


                <div id="buildReport" class="report"></div>

            </div>

        </section>

    </main>

</div>


<div id="blockModal" class="modal">

    <div class="modalBox">

        <div class="modalHeader">

            <div class="cardTitle">
                Code Block
            </div>

            <button class="close" onclick="closeBlockEditor()">
                ×
            </button>

        </div>


        <div class="field">

            <label>BLOCK NAME</label>

            <input id="blockEditorName" placeholder="Example: Three.js">

        </div>


        <div class="field">

            <label>BLOCK TYPE</label>

            <select id="blockEditorType">

                <option value="html">HTML</option>
                <option value="css">CSS</option>
                <option value="js">JavaScript</option>

            </select>

        </div>


        <div class="field">

            <label>DEPENDENCIES</label>

            <input id="blockEditorDependencies" placeholder="Renderer, Camera">

            <div style="margin-top:6px; color:#737e9b; font-size:10px;">
                Enter other block names separated by commas.
            </div>

        </div>


        <div class="field">

            <label>CODE</label>

            <textarea id="blockEditorCode" placeholder="Paste the code for this block here..."></textarea>

        </div>


        <div style="display:flex; gap:8px; justify-content:flex-end;">

            <button class="btn" onclick="closeBlockEditor()">
                Cancel
            </button>

            <button class="btn primary" onclick="saveBlock()">
                Save Block
            </button>

        </div>

    </div>

</div>


<div id="errorPanel">

    <button id="errorClose" class="btn small" onclick="hideError()">
        ×
    </button>

    <div class="errorTitle">
        ⚠ Studio Error
    </div>

    <div id="errorMessage"></div>

</div>


<script>
var STORAGE_KEY = "html_game_studio_v21";

var studio = {
    blocks: [],
    games: []
};

var editingGameId = null;
var editingBlockId = null;


function showError(message) {
    var panel = document.getElementById("errorPanel");
    var box = document.getElementById("errorMessage");

    if (!panel || !box) {
        alert("Studio error:\n\n" + message);
        return;
    }

    box.textContent = message;
    panel.classList.add("visible");
}


function hideError() {
    var panel = document.getElementById("errorPanel");

    if (panel) {
        panel.classList.remove("visible");
    }
}


window.addEventListener("error", function(event) {
    showError(event.message || "Unknown JavaScript error.");
});


window.addEventListener("unhandledrejection", function(event) {
    showError(String(event.reason));
});


function makeId(prefix) {
    return prefix + "_" + Date.now().toString(36) + "_" +
        Math.random().toString(36).slice(2, 8);
}


function saveStudio() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(studio));
    } catch (error) {
        showError("Could not save Studio data:\n" + error.message);
    }
}


function loadStudio() {
    var saved = localStorage.getItem(STORAGE_KEY);

    if (!saved) {
        return;
    }

    try {
        var parsed = JSON.parse(saved);

        if (parsed && typeof parsed === "object") {
            studio.blocks = Array.isArray(parsed.blocks) ? parsed.blocks : [];
            studio.games = Array.isArray(parsed.games) ? parsed.games : [];
        }
    } catch (error) {
        studio = {
            blocks: [],
            games: []
        };

        showError("Saved Studio data was invalid and has been reset.");
    }
}


function installDefaultBlocks() {

    if (studio.blocks.length > 0) {

        studio.blocks.forEach(function(block) {

            if (!Array.isArray(block.dependencies)) {
                block.dependencies = [];
            }

        });

        saveStudio();
        return;
    }


    studio.blocks = [

        {
            id: makeId("block"),
            name: "Core HTML",
            type: "html",
            dependencies: [],
            code:
`<div id="game"></div>`
        },


        {
            id: makeId("block"),
            name: "Game CSS",
            type: "css",
            dependencies: [],
            code:
`html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #02040a;
    color: white;
}`
        },


        {
            id: makeId("block"),
            name: "Three.js",
            type: "js",
            dependencies: [],
            code:
`window.__THREE_READY__ = false;

var threeScript = document.createElement("script");

threeScript.src =
    "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js";

threeScript.onload = function() {

    window.__THREE_READY__ = true;

    if (typeof window.onThreeReady === "function") {
        window.onThreeReady();
    }

};

threeScript.onerror = function() {

    console.error("Three.js failed to load.");

};

document.head.appendChild(threeScript);`
        },


        {
            id: makeId("block"),
            name: "Renderer",
            type: "js",
            dependencies: ["Three.js"],
            code:
`var scene;
var camera;
var renderer;

function createRenderer() {

    if (typeof THREE === "undefined") {
        console.error("THREE is not ready.");
        return;
    }

    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(
        65,
        innerWidth / innerHeight,
        0.1,
        1000
    );

    renderer = new THREE.WebGLRenderer({
        antialias: true
    });

    renderer.setPixelRatio(
        Math.min(devicePixelRatio, 2)
    );

    renderer.setSize(
        innerWidth,
        innerHeight
    );

    document.body.appendChild(
        renderer.domElement
    );

    window.addEventListener("resize", function() {

        camera.aspect =
            innerWidth / innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    });

}`
        },


        {
            id: makeId("block"),
            name: "Game Loop",
            type: "js",
            dependencies: ["Three.js", "Renderer"],
            code:
`function gameLoop() {

    requestAnimationFrame(gameLoop);

    if (typeof updateGame === "function") {
        updateGame();
    }

    if (renderer && scene && camera) {
        renderer.render(
            scene,
            camera
        );
    }

}`
        }

    ];

    saveStudio();
}


function showPage(page) {

    var pages = document.querySelectorAll(".page");

    pages.forEach(function(element) {
        element.classList.remove("active");
    });


    var tabs = document.querySelectorAll(".tab");

    tabs.forEach(function(element) {
        element.classList.remove("active");
    });


    var pageElement =
        document.getElementById(page + "Page");

    var tabElement =
        document.getElementById(page + "Tab");


    if (pageElement) {
        pageElement.classList.add("active");
    }

    if (tabElement) {
        tabElement.classList.add("active");
    }


    if (page === "games") {
        renderGames();
    }

    if (page === "blocks") {
        renderBlocks();
    }

    if (page === "studio") {
        renderGenerator();
    }
}


function renderGames() {

    var grid = document.getElementById("gameGrid");

    if (!grid) {
        return;
    }


    if (studio.games.length === 0) {

        grid.innerHTML =
`<div class="empty" style="grid-column:1/-1">
    No games yet.
    <br><br>
    Tap <strong>＋ New Game</strong> to create one.
</div>`;

        return;
    }


    grid.innerHTML = studio.games.map(function(game) {

        var saves =
            Array.isArray(game.saves)
                ? game.saves
                : [];

        var latest =
            saves.length
                ? saves[saves.length - 1]
                : null;


        return `
<div class="gameCard">

    <div>

        <div class="gameIcon">
            🎮
        </div>

        <div class="gameName">
            ${escapeHTML(game.name)}
        </div>

        <div class="gameMeta">
            ${saves.length} save(s)
            ${latest ? " • " + escapeHTML(latest.name) : ""}
        </div>

    </div>

    <div class="gameActions">

        <button
            class="btn primary small"
            onclick="playGame('${game.id}')">
            ▶ Play
        </button>

        <button
            class="btn small"
            onclick="editGame('${game.id}')">
            ✎ Edit
        </button>

        <button
            class="btn danger small"
            onclick="deleteGame('${game.id}')">
            Delete
        </button>

    </div>

</div>`;

    }).join("");
}


function newGame() {

    var game = {
        id: makeId("game"),
        name: "New Game",
        saves: []
    };


    studio.games.push(game);

    editingGameId = game.id;

    saveStudio();


    document.getElementById("gameName").value =
        game.name;

    document.getElementById("saveName").value =
        "Version 1";


    showPage("studio");
}


function editGame(gameId) {

    var game = studio.games.find(function(item) {
        return item.id === gameId;
    });


    if (!game) {
        return;
    }


    editingGameId = game.id;


    document.getElementById("gameName").value =
        game.name;


    var saves =
        Array.isArray(game.saves)
            ? game.saves
            : [];


    if (saves.length) {

        document.getElementById("saveName").value =
            saves[saves.length - 1].name;

    } else {

        document.getElementById("saveName").value =
            "Version 1";

    }


    showPage("studio");
}


function renderGenerator() {

    var container =
        document.getElementById("generatorBlocks");


    if (!container) {
        return;
    }


    var selected = [];


    var game = studio.games.find(function(item) {
        return item.id === editingGameId;
    });


    if (
        game &&
        Array.isArray(game.saves) &&
        game.saves.length
    ) {

        selected =
            game.saves[game.saves.length - 1].blocks || [];

    }


    if (studio.blocks.length === 0) {

        container.innerHTML =
`<div class="empty">
    No universal blocks.
</div>`;

        return;
    }


    container.innerHTML =
        studio.blocks.map(function(block) {

            var checked =
                selected.includes(block.name)
                    ? "checked"
                    : "";


            var dependencies =
                Array.isArray(block.dependencies)
                    ? block.dependencies
                    : [];


            return `
<div class="blockRow">

    <input
        class="blockCheck generatorCheck"
        type="checkbox"
        value="${escapeAttr(block.name)}"
        ${checked}>

    <div class="blockInfo">

        <div class="blockName">
            ${escapeHTML(block.name)}
        </div>

        <div class="blockDetails">
            ${
                dependencies.length
                    ? "Requires: " +
                      escapeHTML(dependencies.join(", "))
                    : "No dependencies"
            }
        </div>

    </div>

    <div class="typeBadge">
        ${escapeHTML(block.type.toUpperCase())}
    </div>

</div>`;

        }).join("");
}


function selectAllBlocks() {

    document.querySelectorAll(".generatorCheck")
        .forEach(function(checkbox) {
            checkbox.checked = true;
        });
}


function clearAllBlocks() {

    document.querySelectorAll(".generatorCheck")
        .forEach(function(checkbox) {
            checkbox.checked = false;
        });
}


function resolveDependencies(requestedNames) {

    var blockMap = new Map();

    studio.blocks.forEach(function(block) {
        blockMap.set(block.name, block);
    });


    var ordered = [];
    var visited = new Set();
    var visiting = new Set();
    var errors = [];


    function visit(name, chain) {

        chain = chain || [];


        if (visited.has(name)) {
            return;
        }


        if (visiting.has(name)) {

            errors.push(
                "Circular dependency: " +
                chain.concat([name]).join(" → ")
            );

            return;
        }


        var block = blockMap.get(name);


        if (!block) {

            errors.push(
                "Missing dependency: " + name
            );

            return;
        }


        visiting.add(name);


        var dependencies =
            Array.isArray(block.dependencies)
                ? block.dependencies
                : [];


        dependencies.forEach(function(dependency) {

            visit(
                dependency,
                chain.concat([name])
            );

        });


        visiting.delete(name);
        visited.add(name);
        ordered.push(block);
    }


    requestedNames.forEach(function(name) {
        visit(name);
    });


    var requestedSet =
        new Set(requestedNames);


    var automatic =
        ordered.filter(function(block) {
            return !requestedSet.has(block.name);
        });


    return {
        ordered: ordered,
        automatic: automatic,
        errors: errors,
        warnings: []
    };
}


function buildCurrentGame() {

    if (!editingGameId) {

        alert(
            "Create or edit a game first."
        );

        return;
    }


    var game =
        studio.games.find(function(item) {
            return item.id === editingGameId;
        });


    if (!game) {
        return;
    }


    game.name =
        document.getElementById("gameName")
            .value
            .trim() || "Untitled Game";


    var saveName =
        document.getElementById("saveName")
            .value
            .trim() || "Version 1";


    var requested =
        Array.from(
            document.querySelectorAll(
                ".generatorCheck:checked"
            )
        ).map(function(checkbox) {
            return checkbox.value;
        });


    if (requested.length === 0) {

        showBuildReport({
            success: false,
            errors: ["No blocks selected."],
            ordered: [],
            automatic: []
        });

        return;
    }


    var result =
        resolveDependencies(requested);


    if (result.errors.length) {

        showBuildReport(result);

        return;
    }


    var html =
        generateHTML(
            game.name,
            result.ordered
        );


    if (!Array.isArray(game.saves)) {
        game.saves = [];
    }


    var save = {

        id: makeId("save"),

        name: saveName,

        blocks: requested,

        resolvedBlocks:
            result.ordered.map(function(block) {
                return block.name;
            }),

        html: html,

        created:
            new Date().toISOString()

    };


    game.saves.push(save);

    saveStudio();


    showBuildReport({
        success: true,
        errors: [],
        warnings: [],
        ordered: result.ordered,
        automatic: result.automatic,
        html: html,
        game: game,
        save: save
    });


    renderGames();
}


function generateHTML(gameName, blocks) {

    var htmlBlocks =
        blocks.filter(function(block) {
            return block.type === "html";
        });


    var cssBlocks =
        blocks.filter(function(block) {
            return block.type === "css";
        });


    var jsBlocks =
        blocks.filter(function(block) {
            return block.type === "js";
        });


    var safeName =
        escapeHTML(gameName);


    var html =
`<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no">

<title>${safeName}</title>

<style>

${cssBlocks.map(function(block) {

    return (
`/* BLOCK: ${block.name} */

${block.code}`
    );

}).join("\n\n")}

</style>

</head>

<body>

${htmlBlocks.map(function(block) {

    return (
`<!-- BLOCK: ${block.name} -->

${block.code}`
    );

}).join("\n\n")}

<script>

${jsBlocks.map(function(block) {

    return (
`/* BLOCK: ${block.name} */

${block.code}`
    );

}).join("\n\n")}

<\/script>

</body>

</html>`;


    return html;
}


function showBuildReport(result) {

    var report =
        document.getElementById("buildReport");


    if (!report) {
        return;
    }


    var html = "";


    html +=
`<div class="reportTitle">
    BUILD REPORT
</div>`;


    if (result.success) {

        html +=
`<div class="reportLine ok">
    ✓ BUILD SUCCESSFUL
</div>`;

    } else {

        html +=
`<div class="reportLine error">
    ✗ BUILD FAILED
</div>`;

    }


    html +=
`<div class="reportSection">
    Automatically Added Dependencies
</div>`;


    if (
        result.automatic &&
        result.automatic.length
    ) {

        result.automatic.forEach(function(block) {

            html +=
`<div class="reportLine ok">
    + ${escapeHTML(block.name)}
</div>`;

        });

    } else {

        html +=
`<div class="reportLine">
    None
</div>`;

    }


    html +=
`<div class="reportSection">
    Final Build Order
</div>`;


    result.ordered.forEach(function(block, index) {

        html +=
`<div class="reportLine">
    ${index + 1}. ${escapeHTML(block.name)}
</div>`;

    });


    if (
        result.errors &&
        result.errors.length
    ) {

        html +=
`<div class="reportSection">
    Errors
</div>`;


        result.errors.forEach(function(error) {

            html +=
`<div class="reportLine error">
    ✗ ${escapeHTML(error)}
</div>`;

        });

    }


    if (result.html) {

        html +=
`<div class="reportSection">
    Output
</div>

<div class="reportLine ok">
    ✓ ${result.html.length.toLocaleString()} characters generated
</div>`;

    }


    if (result.save) {

        html +=
`<div class="reportLine ok">
    ✓ Saved as "${escapeHTML(result.save.name)}"
</div>`;

    }


    report.innerHTML = html;
    report.classList.add("visible");
}


function playGame(gameId) {

    var game =
        studio.games.find(function(item) {
            return item.id === gameId;
        });


    if (
        !game ||
        !Array.isArray(game.saves) ||
        game.saves.length === 0
    ) {

        alert(
            "This game has no saved build yet."
        );

        return;
    }


    var save =
        game.saves[game.saves.length - 1];


    var blob =
        new Blob(
            [save.html],
            { type: "text/html" }
        );


    var url =
        URL.createObjectURL(blob);


    var newWindow =
        window.open(url, "_blank");


    if (!newWindow) {

        alert(
            "The browser blocked the game window. " +
            "Allow pop-ups for this page and try again."
        );

    }
}


function renderBlocks() {

    var list =
        document.getElementById("blockList");


    if (!list) {
        return;
    }


    if (studio.blocks.length === 0) {

        list.innerHTML =
`<div class="empty">
    No universal blocks.
</div>`;

        return;
    }


    list.innerHTML =
        studio.blocks.map(function(block) {

            var dependencies =
                Array.isArray(block.dependencies)
                    ? block.dependencies
                    : [];


            return `
<div class="blockRow">

    <div class="blockInfo">

        <div class="blockName">
            ${escapeHTML(block.name)}
        </div>

        <div class="blockDetails">
            ${
                dependencies.length
                    ? "Requires: " +
                      escapeHTML(dependencies.join(", "))
                    : "No dependencies"
            }
        </div>

    </div>

    <div class="typeBadge">
        ${escapeHTML(block.type.toUpperCase())}
    </div>

    <button
        class="btn small"
        onclick="editBlock('${block.id}')">
        Edit
    </button>

    <button
        class="btn danger small"
        onclick="deleteBlock('${block.id}')">
        Delete
    </button>

</div>`;

        }).join("");
}


function openBlockEditor(blockId) {

    editingBlockId =
        blockId || null;


    if (blockId) {

        var block =
            studio.blocks.find(function(item) {
                return item.id === blockId;
            });


        if (!block) {
            return;
        }


        document.getElementById("blockEditorName").value =
            block.name;

        document.getElementById("blockEditorType").value =
            block.type;

        document.getElementById("blockEditorDependencies").value =
            Array.isArray(block.dependencies)
                ? block.dependencies.join(", ")
                : "";

        document.getElementById("blockEditorCode").value =
            block.code;

    } else {

        document.getElementById("blockEditorName").value = "";
        document.getElementById("blockEditorType").value = "js";
        document.getElementById("blockEditorDependencies").value = "";
        document.getElementById("blockEditorCode").value = "";

    }


    document.getElementById("blockModal")
        .classList.add("visible");
}


function editBlock(blockId) {
    openBlockEditor(blockId);
}


function closeBlockEditor() {

    document.getElementById("blockModal")
        .classList.remove("visible");

    editingBlockId = null;
}


function saveBlock() {

    var name =
        document.getElementById("blockEditorName")
            .value
            .trim();


    var type =
        document.getElementById("blockEditorType")
            .value;


    var dependencyText =
        document.getElementById("blockEditorDependencies")
            .value;


    var code =
        document.getElementById("blockEditorCode")
            .value;


    if (!name) {

        alert(
            "Please provide a block name."
        );

        return;
    }


    var dependencies =
        dependencyText
            .split(",")
            .map(function(value) {
                return value.trim();
            })
            .filter(Boolean);


    var duplicate =
        studio.blocks.find(function(block) {

            return (
                block.name === name &&
                block.id !== editingBlockId
            );

        });


    if (duplicate) {

        alert(
            "A block with that name already exists."
        );

        return;
    }


    if (editingBlockId) {

        var block =
            studio.blocks.find(function(item) {
                return item.id === editingBlockId;
            });


        if (block) {

            block.name = name;
            block.type = type;
            block.dependencies = dependencies;
            block.code = code;

        }

    } else {

        studio.blocks.push({

            id: makeId("block"),

            name: name,

            type: type,

            dependencies: dependencies,

            code: code

        });

    }


    saveStudio();
    closeBlockEditor();
    renderBlocks();
    renderGenerator();
}


function deleteBlock(blockId) {

    var block =
        studio.blocks.find(function(item) {
            return item.id === blockId;
        });


    if (!block) {
        return;
    }


    var usedBy =
        studio.blocks.filter(function(other) {

            return (
                Array.isArray(other.dependencies) &&
                other.dependencies.includes(block.name)
            );

        });


    if (usedBy.length) {

        alert(
            "Cannot delete this block.\n\n" +
            "It is required by:\n" +
            usedBy.map(function(item) {
                return "• " + item.name;
            }).join("\n")
        );

        return;
    }


    if (!confirm(
        'Delete "' + block.name + '"?'
    )) {

        return;
    }


    studio.blocks =
        studio.blocks.filter(function(item) {
            return item.id !== blockId;
        });


    saveStudio();
    renderBlocks();
    renderGenerator();
}


function deleteGame(gameId) {

    var game =
        studio.games.find(function(item) {
            return item.id === gameId;
        });


    if (!game) {
        return;
    }


    if (!confirm(
        'Delete "' +
        game.name +
        '" and all its saves?'
    )) {

        return;
    }


    studio.games =
        studio.games.filter(function(item) {
            return item.id !== gameId;
        });


    if (editingGameId === gameId) {
        editingGameId = null;
    }


    saveStudio();
    renderGames();
}


function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function escapeAttr(value) {
    return escapeHTML(value);
}


function startStudio() {

    try {

        loadStudio();

        installDefaultBlocks();

        renderGames();

        renderBlocks();

        renderGenerator();

        console.log(
            "HTML Game Studio V2.1 started successfully."
        );

    } catch (error) {

        console.error(error);

        showError(
            error.stack ||
            error.message ||
            String(error)
        );
    }
}


startStudio();
</script>
