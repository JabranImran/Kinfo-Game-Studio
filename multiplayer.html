<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>Asteroid Impact — Multiplayer</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02050d;
    color:white;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
}

#hud{
    position:fixed;
    top:env(safe-area-inset-top,10px);
    left:0;
    width:100%;
    padding:12px 14px;
    display:flex;
    justify-content:space-between;
    z-index:5;
    pointer-events:none;
}

.box{
    padding:7px 11px;
    border-radius:12px;

    background:
        rgba(3,10,25,.68);

    border:
        1px solid
        rgba(100,200,255,.22);

    backdrop-filter:blur(8px);

    font-size:13px;
}

.box small{
    display:block;
    opacity:.55;
    font-size:9px;
    letter-spacing:1px;
    text-transform:uppercase;
}

.box strong{
    font-size:17px;
}

#status{
    position:fixed;
    top:70px;
    left:50%;
    transform:translateX(-50%);
    z-index:5;

    padding:5px 12px;
    border-radius:20px;

    background:
        rgba(3,10,25,.6);

    font-size:11px;

    pointer-events:none;
}

#dot{
    display:inline-block;
    width:7px;
    height:7px;
    border-radius:50%;
    background:#ff4d4d;
    margin-right:5px;
}

.overlay{
    position:fixed;
    inset:0;
    z-index:20;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:22px;

    background:
        radial-gradient(
            circle at center,
            rgba(15,45,100,.28),
            rgba(0,2,8,.96)
        );
}

.panel{
    width:min(400px,100%);
    padding:30px 22px;

    text-align:center;

    border-radius:22px;

    background:
        rgba(3,9,22,.92);

    border:
        1px solid
        rgba(100,190,255,.25);

    box-shadow:
        0 20px 80px
        rgba(0,0,0,.7);
}

.logo{
    font-size:45px;
}

h1{
    margin:5px 0 10px;
    font-size:29px;
}

.subtitle{
    opacity:.65;
    line-height:1.5;
    margin-bottom:22px;
}

button{
    width:100%;
    padding:16px;
    margin-top:10px;

    border:0;
    border-radius:14px;

    color:white;
    font-size:17px;
    font-weight:800;

    background:
        linear-gradient(
            135deg,
            #148fff,
            #713dff
        );

    cursor:pointer;
}

.secondary{
    background:
        rgba(255,255,255,.08);

    font-size:14px;
}

#gameOver{
    display:none;
}

.finalScore{
    font-size:48px;
    font-weight:900;
    margin:15px;
}

</style>

</head>

<body>

<canvas id="game"></canvas>


<div id="hud">

    <div class="box">

        <small>Lives</small>

        <strong id="lives">
            ❤️❤️❤️
        </strong>

    </div>


    <div class="box">

        <small>Score</small>

        <strong id="score">
            0
        </strong>

    </div>


    <div class="box">

        <small>Players</small>

        <strong id="players">
            1
        </strong>

    </div>

</div>


<div id="status">

    <span id="dot"></span>

    <span id="statusText">
        Connecting...
    </span>

</div>


<div
    class="overlay"
    id="menu"
>

    <div class="panel">

        <div class="logo">
            🚀
        </div>

        <h1>
            ASTEROID IMPACT
        </h1>

        <div class="subtitle">

            MULTIPLAYER

            <br><br>

            Tap an asteroid to destroy it.

            <br>

            The explosion blasts nearby
            asteroids away.

        </div>


        <button id="play">
            ▶ PLAY
        </button>


        <button
            class="secondary"
            id="back"
        >
            ← MAIN GAME
        </button>

    </div>

</div>


<div
    class="overlay"
    id="gameOver"
>

    <div class="panel">

        <div class="logo">
            💥
        </div>

        <h1>
            GAME OVER
        </h1>

        <div class="finalScore"
             id="finalScore">
            0
        </div>

        <div>
            SCORE
        </div>


        <button id="again">
            🚀 PLAY AGAIN
        </button>


        <button
            class="secondary"
            id="menuButton"
        >
            MENU
        </button>

    </div>

</div>


<script>

/* =========================================================
   SERVER
========================================================= */

const SERVER=
    "wss://kinfo-game-studio.onrender.com";


/* =========================================================
   CANVAS
========================================================= */

const canvas=
    document.getElementById("game");

const ctx=
    canvas.getContext("2d");

let W=0;
let H=0;


function resize(){

    const dpr=
        Math.min(
            window.devicePixelRatio||1,
            2
        );

    W=
        innerWidth;

    H=
        innerHeight;

    canvas.width=
        W*dpr;

    canvas.height=
        H*dpr;

    canvas.style.width=
        W+"px";

    canvas.style.height=
        H+"px";

    ctx.setTransform(
        dpr,0,0,dpr,0,0
    );

}

addEventListener(
    "resize",
    resize
);

resize();


/* =========================================================
   WORLD
========================================================= */

let worldW=1200;
let worldH=800;

let cameraX=600;
let cameraY=400;


/* =========================================================
   GAME
========================================================= */

let playing=false;

let myID=null;

let connected=false;

let socket=null;

let reconnectTimer=null;

let score=0;

let lives=3;

let players=
    new Map();

let asteroids=
    new Map();

let particles=[];

let explosions=[];

let shockwaves=[];


/* =========================================================
   PLAYER
========================================================= */

const me={

    x:600,

    y:400,

    angle:-Math.PI/2,

    alive:true

};


let targetX=
    W/2;

let targetY=
    H/2;

let vx=0;

let vy=0;


/* =========================================================
   STARS
========================================================= */

const stars=[];

for(
    let i=0;
    i<180;
    i++
){

    stars.push({

        x:Math.random(),

        y:Math.random(),

        r:
            Math.random()*1.5+.3,

        a:
            Math.random()*.65+.2

    });

}


/* =========================================================
   UI
========================================================= */

const menu=
    document.getElementById("menu");

const gameOver=
    document.getElementById("gameOver");

const livesUI=
    document.getElementById("lives");

const scoreUI=
    document.getElementById("score");

const playersUI=
    document.getElementById("players");

const statusText=
    document.getElementById("statusText");

const dot=
    document.getElementById("dot");

const finalScore=
    document.getElementById("finalScore");


function status(
    text,
    online
){

    statusText.textContent=
        text;

    dot.style.background=
        online
        ?" #35ff82"
        :"#ff4d4d";

}


function updateHUD(){

    let hearts="";

    for(
        let i=0;
        i<3;
        i++
    ){

        hearts+=
            i<lives
            ?"❤️"
            :"🖤";

    }

    livesUI.textContent=
        hearts;

    scoreUI.textContent=
        score;

    playersUI.textContent=
        players.size;

}


/* =========================================================
   NETWORK
========================================================= */

function connect(){

    if(
        socket &&
        (
            socket.readyState===
            WebSocket.OPEN ||

            socket.readyState===
            WebSocket.CONNECTING
        )
    ){
        return;
    }


    status(
        "Connecting...",
        false
    );


    socket=
        new WebSocket(
            SERVER
        );


    socket.onopen=()=>{

        connected=true;

        status(
            "ONLINE",
            true
        );


        send({

            type:"join",

            name:"Rocket"

        });

    };


    socket.onmessage=
        event=>{

            let m;

            try{
                m=
                    JSON.parse(
                        event.data
                    );
            }catch{
                return;
            }

            receive(m);

        };


    socket.onclose=()=>{

        connected=false;

        status(
            "Disconnected",
            false
        );


        if(!reconnectTimer){

            reconnectTimer=
                setTimeout(
                    ()=>{

                        reconnectTimer=
                            null;

                        connect();

                    },
                    2500
                );

        }

    };


    socket.onerror=()=>{

        connected=false;

        status(
            "Connection error",
            false
        );

    };

}


function send(data){

    if(
        socket &&
        socket.readyState===
        WebSocket.OPEN
    ){

        socket.send(
            JSON.stringify(data)
        );

    }

}


/* =========================================================
   RECEIVE WORLD
========================================================= */

function receive(m){

    if(
        m.type==="welcome"
    ){

        myID=m.id;

        worldW=
            m.worldWidth;

        worldH=
            m.worldHeight;

        return;

    }


    if(
        m.type==="world"
    ){

        syncWorld(m);

        return;

    }


    if(
        m.type==="playerJoined"
    ){

        players.set(
            m.player.id,
            {
                ...m.player,

                drawX:m.player.x,
                drawY:m.player.y,
                drawAngle:m.player.angle
            }
        );

        updateHUD();

        return;

    }


    if(
        m.type==="playerLeft"
    ){

        players.delete(
            m.id
        );

        updateHUD();

        return;

    }


    if(
        m.type==="playerDeath"
    ){

        const p=
            players.get(
                m.id
            );

        if(p){

            p.alive=false;

        }

        updateHUD();

        return;

    }


    if(
        m.type==="playerRespawn"
    ){

        players.set(
            m.player.id,
            {
                ...m.player,

                drawX:m.player.x,
                drawY:m.player.y,
                drawAngle:m.player.angle
            }
        );

        updateHUD();

        return;

    }


    if(
        m.type==="score"
    ){

        if(
            m.playerId===myID
        ){

            score=
                m.score;

            scoreUI.textContent=
                score;

        }

        return;

    }


    if(
        m.type==="blast"
    ){

        createExplosion(
            m.x,
            m.y,
            m.power
        );

        return;

    }


    if(
        m.type==="death"
    ){

        lives=
            m.lives;

        me.alive=false;

        createExplosion(
            me.x,
            me.y,
            1.3
        );

        updateHUD();

        return;

    }


    if(
        m.type==="respawn"
    ){

        me.x=
            m.player.x;

        me.y=
            m.player.y;

        me.angle=
            m.player.angle;

        me.alive=true;

        lives=
            m.player.lives;

        score=
            m.player.score;

        vx=0;
        vy=0;

        updateHUD();

        return;

    }


    if(
        m.type==="gameOver"
    ){

        score=
            m.score;

        showGameOver();

    }

}


/* =========================================================
   WORLD SYNC
========================================================= */

function syncWorld(m){

    worldW=m.width;
    worldH=m.height;


    /*
     * Players.
     */

    const newPlayers=
        new Map();


    for(
        const p
        of m.players
    ){

        const old=
            players.get(
                p.id
            );


        if(old){

            old.netX=p.x;
            old.netY=p.y;
            old.netAngle=p.angle;

            old.alive=p.alive;
            old.lives=p.lives;
            old.score=p.score;
            old.name=p.name;

            newPlayers.set(
                p.id,
                old
            );

        }else{

            newPlayers.set(

                p.id,

                {

                    ...p,

                    drawX:p.x,
                    drawY:p.y,
                    drawAngle:p.angle,

                    netX:p.x,
                    netY:p.y,
                    netAngle:p.angle

                }

            );

        }

    }


    players=
        newPlayers;


    /*
     * Asteroids.
     *
     * The server is authoritative.
     *
     * We interpolate the trajectory but never invent
     * another asteroid.
     */

    const newAsteroids=
        new Map();


    for(
        const a
        of m.asteroids
    ){

        const old=
            asteroids.get(
                a.id
            );


        if(old){

            old.netX=a.x;
            old.netY=a.y;

            old.netVX=a.vx;
            old.netVY=a.vy;

            old.angle=a.angle;

            old.size=a.size;
            old.radius=a.radius;

            old.lastUpdate=
                performance.now();

            newAsteroids.set(
                a.id,
                old
            );

        }else{

            newAsteroids.set(

                a.id,

                {

                    ...a,

                    drawX:a.x,
                    drawY:a.y,

                    netX:a.x,
                    netY:a.y,

                    netVX:a.vx,
                    netVY:a.vy,

                    drawAngle:a.angle,

                    lastUpdate:
                        performance.now()

                }

            );

        }

    }


    asteroids=
        newAsteroids;


    /*
     * Local player state.
     */

    const mine=
        players.get(
            myID
        );


    if(mine){

        lives=
            mine.lives;

        score=
            mine.score;

        me.alive=
            mine.alive;

    }


    updateHUD();

}


/* =========================================================
   ASTEROID INTERPOLATION
========================================================= */

function updateAsteroids(){

    const now=
        performance.now();


    for(
        const a
        of asteroids.values()
    ){

        /*
         * Predict only a tiny amount ahead.
         *
         * This keeps the original trajectory smooth while
         * avoiding the huge jumps of the previous version.
         */

        const dt=
            Math.min(
                .08,
                (
                    now-
                    a.lastUpdate
                )/1000
            );


        const predictedX=
            a.netX+
            a.netVX*dt;


        const predictedY=
            a.netY+
            a.netVY*dt;


        a.drawX+=
            (
                predictedX-
                a.drawX
            )*.24;


        a.drawY+=
            (
                predictedY-
                a.drawY
            )*.24;


        a.drawAngle=
            a.angle;

    }

}


/* =========================================================
   PLAYER INTERPOLATION
========================================================= */

function updateRemotePlayers(){

    for(
        const p
        of players.values()
    ){

        if(
            p.id===myID
        ){
            continue;
        }


        if(
            p.drawX===undefined
        ){

            p.drawX=p.x;
            p.drawY=p.y;
            p.drawAngle=p.angle;

            p.netX=p.x;
            p.netY=p.y;
            p.netAngle=p.angle;

        }


        p.drawX+=
            (
                p.netX-
                p.drawX
            )*.22;


        p.drawY+=
            (
                p.netY-
                p.drawY
            )*.22;


        let diff=
            p.netAngle-
            p.drawAngle;


        while(diff>Math.PI)
            diff-=Math.PI*2;

        while(diff<-Math.PI)
            diff+=Math.PI*2;


        p.drawAngle+=
            diff*.22;

    }

}


/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function updatePlayer(){

    if(
        !playing ||
        !me.alive
    ){
        return;
    }


    const dx=
        targetX-
        W/2;

    const dy=
        targetY-
        H/2;


    const d=
        Math.hypot(dx,dy);


    let wantedX=0;
    let wantedY=0;


    if(d>10){

        const speed=
            Math.min(
                d*.035,
                5
            );


        wantedX=
            dx/d*speed;

        wantedY=
            dy/d*speed;


        me.angle=
            Math.atan2(
                dy,
                dx
            );

    }


    /*
     * This is intentionally retained from the smoother
     * version you liked.
     */

    vx+=
        (
            wantedX-vx
        )*.20;


    vy+=
        (
            wantedY-vy
        )*.20;


    me.x+=vx;
    me.y+=vy;


    me.x=
        Math.max(
            30,
            Math.min(
                worldW-30,
                me.x
            )
        );


    me.y=
        Math.max(
            30,
            Math.min(
                worldH-30,
                me.y
            )
        );


    cameraX+=
        (
            me.x-cameraX
        )*.12;


    cameraY+=
        (
            me.y-cameraY
        )*.12;

}


/* =========================================================
   SEND PLAYER
========================================================= */

let lastSend=0;


function sendPlayer(){

    if(
        !connected ||
        !me.alive
    ){
        return;
    }


    const now=
        performance.now();


    if(
        now-lastSend<
        50
    ){
        return;
    }


    lastSend=now;


    send({

        type:"state",

        x:me.x,

        y:me.y,

        angle:me.angle

    });

}


/* =========================================================
   COORDINATES
========================================================= */

function screenToWorld(
    x,
    y
){

    return {

        x:
            x-
            W/2+
            cameraX,

        y:
            y-
            H/2+
            cameraY

    };

}


function worldToScreen(
    x,
    y
){

    return {

        x:
            x-
            cameraX+
            W/2,

        y:
            y-
            cameraY+
            H/2

    };

}


/* =========================================================
   TAP
========================================================= */

canvas.addEventListener(
    "pointermove",
    e=>{

        targetX=e.clientX;
        targetY=e.clientY;

    }
);


canvas.addEventListener(
    "pointerdown",
    e=>{

        targetX=e.clientX;
        targetY=e.clientY;


        if(
            !playing ||
            !me.alive
        ){
            return;
        }


        const point=
            screenToWorld(
                e.clientX,
                e.clientY
            );


        send({

            type:"blast",

            x:point.x,

            y:point.y

        });

    }
);


/* =========================================================
   SPACE
========================================================= */

function drawSpace(){

    ctx.fillStyle=
        "#02050d";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    const g=
        ctx.createRadialGradient(
            W/2,
            H/2,
            0,
            W/2,
            H/2,
            Math.max(W,H)*.7
        );


    g.addColorStop(
        0,
        "rgba(20,50,100,.16)"
    );

    g.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );


    ctx.fillStyle=g;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    for(
        const s
        of stars
    ){

        ctx.globalAlpha=s.a;

        ctx.fillStyle="#fff";

        ctx.beginPath();

        ctx.arc(
            s.x*W,
            s.y*H,
            s.r,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    ctx.globalAlpha=1;

}


/* =========================================================
   ASTEROID DRAW
========================================================= */

function drawAsteroid(a){

    const p=
        worldToScreen(
            a.drawX,
            a.drawY
        );


    if(
        p.x<-100 ||
        p.x>W+100 ||
        p.y<-100 ||
        p.y>H+100
    ){
        return;
    }


    ctx.save();


    ctx.translate(
        p.x,
        p.y
    );


    ctx.rotate(
        a.drawAngle
    );


    const radius=
        a.radius;


    const points=
        a.size===3
        ?10
        :a.size===2
        ?9
        :8;


    ctx.beginPath();


    for(
        let i=0;
        i<points;
        i++
    ){

        const angle=
            Math.PI*2/
            points*
            i;


        /*
         * Deterministic irregularity based on the asteroid ID.
         */

        let seed=0;

        for(
            let j=0;
            j<a.id.length;
            j++
        ){

            seed=
                (
                    seed*31+
                    a.id.charCodeAt(j)
                )>>>0;

        }


        seed=
            (
                seed+
                i*99991
            )>>>0;


        const variation=
            .78+
            (
                seed%100
            )/100*
            .4;


        const r=
            radius*
            variation;


        const x=
            Math.cos(angle)*r;

        const y=
            Math.sin(angle)*r;


        if(i===0)
            ctx.moveTo(x,y);
        else
            ctx.lineTo(x,y);

    }


    ctx.closePath();


    ctx.shadowBlur=12;

    ctx.shadowColor=
        "#5cdcff";


    ctx.fillStyle=
        a.hitFlash>0
        ?"white"
        :"rgba(8,15,30,.95)";


    ctx.fill();


    ctx.shadowBlur=0;


    ctx.lineWidth=2;

    ctx.strokeStyle=
        "#4fd6ff";

    ctx.stroke();


    /*
     * Small internal details.
     */

    ctx.globalAlpha=.28;

    ctx.fillStyle=
        "#4fd6ff";


    for(
        let i=0;
        i<Math.max(1,a.size);
        i++
    ){

        const ang=
            i*2.2;


        ctx.beginPath();

        ctx.arc(
            Math.cos(ang)*
                radius*.28,

            Math.sin(ang)*
                radius*.28,

            radius*.08,

            0,
            Math.PI*2
        );

        ctx.fill();

    }


    ctx.restore();

}


/* =========================================================
   ROCKET
========================================================= */

function drawRocket(
    x,
    y,
    angle,
    local
){

    ctx.save();


    ctx.translate(
        x,
        y
    );


    ctx.rotate(
        angle+
        Math.PI/2
    );


    /*
     * Engine.
     */

    ctx.beginPath();

    ctx.moveTo(
        -6,
        11
    );

    ctx.lineTo(
        0,
        26+
        Math.random()*5
    );

    ctx.lineTo(
        6,
        11
    );

    ctx.closePath();


    ctx.fillStyle=
        "#ffb12b";

    ctx.fill();


    /*
     * Rocket.
     */

    ctx.beginPath();

    ctx.moveTo(
        0,
        -21
    );

    ctx.lineTo(
        -11,
        12
    );

    ctx.lineTo(
        0,
        7
    );

    ctx.lineTo(
        11,
        12
    );

    ctx.closePath();


    ctx.fillStyle=
        local
        ?"white"
        :"#54a8ff";


    ctx.fill();


    ctx.strokeStyle=
        "#65d9ff";

    ctx.lineWidth=2;

    ctx.stroke();


    /*
     * Cockpit.
     */

    ctx.beginPath();

    ctx.arc(
        0,
        -6,
        4,
        0,
        Math.PI*2
    );


    ctx.fillStyle=
        "#08162a";

    ctx.fill();


    ctx.strokeStyle=
        "#70dcff";

    ctx.stroke();


    ctx.restore();

}


/* =========================================================
   EXPLOSION
========================================================= */

function createExplosion(
    x,
    y,
    power
){

    const maxRadius=
        45*power;


    explosions.push({

        x,

        y,

        radius:5,

        maxRadius,

        life:0,

        maxLife:
            .42+
            power*.06

    });


    shockwaves.push({

        x,

        y,

        radius:5,

        maxRadius,

        life:0,

        maxLife:.35

    });


    /*
     * Same basic particle count/speed relationship as the
     * original game.
     */

    const count=
        Math.floor(
            22*power
        );


    for(
        let i=0;
        i<count;
        i++
    ){

        const angle=
            Math.random()*
            Math.PI*2;


        const speed=
            (
                50+
                Math.random()*190
            )*
            power;


        const life=
            .25+
            Math.random()*.4;


        particles.push({

            x,

            y,

            vx:
                Math.cos(angle)*
                speed,

            vy:
                Math.sin(angle)*
                speed,

            life,

            maxLife:life,

            size:
                1+
                Math.random()*3

        });

    }

}


/* =========================================================
   EFFECTS
========================================================= */

function updateEffects(dt){

    for(
        let i=
            particles.length-1;
        i>=0;
        i--
    ){

        const p=
            particles[i];


        p.x+=
            p.vx*dt;

        p.y+=
            p.vy*dt;


        p.life-=dt;


        if(
            p.life<=0
        ){

            particles.splice(
                i,
                1
            );

        }

    }


    for(
        let i=
            explosions.length-1;
        i>=0;
        i--
    ){

        const e=
            explosions[i];


        e.life+=dt;


        const progress=
            e.life/e.maxLife;


        e.radius=
            e.maxRadius*
            (
                1-
                Math.pow(
                    1-progress,
                    2
                )
            );


        if(
            e.life>=
            e.maxLife
        ){

            explosions.splice(
                i,
                1
            );

        }

    }


    for(
        let i=
            shockwaves.length-1;
        i>=0;
        i--
    ){

        const s=
            shockwaves[i];


        s.life+=dt;


        const p=
            s.life/s.maxLife;


        s.radius=
            s.maxRadius*p;


        if(
            s.life>=
            s.maxLife
        ){

            shockwaves.splice(
                i,
                1
            );

        }

    }

}


/* =========================================================
   DRAW EFFECTS
========================================================= */

function drawEffects(){

    for(
        const p
        of particles
    ){

        const pos=
            worldToScreen(
                p.x,
                p.y
            );


        ctx.globalAlpha=
            p.life/
            p.maxLife;


        ctx.fillStyle=
            "#6ce7ff";


        ctx.beginPath();

        ctx.arc(
            pos.x,
            pos.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    for(
        const e
        of explosions
    ){

        const pos=
            worldToScreen(
                e.x,
                e.y
            );


        const alpha=
            1-
            e.life/e.maxLife;


        const g=
            ctx.createRadialGradient(
                pos.x,
                pos.y,
                0,
                pos.x,
                pos.y,
                e.radius
            );


        g.addColorStop(
            0,
            `rgba(255,255,255,${alpha})`
        );

        g.addColorStop(
            .15,
            `rgba(90,230,255,${alpha*.95})`
        );

        g.addColorStop(
            .55,
            `rgba(100,100,255,${alpha*.3})`
        );

        g.addColorStop(
            1,
            "rgba(0,0,0,0)"
        );


        ctx.fillStyle=g;

        ctx.beginPath();

        ctx.arc(
            pos.x,
            pos.y,
            e.radius,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    for(
        const s
        of shockwaves
    ){

        const pos=
            worldToScreen(
                s.x,
                s.y
            );


        const alpha=
            1-
            s.life/s.maxLife;


        ctx.globalAlpha=
            alpha*.7;


        ctx.strokeStyle=
            "#6ce7ff";


        ctx.lineWidth=2;


        ctx.beginPath();

        ctx.arc(
            pos.x,
            pos.y,
            s.radius,
            0,
            Math.PI*2
        );

        ctx.stroke();

    }


    ctx.globalAlpha=1;

}


/* =========================================================
   START / STOP
========================================================= */

function startGame(){

    playing=true;

    menu.style.display=
        "none";

    gameOver.style.display=
        "none";


    if(!connected){
        connect();
    }


    vx=0;
    vy=0;

    particles=[];
    explosions=[];
    shockwaves=[];

}


function showGameOver(){

    playing=false;

    finalScore.textContent=
        score;

    gameOver.style.display=
        "flex";

}


function showMenu(){

    playing=false;

    gameOver.style.display=
        "none";

    menu.style.display=
        "flex";

}


document
    .getElementById("play")
    .onclick=
    startGame;


document
    .getElementById("again")
    .onclick=
    startGame;


document
    .getElementById("menuButton")
    .onclick=
    showMenu;


document
    .getElementById("back")
    .onclick=
    ()=>{
        location.href=
            "index.html";
    };


/* =========================================================
   MAIN LOOP
========================================================= */

let lastFrame=
    performance.now();


function loop(){

    const now=
        performance.now();


    const dt=
        Math.min(
            .033,
            (now-lastFrame)/1000
        );


    lastFrame=now;


    updatePlayer();

    sendPlayer();

    updateAsteroids();

    updateRemotePlayers();

    updateEffects(dt);


    drawSpace();


    /*
     * Asteroids.
     */

    for(
        const a
        of asteroids.values()
    ){

        drawAsteroid(a);

    }


    /*
     * Other rockets.
     */

    for(
        const p
        of players.values()
    ){

        if(
            p.id===myID ||
            !p.alive
        ){
            continue;
        }


        const pos=
            worldToScreen(
                p.drawX,
                p.drawY
            );


        drawRocket(
            pos.x,
            pos.y,
            p.drawAngle,
            false
        );

    }


    /*
     * Local rocket.
     */

    if(
        playing &&
        me.alive
    ){

        drawRocket(
            W/2,
            H/2,
            me.angle,
            true
        );

    }


    drawEffects();


    requestAnimationFrame(
        loop
    );

}


connect();

loop();

</script>
