<style>

<div id="hud">
 <div class="row">

<div id="damageFlash"></div><div id="hitMessage">HIT!</div><div id="gameOver" class="hidden"><div class="card"><h1>🚀 Ship Lost</h1><div class="final" id="finalScore">0</div><p>Your rocket ran out of lives.</p><button id="playAgain">PLAY AGAIN</button></div></div><div id="menu">
 <div class="card">

  <input id="name" maxlength="16" value="Player" placeholder="Rocket name"><input id="colour" type="color" value="#60e9ff" style="height:46px;margin-top:8px;padding:5px">

 </div>

<script>
'use strict';
const SERVER_URL='wss://kinfo-game-studio.onrender.com';
const c=document.getElementById('game'),ctx=c.getContext('2d');
const livesEl=document.getElementById('lives'),scoreEl=document.getElementById('score'),playersEl=document.getElementById('players'),statusEl=document.getElementById('status'),menu=document.getElementById('menu'),nameInput=document.getElementById('name'),colourInput=document.getElementById('colour'),lbList=document.getElementById('lbList'),powerBtn=document.getElementById('powerupBtn');
let W=innerWidth,H=innerHeight,D=1;function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
const me={id:null,name:'Player',colour:'#60e9ff',x:W/2,y:H/2,angle:-Math.PI/2,lives:3,score:0,active:false,inv:0,hit:0,power:'tow',powerCharge:100,towed:null,nextSpecial:1000,speedUntil:0,laserUntil:0};
const remote=new Map(),ast=[],particles=[],stars=[],shock=[],powerups=[];let ws=null,connected=false,started=false,over=false,last=performance.now(),spawn=0,sendTick=0;
let down=false,drag=false,pid=null,sx=0,sy=0,targetX=W/2,targetY=H/2;const DRAG=12,SHIP_SPEED=300,TURN=7,INV=2.5;
let pointerDownAt=0;
let prevShipX=me.x,prevShipY=me.y;
let hitFlashTimer=0,screenShake=0,neonPulse=0,leaderTimer=0;
const POLY=[[0,-19],[7,-5],[11,11],[3,8],[0,15],[-3,8],[-11,11],[-7,-5]];
for(let i=0;i<150;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:.2+Math.random()*1.4,a:.18+Math.random()*.65});
function wrap(v,m){return v<0?v+m:v>=m?v-m:v}
function background(t){ctx.fillStyle='#03050d';ctx.fillRect(0,0,W,H);ctx.save();ctx.globalAlpha=.13;ctx.strokeStyle='#263b65';ctx.lineWidth=1;const g=90,ox=(t*.008)%g,oy=(t*.004)%g;for(let x=-g+ox;x<W+g;x+=g){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=-g+oy;y<H+g;y+=g){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.restore();stars.forEach(s=>{ctx.globalAlpha=s.a;ctx.fillStyle='#d9ecff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()});ctx.globalAlpha=1;ctx.save();ctx.globalAlpha=.2;ctx.strokeStyle='#5b7bb5';ctx.setLineDash([3,8]);ctx.beginPath();ctx.arc(W/2,H/2,Math.min(W,H)*.34,0,7);ctx.stroke();ctx.restore()}
function makeAst(x,y,s,vx,vy){const pts=[],n=8+Math.floor(Math.random()*4);for(let i=0;i<n;i++){let a=i/n*Math.PI*2,r=s*(.72+Math.random()*.5);pts.push([Math.cos(a)*r,Math.sin(a)*r])}return{x,y,s,vx,vy,r:Math.random()*7,spin:(Math.random()-.5)*1.5,pts,neon:Math.random()<.16}}
function spawnAst(){let side=Math.floor(Math.random()*4),x=side===0?-45:side===1?W+45:Math.random()*W,y=side===2?-45:side===3?H+45:Math.random()*H,dx=W/2-x,dy=H/2-y,l=Math.hypot(dx,dy)||1,v=35+Math.random()*50;ast.push(makeAst(x,y,15+Math.random()*20,dx/l*v+(Math.random()-.5)*18,dy/l*v+(Math.random()-.5)*18))}
function resetAst(){ast.length=0;for(let i=0;i<18;i++){let a=makeAst(Math.random()*W,65+Math.random()*Math.max(100,H-65),15+Math.random()*20,(Math.random()-.5)*65,(Math.random()-.5)*65);if(Math.hypot(a.x-me.x,a.y-me.y)<120){a.x=wrap(a.x+W*.45,W);a.y=wrap(a.y+H*.45,H)}ast.push(a)}}
function spawnPowerAsteroid(){let a=makeAst(me.x+(Math.random()-.5)*Math.min(W*.7,420),me.y+(Math.random()-.5)*Math.min(H*.7,420),25,(Math.random()-.5)*35,(Math.random()-.5)*35);a.neon=true;a.special=true;a.power=['speed','laser','heart'][Math.min(2,Math.floor(me.score/5000))]||'speed';a.power=me.score>=10000?'heart':me.score>=5000?'laser':'speed';ast.push(a);burst(a.x,a.y,35,a.power==='speed'?'#ffe36e':a.power==='laser'?'#ff6bf2':'#ff4d7d')}
function collectPower(a){let p=a.power||'speed';me.power=p;if(p==='speed')me.speedUntil=performance.now()/1000+8;if(p==='laser')me.laserUntil=performance.now()/1000+10;if(p==='heart')me.lives=Math.min(5,me.lives+1);me.powerCharge=0;livesEl.textContent=me.lives;powerBtn.innerHTML=(p==='speed'?'SPEED':p==='laser'?'LASER GUN':p==='heart'?'HEARTS':'ASTEROID TOW')+'<small>Equipped</small>';burst(a.x,a.y,60,p==='speed'?'#ffe36e':p==='laser'?'#ff6bf2':'#ff4d7d')}
function updateLeaderboard(){let all=[{name:me.name,score:me.score,colour:me.colour,active:me.active}];remote.forEach(p=>all.push({name:p.name,score:p.score||0,colour:p.colour||'#ff9d65',active:p.lives>0}));all.sort((a,b)=>b.score-a.score);lbList.innerHTML=all.slice(0,6).map((p,i)=>`<div class="lb"><span>${i+1}. <span class="swatch" style="background:${p.colour}"></span>${String(p.name).replace(/[<>]/g,'')}</span><b>${Math.floor(p.score)}</b></div>`).join('')}
function rechargePower(dt){if(!me.active)return;if(me.powerCharge<100)me.powerCharge=Math.min(100,me.powerCharge+me.score*0.0025*dt);let ready=me.powerCharge>=100;powerBtn.classList.toggle('ready',ready);powerBtn.innerHTML=(me.power==='tow'?'ASTEROID TOW':me.power==='speed'?'SPEED':me.power==='laser'?'LASER GUN':'HEARTS')+`<small>${ready?'READY':Math.floor(me.powerCharge)+'% recharge'}</small>`}
powerBtn.onclick=()=>{if(!me.active||me.powerCharge<100)return;if(me.power==='tow'){if(me.towed)ast.splice(ast.indexOf(me.towed),1);let a=makeAst(me.x,me.y,18,0,0);a.towed=true;a.neon=true;me.towed=a;ast.push(a)}else if(me.power==='laser'){let a=ast.slice().sort((a,b)=>Math.hypot(a.x-me.x,a.y-me.y)-Math.hypot(b.x-me.x,b.y-me.y))[0];if(a)blast(a.x,a.y,360)}else if(me.power==='speed'){me.speedUntil=performance.now()/1000+8}else if(me.power==='heart'){me.lives=Math.min(5,me.lives+1);livesEl.textContent=me.lives}me.powerCharge=0};
function burst(x,y,n=25,col='#9eefff'){for(let i=0;i<n;i++){let a=Math.random()*7,s=35+Math.random()*190;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.35+Math.random()*.55,m:.8,r:1+Math.random()*3,col})}}
function blast(x,y,power=260,bcast=true){burst(x,y);shock.push({x,y,r:5,l:.4});for(let i=ast.length-1;i>=0;i--){let a=ast[i],dx=a.x-x,dy=a.y-y,d=Math.hypot(dx,dy)||1,range=power+a.s*2;if(d<range){let f=(1-d/range)*power;a.vx+=dx/d*f;a.vy+=dy/d*f;if(d<a.s+12){if(a.special){collectPower(a);ast.splice(i,1);continue} if(a.towed){a.towed=false;me.towed=null} me.score+=10;scoreEl.textContent=me.score;burst(a.x,a.y,30);shock.push({x:a.x,y:a.y,r:5,l:.4});if(a.s>24)for(let k=0;k<2;k++)ast.push(makeAst(a.x,a.y,a.s*.48,(Math.random()-.5)*160+dx/d*80,(Math.random()-.5)*160+dy/d*80));ast.splice(i,1)}}}if(bcast&&connected)send({type:'blast',x,y,power})}
function pointSeg(px,py,ax,ay,bx,by){let dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy,t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(px-(ax+t*dx),py-(ay+t*dy))}
function shipPoly(){let ca=Math.cos(me.angle),sa=Math.sin(me.angle);return POLY.map(p=>({x:me.x+p[0]*ca-p[1]*sa,y:me.y+p[0]*sa+p[1]*ca}))}
function hitShip(cx,cy,r){let p=shipPoly(),inside=false;for(let i=0,j=p.length-1;i<p.length;j=i++){if(((p[i].y>cy)!=(p[j].y>cy))&&cx<(p[j].x-p[i].x)*(cy-p[i].y)/(p[j].y-p[i].y)+p[i].x)inside=!inside}if(inside)return true;for(let i=0;i<p.length;i++){let a=p[i],b=p[(i+1)%p.length];if(pointSeg(cx,cy,a.x,a.y,b.x,b.y)<=r)return true}return false}
function damage(){let now=performance.now()/1000;if(!me.active||over||now<me.inv)return false;me.lives--;me.inv=now+INV;me.hit=.8;livesEl.textContent=me.lives;burst(me.x,me.y,70,'#ff405f');shock.push({x:me.x,y:me.y,r:5,l:.7});screenShake=12;hitFlashTimer=.28;const f=document.getElementById('damageFlash');f.style.opacity='1';setTimeout(()=>f.style.opacity='0',220);const h=document.getElementById('hitMessage');h.textContent=me.lives>0?`HIT!  ${me.lives} LIFE${me.lives===1?'':'S'} LEFT`:'SHIP LOST';h.style.opacity='1';setTimeout(()=>h.style.opacity='0',850);if(connected)send({type:'hit',lives:me.lives,score:me.score});if(me.lives<=0)endGame();else{targetX=me.x;targetY=me.y;}return true}
function endGame(){over=true;me.active=false;drag=false;down=false;document.getElementById('finalScore').textContent=me.score.toLocaleString();const go=document.getElementById('gameOver');go.classList.remove('hidden');go.style.pointerEvents='auto';if(connected)send({type:'death',score:me.score,lives:0})}
function start(){over=false;started=true;me.active=true;me.lives=3;me.score=0;me.x=W/2;me.y=H/2;me.angle=-Math.PI/2;me.inv=performance.now()/1000+1.5;me.hit=0;me.power='tow';me.powerCharge=100;me.towed=null;me.nextSpecial=Math.floor(me.score/1000+1)*1000;targetX=me.x;targetY=me.y;prevShipX=me.x;prevShipY=me.y;down=false;drag=false;pid=null;hitFlashTimer=0;screenShake=0;livesEl.textContent='3';scoreEl.textContent='0';const go=document.getElementById('gameOver');go.classList.add('hidden');go.style.pointerEvents='none';menu.style.display='none';menu.style.pointerEvents='none';resetAst();if(ws&&ws.readyState===1)send({type:'restart',name:me.name,colour:me.colour,x:me.x,y:me.y,angle:me.angle,lives:3,score:0});else connect()}
function send(m){if(ws&&ws.readyState===1)ws.send(JSON.stringify(m))}
function connect(){if(ws&&(ws.readyState===0||ws.readyState===1))return;statusEl.textContent='CONNECTING';try{ws=new WebSocket(SERVER_URL);ws.onopen=()=>{connected=true;statusEl.textContent='ONLINE';send({type:'join',name:me.name,colour:me.colour,x:me.x,y:me.y,angle:me.angle,lives:me.lives,score:me.score})};ws.onclose=()=>{connected=false;statusEl.textContent='OFFLINE';playersEl.textContent='1'};ws.onerror=()=>{connected=false;statusEl.textContent='OFFLINE'};ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='welcome')me.id=m.id;if(m.type==='players'){remote.clear();(m.players||[]).forEach(p=>{if(p.id!==me.id&&p.lives>0)remote.set(p.id,p)});playersEl.textContent=Math.max(1,(m.players||[]).filter(p=>p.lives>0).length)}if(m.type==='blast'&&m.from!==me.id)blast(+m.x||0,+m.y||0,+m.power||260,false);if(m.type==='playerHit'){let p=remote.get(m.id);if(p)p.lives=m.lives}}}catch{statusEl.textContent='OFFLINE'}}
function pt(e){let r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
c.addEventListener('pointerdown',e=>{if(!me.active||over)return;e.preventDefault();down=true;drag=false;pid=e.pointerId;sx=e.clientX;sy=e.clientY;pointerDownAt=performance.now();try{c.setPointerCapture(e.pointerId)}catch{}},{passive:false});
c.addEventListener('pointermove',e=>{if(!down||e.pointerId!==pid||!me.active||over)return;e.preventDefault();if(!drag&&Math.hypot(e.clientX-sx,e.clientY-sy)>=DRAG)drag=true;if(drag){let p=pt(e);targetX=p.x;targetY=p.y}},{passive:false});
function up(e){if(!down||e.pointerId!==pid)return;e.preventDefault();if(!drag&&me.active&&!over){let p=pt(e),best=-1,bestD=Infinity;for(let i=ast.length-1;i>=0;i--){let d=Math.hypot(ast[i].x-p.x,ast[i].y-p.y);if(d<=ast[i].s+30&&d<bestD){best=i;bestD=d}}if(best>=0)blast(ast[best].x,ast[best].y)}down=false;drag=false;pid=null}
c.addEventListener('pointerup',up,{passive:false});c.addEventListener('pointercancel',up,{passive:false});
document.getElementById('play').onclick=()=>{me.name=(nameInput.value.trim()||'Player').slice(0,16);me.colour=colourInput.value||'#60e9ff';start()};document.getElementById('playAgain').onclick=start;
function update(dt){if(!started)return;let now=performance.now()/1000;if(me.active&&!over){prevShipX=me.x;prevShipY=me.y;if(drag){let dx=targetX-me.x,dy=targetY-me.y,d=Math.hypot(dx,dy);if(d>2){let want=Math.atan2(dy,dx),da=want-me.angle;while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;me.angle+=da*Math.min(1,dt*TURN);let v=Math.min(me.speedUntil>now?470:SHIP_SPEED,90+d*.75);me.x+=Math.cos(me.angle)*v*dt;me.y+=Math.sin(me.angle)*v*dt}}else{let v=me.speedUntil>now?145:72;me.x+=Math.cos(me.angle)*v*dt;me.y+=Math.sin(me.angle)*v*dt}me.x=wrap(me.x,W);me.y=wrap(me.y,H);spawn+=dt;if(me.score>=me.nextSpecial){spawnPowerAsteroid();me.nextSpecial+=1000}if(spawn>1&&ast.length<30){spawn=0;spawnAst()}for(const a of ast){if(a.towed){a.x=me.x-Math.cos(me.angle)*48;a.y=me.y-Math.sin(me.angle)*48;a.vx=0;a.vy=0}else{a.x=wrap(a.x+a.vx*dt,W);a.y=wrap(a.y+a.vy*dt,H);} a.r+=a.spin*dt;let swept=pointSeg(a.x,a.y,prevShipX,prevShipY,me.x,me.y)<=a.s*.82+10;let overlap=hitShip(a.x,a.y,a.s*.82);if((swept||overlap)&&a.special){collectPower(a);ast.splice(ast.indexOf(a),1);continue}if((swept||overlap)&&!a.towed&&damage()){let dx=me.x-a.x,dy=me.y-a.y,l=Math.hypot(dx,dy)||1;a.x=wrap(me.x-dx/l*(a.s+55),W);a.y=wrap(me.y-dy/l*(a.s+55),H);a.vx-=dx/l*120;a.vy-=dy/l*120;break}}rechargePower(dt);if((leaderTimer+=dt)>.15){leaderTimer=0;updateLeaderboard()}if(connected&&++sendTick>5){sendTick=0;sendWS()}}if(hitFlashTimer>0)hitFlashTimer-=dt;if(screenShake>0)screenShake=Math.max(0,screenShake-dt*35);for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.98;p.vy*=.98;p.l-=dt;if(p.l<=0)particles.splice(i,1)}for(let i=shock.length-1;i>=0;i--){shock[i].r+=420*dt;shock[i].l-=dt;if(shock[i].l<=0)shock.splice(i,1)}remote.forEach(p=>{p._x??=p.x;p._y??=p.y;p._a??=p.angle;p._x+=(p.x-p._x)*Math.min(1,dt*12);p._y+=(p.y-p._y)*Math.min(1,dt*12);let da=p.angle-p._a;while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;p._a+=da*Math.min(1,dt*12)})}
function sendWS(){send({type:'state',name:me.name,colour:me.colour,x:me.x,y:me.y,angle:me.angle,lives:me.lives,score:me.score})}
function rocket(x,y,a,name,other=false,inv=false,otherColour){ctx.save();ctx.translate(x,y);ctx.rotate(a+Math.PI/2);if(!other){ctx.save();ctx.globalAlpha=inv?.6:.25;ctx.strokeStyle=inv?'#fff':'#6feaff';ctx.lineWidth=1.5;ctx.shadowBlur=inv?14:7;ctx.shadowColor=ctx.strokeStyle;ctx.beginPath();POLY.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.stroke();ctx.restore();if(inv){ctx.save();ctx.globalAlpha=.55+.25*Math.sin(performance.now()/65);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.shadowBlur=18;ctx.shadowColor='#fff';ctx.beginPath();ctx.arc(0,0,20,0,7);ctx.stroke();ctx.restore()}}let col=other?(otherColour||'#ff9d65'):me.colour;ctx.fillStyle=col;ctx.shadowBlur=15;ctx.shadowColor=col;ctx.beginPath();ctx.moveTo(0,-19);ctx.lineTo(7,-5);ctx.lineTo(11,11);ctx.lineTo(3,8);ctx.lineTo(0,15);ctx.lineTo(-3,8);ctx.lineTo(-11,11);ctx.lineTo(-7,-5);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,-5,4,0,7);ctx.fill();ctx.fillStyle='#ffbd32';ctx.beginPath();ctx.moveTo(-4,10);ctx.lineTo(0,23+Math.random()*5);ctx.lineTo(4,10);ctx.fill();ctx.restore();ctx.textAlign='center';ctx.font='11px system-ui';ctx.fillStyle=other?'#ffc0a0':'#b4f6ff';ctx.fillText(name,x,y-29)}
function draw(t){ctx.save();if(screenShake>0){ctx.translate((Math.random()-.5)*screenShake,(Math.random()-.5)*screenShake)}background(t);shock.forEach(s=>{ctx.globalAlpha=Math.max(0,s.l/.5);ctx.strokeStyle='#75eaff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.stroke()});ctx.globalAlpha=1;ast.forEach(a=>{ctx.save();ctx.translate(a.x,a.y);ctx.rotate(a.r);ctx.beginPath();a.pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=a.special?'#24132f':'#41475a';ctx.fill();ctx.strokeStyle=a.neon?(a.special?'#ff55e8':'#57eaff'):'#8992aa';ctx.lineWidth=a.neon?2.5:2;if(a.neon){ctx.shadowBlur=18;ctx.shadowColor=ctx.strokeStyle}ctx.stroke();ctx.shadowBlur=0;ctx.restore()});remote.forEach(p=>p.lives>0&&rocket(p._x??p.x,p._y??p.y,p._a??p.angle,p.name,true,false,p.colour));if(me.active)rocket(me.x,me.y,me.angle,me.name,false,performance.now()/1000<me.inv);particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.l/.8);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()});ctx.globalAlpha=1;if(hitFlashTimer>0){ctx.fillStyle=`rgba(255,35,60,${Math.min(.24,hitFlashTimer*.9)})`;ctx.fillRect(0,0,W,H)}if(drag&&me.active){ctx.save();ctx.globalAlpha=.25;ctx.strokeStyle='#70eaff';ctx.beginPath();ctx.arc(targetX,targetY,18,0,7);ctx.stroke();ctx.restore()}ctx.restore()}
function loop(t){let dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw(t);requestAnimationFrame(loop)}requestAnimationFrame(loop);
