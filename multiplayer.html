<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>Asteroid Impact — Multiplayer</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;

    background:#02050d;
    color:white;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

canvas{
    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    display:block;

    touch-action:none;
}

button,
input{
    font-family:inherit;
}


/* =========================================================
   HUD
========================================================= */

#hud{
    position:fixed;

    top:env(safe-area-inset-top,10px);
    left:0;

    width:100%;

    padding:10px 12px;

    display:flex;
    justify-content:space-between;
    align-items:flex-start;

    z-index:10;

    pointer-events:none;
}

.box{
    padding:7px 11px;

    border-radius:12px;

    background:
        rgba(3,10,25,.68);

    border:
        1px solid
        rgba(100,200,255,.22);

    backdrop-filter:blur(8px);

    font-size:12px;
}

.box small{
    display:block;

    opacity:.55;

    font-size:8px;

    letter-spacing:1px;

    text-transform:uppercase;
}

.box strong{
    font-size:16px;
}


/* =========================================================
   STATUS
========================================================= */

#status{
    position:fixed;

    top:64px;
    left:50%;

    transform:translateX(-50%);

    z-index:10;

    padding:5px 11px;

    border-radius:20px;

    background:
        rgba(3,10,25,.55);

    font-size:10px;

    pointer-events:none;
}

#dot{
    display:inline-block;

    width:6px;
    height:6px;

    border-radius:50%;

    background:#ff4d4d;

    margin-right:5px;
}


/* =========================================================
   LEADERBOARD
========================================================= */

#leaderboard{
    position:fixed;

    top:100px;
    right:10px;

    width:145px;

    z-index:9;

    padding:9px;

    border-radius:13px;

    background:
        rgba(2,8,20,.55);

    border:
        1px solid
        rgba(100,200,255,.16);

    backdrop-filter:blur(7px);

    pointer-events:none;
}

.lbTitle{
    font-size:9px;

    text-transform:uppercase;

    letter-spacing:1px;

    opacity:.55;

    margin-bottom:5px;
}

.lbRow{
    display:flex;

    align-items:center;

    gap:5px;

    font-size:10px;

    line-height:18px;
}

.lbRank{
    width:15px;
    opacity:.45;
}

.lbName{
    flex:1;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}

.lbScore{
    font-weight:700;
}


/* =========================================================
   POWERUP
========================================================= */

#powerup{
    position:fixed;

    right:
        calc(
            14px +
            env(safe-area-inset-right)
        );

    bottom:
        calc(
            16px +
            env(safe-area-inset-bottom)
        );

    z-index:12;

    width:82px;
    height:82px;

    border-radius:50%;

    border:
        2px solid
        rgba(100,220,255,.45);

    background:
        radial-gradient(
            circle,
            rgba(30,130,220,.32),
            rgba(2,10,25,.9)
        );

    box-shadow:
        0 0 18px
        rgba(60,190,255,.16);

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    color:white;

    font-size:25px;

    cursor:pointer;

    user-select:none;

    transition:
        transform .12s,
        box-shadow .15s;
}

#powerup:active{
    transform:scale(.92);
}

#powerup.disabled{
    opacity:.35;

    filter:grayscale(.8);

    box-shadow:none;
}

#powerName{
    font-size:8px;

    letter-spacing:.7px;

    text-transform:uppercase;

    margin-top:1px;
}

#powerCharges{
    position:absolute;

    right:-3px;
    top:-3px;

    min-width:21px;
    height:21px;

    padding:0 5px;

    border-radius:20px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#0d9cff;

    border:2px solid #061326;

    font-size:10px;

    font-weight:800;
}


/* =========================================================
   OVERLAYS
========================================================= */

.overlay{
    position:fixed;

    inset:0;

    z-index:30;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:22px;

    background:
        radial-gradient(
            circle at center,
            rgba(15,45,100,.28),
            rgba(0,2,8,.96)
        );
}

.panel{
    width:min(420px,100%);

    padding:28px 22px;

    text-align:center;

    border-radius:22px;

    background:
        rgba(3,9,22,.94);

    border:
        1px solid
        rgba(100,190,255,.25);

    box-shadow:
        0 20px 80px
        rgba(0,0,0,.7);
}

.logo{
    font-size:43px;
}

h1{
    margin:5px 0 8px;

    font-size:28px;
}

.subtitle{
    opacity:.65;

    line-height:1.45;

    margin-bottom:18px;
}

input[type="text"]{
    width:100%;

    padding:14px;

    margin-top:7px;

    border-radius:12px;

    border:
        1px solid
        rgba(120,210,255,.22);

    background:
        rgba(255,255,255,.06);

    color:white;

    outline:none;

    font-size:16px;

    text-align:center;
}

.colourRow{
    margin:14px 0;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:10px;

    opacity:.8;

    font-size:12px;
}

#colour{
    width:48px;
    height:34px;

    padding:2px;

    border:0;

    background:none;
}

button{
    width:100%;

    padding:15px;

    margin-top:9px;

    border:0;

    border-radius:14px;

    color:white;

    font-size:16px;

    font-weight:800;

    background:
        linear-gradient(
            135deg,
            #148fff,
            #713dff
        );

    cursor:pointer;
}

.secondary{
    background:
        rgba(255,255,255,.08);

    font-size:14px;
}

#gameOver{
    display:none;
}

.finalScore{
    font-size:46px;

    font-weight:900;

    margin:12px;
}


/* =========================================================
   HITBOX
========================================================= */

#hitboxHint{
    position:fixed;

    left:50%;
    top:50%;

    width:50px;
    height:66px;

    transform:
        translate(-50%,-50%);

    border:
        1px solid
        rgba(90,220,255,.20);

    border-radius:
        48% 48% 42% 42%;

    box-shadow:
        0 0 7px
        rgba(70,210,255,.13);

    pointer-events:none;

    z-index:4;

    opacity:.62;
}

#hitboxHint.invulnerable{
    animation:
        shieldPulse .55s
        ease-in-out
        infinite alternate;
}

@keyframes shieldPulse{

    from{
        opacity:.28;

        box-shadow:
            0 0 5px
            rgba(100,220,255,.12);
    }

    to{
        opacity:.9;

        box-shadow:
            0 0 14px
            rgba(100,220,255,.45);
    }

}

</style>

</head>

<body>


<canvas id="game"></canvas>


<div id="hud">

    <div class="box">
        <small>Lives</small>
        <strong id="lives">❤️❤️❤️</strong>
    </div>

    <div class="box">
        <small>Score</small>
        <strong id="score">0</strong>
    </div>

    <div class="box">
        <small>Players</small>
        <strong id="players">1</strong>
    </div>

</div>


<div id="status">

    <span id="dot"></span>

    <span id="statusText">
        Connecting...
    </span>

</div>


<div id="leaderboard">

    <div class="lbTitle">
        🏆 Leaderboard
    </div>

    <div id="leaderboardRows"></div>

</div>


<div id="hitboxHint"></div>


<button id="powerup">

    🧲

    <span id="powerName">
        TOW
    </span>

    <span id="powerCharges">
        1
    </span>

</button>


<!-- =======================================================
     START MENU
======================================================= -->

<div
    class="overlay"
    id="menu"
>

    <div class="panel">

        <div class="logo">
            🚀
        </div>

        <h1>
            ASTEROID IMPACT
        </h1>

        <div class="subtitle">
            MULTIPLAYER
            <br>
            Destroy asteroids.
            Steer your rocket.
            Survive.
        </div>


        <input
            id="username"
            type="text"
            maxlength="16"
            placeholder="Username"
            value="Rocket"
        >


        <div class="colourRow">

            Rocket colour

            <input
                id="colour"
                type="color"
                value="#4fdcff"
            >

        </div>


        <button id="play">
            ▶ PLAY
        </button>

        <button
            class="secondary"
            id="back"
        >
            ← MAIN GAME
        </button>

    </div>

</div>


<!-- =======================================================
     GAME OVER
======================================================= -->

<div
    class="overlay"
    id="gameOver"
>

    <div class="panel">

        <div class="logo">
            💥
        </div>

        <h1>
            GAME OVER
        </h1>

        <div
            class="finalScore"
            id="finalScore"
        >
            0
        </div>

        <div>
            FINAL SCORE
        </div>

        <button id="again">
            🚀 PLAY AGAIN
        </button>

        <button
            class="secondary"
            id="menuButton"
        >
            MENU
        </button>

    </div>

</div>


<script>

/* =========================================================
   SERVER
========================================================= */

const SERVER =
    "wss://kinfo-game-studio.onrender.com";


/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;


function resize(){

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    W = innerWidth;
    H = innerHeight;

    canvas.width =
        W * dpr;

    canvas.height =
        H * dpr;

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}


addEventListener(
    "resize",
    resize
);

resize();


/* =========================================================
   WORLD
========================================================= */

let worldW = 2400;
let worldH = 1600;

let cameraX = worldW / 2;
let cameraY = worldH / 2;


/* =========================================================
   STATE
========================================================= */

let playing = false;

let connected = false;

let socket = null;

let myID = null;

let players = new Map();

let asteroids = new Map();

let score = 0;

let lives = 3;

let particles = [];

let explosions = [];

let shockwaves = [];

let landmarks = [];

let me = {

    x: worldW / 2,
    y: worldH / 2,

    angle: -Math.PI / 2,

    alive: true,

    colour: "#4fdcff",

    username: "Rocket",

    invulnerableUntil: 0,

    speedBoostUntil: 0,

    equippedPowerup: "tow",

    powerupCharges: 1

};


/* =========================================================
   CONSTANT MOVEMENT
========================================================= */

let speed = 2.4;

let thrust = 0.045;

let maxSpeed = 4.5;


/* =========================================================
   POINTER
========================================================= */

let dragging = false;

let pointerID = null;

let targetPointerX = W / 2;
let targetPointerY = H / 2;


/* =========================================================
   POWERUP UI
========================================================= */

const powerupButton =
    document.getElementById(
        "powerup"
    );

const powerName =
    document.getElementById(
        "powerName"
    );

const powerCharges =
    document.getElementById(
        "powerCharges"
    );


const powerIcons = {

    tow: "🧲",
    speed: "⚡",
    laser: "🔫",
    heart: "❤️"

};


const powerNames = {

    tow: "TOW",
    speed: "SPEED",
    laser: "LASER",
    heart: "HEART"

};


/* =========================================================
   UI
========================================================= */

const menu =
    document.getElementById("menu");

const gameOver =
    document.getElementById("gameOver");

const livesUI =
    document.getElementById("lives");

const scoreUI =
    document.getElementById("score");

const playersUI =
    document.getElementById("players");

const statusText =
    document.getElementById(
        "statusText"
    );

const dot =
    document.getElementById("dot");

const finalScore =
    document.getElementById(
        "finalScore"
    );

const leaderboardRows =
    document.getElementById(
        "leaderboardRows"
    );

const hitboxHint =
    document.getElementById(
        "hitboxHint"
    );


function status(
    text,
    online
){

    statusText.textContent =
        text;

    dot.style.background =
        online
            ? "#35ff82"
            : "#ff4d4d";
}


function updateHUD(){

    let hearts = "";

    for(
        let i = 0;
        i < 3;
        i++
    ){

        hearts +=
            i < lives
                ? "❤️"
                : "🖤";
    }

    livesUI.textContent =
        hearts;

    scoreUI.textContent =
        score;

    playersUI.textContent =
        players.size;


    updatePowerupUI();

    updateLeaderboard();
}


function updatePowerupUI(){

    const type =
        me.equippedPowerup ||
        "tow";


    powerupButton.firstChild
        .textContent =
        powerIcons[type] ||
        "🧲";


    powerName.textContent =
        powerNames[type] ||
        "TOW";


    powerCharges.textContent =
        me.powerupCharges || 0;


    powerupButton.classList.toggle(
        "disabled",
        !playing ||
        !me.alive ||
        !me.powerupCharges
    );
}


function updateLeaderboard(){

    const list =
        [...players.values()]
            .sort(
                (a,b) =>
                    (b.score || 0) -
                    (a.score || 0)
            )
            .slice(0,8);


    leaderboardRows.innerHTML =
        list.map(
            (p,i) => `

                <div class="lbRow">

                    <span class="lbRank">
                        ${i+1}
                    </span>

                    <span
                        class="lbName"
                        style="color:${p.colour || "#fff"}"
                    >
                        ${escapeHTML(
                            p.username ||
                            "Rocket"
                        )}
                    </span>

                    <span class="lbScore">
                        ${p.score || 0}
                    </span>

                </div>

            `
        ).join("");
}


function escapeHTML(text){

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =========================================================
   CONNECT
========================================================= */

function connect(){

    if(
        socket &&
        (
            socket.readyState ===
            WebSocket.OPEN ||

            socket.readyState ===
            WebSocket.CONNECTING
        )
    ){

        return;
    }


    status(
        "Connecting...",
        false
    );


    socket =
        new WebSocket(
            SERVER
        );


    socket.onopen = () => {

        connected = true;

        status(
            "ONLINE",
            true
        );


        send({

            type: "join",

            name:
                me.username,

            colour:
                me.colour

        });

    };


    socket.onmessage =
        event => {

            let msg;

            try {

                msg =
                    JSON.parse(
                        event.data
                    );

            } catch {

                return;

            }


            receive(msg);
        };


    socket.onclose = () => {

        connected = false;

        status(
            "Disconnected",
            false
        );

    };


    socket.onerror = () => {

        connected = false;

        status(
            "Connection error",
            false
        );

    };
}


function send(data){

    if(
        socket &&
        socket.readyState ===
        WebSocket.OPEN
    ){

        socket.send(
            JSON.stringify(data)
        );
    }
}


/* =========================================================
   RECEIVE
========================================================= */

function receive(m){

    if(
        m.type === "welcome"
    ){

        myID = m.id;

        worldW =
            m.worldWidth;

        worldH =
            m.worldHeight;

        return;
    }


    if(
        m.type === "world"
    ){

        syncWorld(m);

        return;
    }


    if(
        m.type ===
        "playerJoined"
    ){

        addOrUpdatePlayer(
            m.player
        );

        updateHUD();

        return;
    }


    if(
        m.type ===
        "profileChanged"
    ){

        addOrUpdatePlayer(
            m.player
        );

        updateHUD();

        return;
    }


    if(
        m.type ===
        "playerLeft"
    ){

        players.delete(
            m.id
        );

        updateHUD();

        return;
    }


    if(
        m.type ===
        "playerHit"
    ){

        const p =
            players.get(
                m.id
            );


        if(p){

            p.lives =
                m.lives;
        }


        if(
            m.id === myID
        ){

            lives =
                m.lives;

            me.invulnerableUntil =
                m.invulnerableUntil;


            createExplosion(
                me.x,
                me.y,
                .8
            );


            updateHUD();
        }


        updateLeaderboard();

        return;
    }


    if(
        m.type === "hit"
    ){

        lives =
            m.lives;

        me.invulnerableUntil =
            m.invulnerableUntil;

        updateHUD();

        return;
    }


    if(
        m.type ===
        "playerGameOver"
    ){

        const p =
            players.get(
                m.id
            );


        if(p){

            p.alive = false;

        }


        updateLeaderboard();

        return;
    }


    if(
        m.type ===
        "score"
    ){

        const p =
            players.get(
                m.playerId
            );


        if(p){

            p.score =
                m.score;
        }


        if(
            m.playerId === myID
        ){

            score =
                m.score;

        }


        updateHUD();

        return;
    }


    if(
        m.type === "blast"
    ){

        createExplosion(
            m.x,
            m.y,
            m.power
        );

        return;
    }


    if(
        m.type ===
        "powerupCollected"
    ){

        if(
            m.playerId === myID
        ){

            me.equippedPowerup =
                m.powerup;

            me.powerupCharges =
                m.charges;

            lives =
                m.lives;

            updateHUD();
        }


        return;
    }


    if(
        m.type ===
        "powerupUsed"
    ){

        if(
            m.powerup ===
            "speed"
        ){

            me.speedBoostUntil =
                performance.now() +
                (
                    m.duration ||
                    6000
                );
        }


        if(
            m.powerup ===
            "heart"
        ){

            lives =
                m.lives;
        }


        if(
            m.powerup ===
            "tow"
        ){

            me.equippedPowerup =
                "tow";
        }


        me.powerupCharges =
            m.charges;


        updateHUD();

        return;
    }


    if(
        m.type ===
        "killReward"
    ){

        createFloatingText(
            `+${m.amount} KILL`,
            W/2,
            H*.25
        );


        updateHUD();

        return;
    }


    if(
        m.type ===
        "gameOver"
    ){

        score =
            m.score;

        showGameOver();

        return;
    }
}


/* =========================================================
   PLAYERS
========================================================= */

function addOrUpdatePlayer(p){

    const old =
        players.get(
            p.id
        );


    if(old){

        old.netX = p.x;
        old.netY = p.y;
        old.netAngle = p.angle;

        old.score = p.score;
        old.lives = p.lives;

        old.username =
            p.username;

        old.colour =
            p.colour;

        old.alive =
            p.alive;

        return;
    }


    players.set(
        p.id,
        {

            ...p,

            netX:p.x,
            netY:p.y,
            netAngle:p.angle,

            drawX:p.x,
            drawY:p.y,
            drawAngle:p.angle

        }
    );
}


/* =========================================================
   WORLD SYNC
========================================================= */

function syncWorld(m){

    worldW = m.width;
    worldH = m.height;


    for(
        const p of m.players
    ){

        addOrUpdatePlayer(p);
    }


    const current =
        new Map();


    for(
        const a of m.asteroids
    ){

        const old =
            asteroids.get(
                a.id
            );


        if(old){

            old.netX = a.x;
            old.netY = a.y;

            old.netVX = a.vx;
            old.netVY = a.vy;

            old.angle = a.angle;

            old.size = a.size;
            old.radius = a.radius;

            old.special =
                a.special;

            old.isTow =
                a.isTow;

        }else{

            current.set(
                a.id,
                {

                    ...a,

                    netX:a.x,
                    netY:a.y,

                    netVX:a.vx,
                    netVY:a.vy,

                    drawX:a.x,
                    drawY:a.y,

                    drawAngle:a.angle

                }
            );

            continue;
        }


        current.set(
            a.id,
            old
        );
    }


    asteroids =
        current;


    const mine =
        players.get(
            myID
        );


    if(mine){

        lives =
            mine.lives;

        score =
            mine.score;

        me.alive =
            mine.alive;

        me.colour =
            mine.colour;

        me.username =
            mine.username;

        me.powerupCharges =
            mine.powerupCharges;

        me.equippedPowerup =
            mine.equippedPowerup;

        me.invulnerableUntil =
            mine.invulnerable
                ? performance.now()+100
                : 0;
    }


    updateHUD();
}


/* =========================================================
   MOVEMENT
========================================================= */

function updatePlayer(){

    if(
        !playing ||
        !me.alive
    ){
        return;
    }


    /*
     * Dragging anywhere controls the direction.
     *
     * The pointer position relative to screen centre
     * determines steering direction.
     */

    if(dragging){

        const dx =
            targetPointerX -
            W / 2;

        const dy =
            targetPointerY -
            H / 2;


        const distance =
            Math.hypot(
                dx,
                dy
            );


        if(
            distance > 8
        ){

            me.angle =
                Math.atan2(
                    dy,
                    dx
                );
        }
    }


    /*
     * Constant thrust.
     */

    const boost =
        performance.now() <
        me.speedBoostUntil
            ? 1.75
            : 1;


    speed +=
        thrust *
        boost;


    speed =
        Math.min(
            speed,
            maxSpeed * boost
        );


    me.x +=
        Math.cos(me.angle) *
        speed;

    me.y +=
        Math.sin(me.angle) *
        speed;


    /*
     * LOCAL wrapping.
     */

    if(
        me.x < 0
    ){
        me.x += worldW;
    }

    if(
        me.x >= worldW
    ){
        me.x -= worldW;
    }

    if(
        me.y < 0
    ){
        me.y += worldH;
    }

    if(
        me.y >= worldH
    ){
        me.y -= worldH;
    }


    /*
     * Camera follows player.
     */

    cameraX =
        smoothWrapped(
            cameraX,
            me.x,
            worldW,
            .08
        );

    cameraY =
        smoothWrapped(
            cameraY,
            me.y,
            worldH,
            .08
        );
}


function smoothWrapped(
    current,
    target,
    size,
    amount
){

    let diff =
        target -
        current;


    if(
        diff >
        size / 2
    ){
        diff -= size;
    }


    if(
        diff <
        -size / 2
    ){
        diff += size;
    }


    let result =
        current +
        diff * amount;


    if(result < 0)
        result += size;

    if(result >= size)
        result -= size;


    return result;
}


/* =========================================================
   SEND STATE
========================================================= */

let lastSend = 0;


function sendPlayer(){

    if(
        !connected ||
        !me.alive
    ){
        return;
    }


    const now =
        performance.now();


    if(
        now - lastSend <
        50
    ){
        return;
    }


    lastSend = now;


    send({

        type:"state",

        x:me.x,
        y:me.y,

        angle:me.angle

    });
}


/* =========================================================
   ANYWHERE DRAG CONTROL
========================================================= */

canvas.addEventListener(
    "pointerdown",
    e => {

        if(
            !playing ||
            !me.alive
        ){
            return;
        }


        /*
         * Every pointer-down is now a steering control.
         *
         * It does NOT fire an asteroid immediately.
         *
         * A tap on an asteroid is handled on pointerup
         * only if there was essentially no movement.
         */

        dragging = true;

        pointerID =
            e.pointerId;

        targetPointerX =
            e.clientX;

        targetPointerY =
            e.clientY;


        canvas.setPointerCapture(
            e.pointerId
        );

    }
);


canvas.addEventListener(
    "pointermove",
    e => {

        if(
            !dragging ||
            e.pointerId !==
            pointerID
        ){
            return;
        }


        targetPointerX =
            e.clientX;

        targetPointerY =
            e.clientY;
    }
);


canvas.addEventListener(
    "pointerup",
    e => {

        if(
            e.pointerId !==
            pointerID
        ){
            return;
        }


        /*
         * If the user didn't meaningfully move,
         * treat it as an asteroid tap.
         */

        const dx =
            e.clientX -
            targetPointerX;

        const dy =
            e.clientY -
            targetPointerY;


        const movement =
            Math.hypot(
                dx,
                dy
            );


        if(
            movement < 12
        ){

            const point =
                screenToWorld(
                    e.clientX,
                    e.clientY
                );


            send({

                type:"blast",

                x:point.x,
                y:point.y

            });
        }


        dragging = false;

        pointerID = null;
    }
);


/* =========================================================
   POWERUP BUTTON
========================================================= */

powerupButton.addEventListener(
    "pointerdown",
    e => {

        e.stopPropagation();

        e.preventDefault();


        if(
            !playing ||
            !me.alive ||
            !me.powerupCharges
        ){
            return;
        }


        /*
         * Laser gets its own activation.
         */

        if(
            me.equippedPowerup ===
            "laser"
        ){

            send({
                type:"laser"
            });

            return;
        }


        send({
            type:"usePowerup"
        });
    }
);


/* =========================================================
   COORDINATES
========================================================= */

function screenToWorld(
    x,
    y
){

    let wx =
        cameraX +
        (
            x -
            W / 2
        );


    let wy =
        cameraY +
        (
            y -
            H / 2
        );


    wx =
        ((wx % worldW)+worldW)
        %worldW;


    wy =
        ((wy % worldH)+worldH)
        %worldH;


    return {
        x:wx,
        y:wy
    };
}


function wrappedScreenPosition(
    x,
    y
){

    let dx =
        x -
        cameraX;


    let dy =
        y -
        cameraY;


    if(
        dx >
        worldW / 2
    ){
        dx -= worldW;
    }

    if(
        dx <
        -worldW / 2
    ){
        dx += worldW;
    }


    if(
        dy >
        worldH / 2
    ){
        dy -= worldH;
    }

    if(
        dy <
        -worldH / 2
    ){
        dy += worldH;
    }


    return {

        x:
            W / 2 + dx,

        y:
            H / 2 + dy

    };
}


/* =========================================================
   BACKGROUND
========================================================= */

function generateLandmarks(){

    landmarks = [];


    for(
        let i = 0;
        i < 32;
        i++
    ){

        landmarks.push({

            x:
                Math.random() *
                worldW,

            y:
                Math.random() *
                worldH,

            size:
                20 +
                Math.random()*70,

            type:
                Math.random() <
                .5
                    ? "station"
                    : "beacon"

        });
    }
}


generateLandmarks();


function drawBackground(){

    ctx.fillStyle =
        "#02050d";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
     * Deep radial space.
     */

    const gradient =
        ctx.createRadialGradient(
            W/2,
            H/2,
            0,
            W/2,
            H/2,
            Math.max(W,H)*.75
        );


    gradient.addColorStop(
        0,
        "rgba(20,50,100,.18)"
    );

    gradient.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );


    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
     * Navigation grid.
     */

    const grid = 200;


    ctx.strokeStyle =
        "rgba(80,170,220,.055)";

    ctx.lineWidth = 1;


    for(
        let x =
            Math.floor(
                cameraX/grid
            )*grid -
            grid*2;

        x <
            cameraX +
            W/2 +
            grid*2;

        x += grid
    ){

        const p =
            wrappedScreenPosition(
                x,
                cameraY
            );


        ctx.beginPath();

        ctx.moveTo(
            p.x,
            0
        );

        ctx.lineTo(
            p.x,
            H
        );

        ctx.stroke();
    }


    for(
        let y =
            Math.floor(
                cameraY/grid
            )*grid -
            grid*2;

        y <
            cameraY +
            H/2 +
            grid*2;

        y += grid
    ){

        const p =
            wrappedScreenPosition(
                cameraX,
                y
            );


        ctx.beginPath();

        ctx.moveTo(
            0,
            p.y
        );

        ctx.lineTo(
            W,
            p.y
        );

        ctx.stroke();
    }


    /*
     * Background landmarks.
     */

    for(
        const l of landmarks
    ){

        const p =
            wrappedScreenPosition(
                l.x,
                l.y
            );


        if(
            p.x < -100 ||
            p.x > W+100 ||
            p.y < -100 ||
            p.y > H+100
        ){
            continue;
        }


        ctx.globalAlpha =
            .22;


        if(
            l.type ===
            "station"
        ){

            ctx.strokeStyle =
                "#467b99";

            ctx.lineWidth = 1;


            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                l.size,
                0,
                Math.PI*2
            );

            ctx.stroke();


            ctx.beginPath();

            ctx.moveTo(
                p.x-l.size*1.4,
                p.y
            );

            ctx.lineTo(
                p.x+l.size*1.4,
                p.y
            );

            ctx.moveTo(
                p.x,
                p.y-l.size*1.4
            );

            ctx.lineTo(
                p.x,
                p.y+l.size*1.4
            );

            ctx.stroke();

        }else{

            ctx.fillStyle =
                "#476c82";

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                3,
                0,
                Math.PI*2
            );

            ctx.fill();


            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                l.size*.45,
                0,
                Math.PI*2
            );

            ctx.stroke();
        }
    }


    ctx.globalAlpha = 1;


    /*
     * Stars.
     */

    for(
        let i = 0;
        i < 120;
        i++
    ){

        const x =
            (
                i * 97
                -
                cameraX*.08
            ) % W;

        const y =
            (
                i * 53
                -
                cameraY*.08
            ) % H;


        ctx.globalAlpha =
            .2 +
            (
                i % 5
            )*.06;


        ctx.fillStyle =
            "#fff";


        ctx.beginPath();

        ctx.arc(
            (x+W)%W,
            (y+H)%H,
            .7,
            0,
            Math.PI*2
        );

        ctx.fill();
    }


    ctx.globalAlpha = 1;
}


/* =========================================================
   ASTEROIDS
========================================================= */

function drawAsteroid(a){

    const p =
        wrappedScreenPosition(
            a.drawX,
            a.drawY
        );


    /*
     * Draw wrapped duplicate copies near edges.
     */

    const positions = [
        [p.x,p.y]
    ];


    if(
        p.x < 80
    ){
        positions.push([
            p.x + W,
            p.y
        ]);
    }

    if(
        p.x > W-80
    ){
        positions.push([
            p.x - W,
            p.y
        ]);
    }

    if(
        p.y < 80
    ){
        positions.push([
            p.x,
            p.y + H
        ]);
    }

    if(
        p.y > H-80
    ){
        positions.push([
            p.x,
            p.y - H
        ]);
    }


    for(
        const pos of positions
    ){

        drawAsteroidAt(
            a,
            pos[0],
            pos[1]
        );
    }
}


function drawAsteroidAt(
    a,
    x,
    y
){

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.rotate(
        a.drawAngle
    );


    const radius =
        a.radius;


    const points =
        a.size === 3
            ? 10
            : a.size === 2
                ? 9
                : 8;


    /*
     * Special asteroid.
     */

    if(a.special){

        ctx.shadowBlur =
            20;

        ctx.shadowColor =
            a.special === "speed"
                ? "#ffe15c"
                : a.special === "laser"
                    ? "#ff4dff"
                    : "#ff5555";

        ctx.strokeStyle =
            a.special === "speed"
                ? "#ffe15c"
                : a.special === "laser"
                    ? "#ff4dff"
                    : "#ff5555";

    }else{

        ctx.shadowBlur = 10;

        ctx.shadowColor =
            "#5cdcff";

        ctx.strokeStyle =
            "#4fd6ff";
    }


    ctx.beginPath();


    for(
        let i=0;
        i<points;
        i++
    ){

        const variation =
            .82 +
            (
                (
                    i * 37 +
                    a.id.length * 13
                ) % 31
            ) / 100;


        const r =
            radius *
            variation;


        const angle =
            Math.PI*2 /
            points *
            i;


        const px =
            Math.cos(angle)*r;

        const py =
            Math.sin(angle)*r;


        if(i===0)
            ctx.moveTo(px,py);
        else
            ctx.lineTo(px,py);
    }


    ctx.closePath();


    ctx.fillStyle =
        a.special
            ? "rgba(20,20,45,.95)"
            : "rgba(8,15,30,.95)";


    ctx.fill();


    ctx.lineWidth =
        a.special
            ? 2.5
            : 2;


    ctx.stroke();


    ctx.shadowBlur = 0;


    /*
     * Powerup icon.
     */

    if(a.special){

        ctx.rotate(
            -a.drawAngle
        );


        ctx.fillStyle =
            "#fff";

        ctx.font =
            "bold 17px sans-serif";

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";


        const icon =
            a.special === "speed"
                ? "⚡"
                : a.special === "laser"
                    ? "🔫"
                    : "❤️";


        ctx.fillText(
            icon,
            0,
            0
        );
    }


    ctx.restore();
}


/* =========================================================
   ROCKET
========================================================= */

function drawRocket(
    x,
    y,
    angle,
    colour,
    local,
    username
){

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.rotate(
        angle +
        Math.PI/2
    );


    const invulnerable =
        local &&
        (
            performance.now() <
            me.invulnerableUntil
        );


    /*
     * Engine.
     */

    ctx.beginPath();

    ctx.moveTo(
        -6,
        11
    );

    ctx.lineTo(
        0,
        26 +
        Math.random()*5
    );

    ctx.lineTo(
        6,
        11
    );

    ctx.closePath();


    ctx.fillStyle =
        performance.now() <
        me.speedBoostUntil
            ? "#fff16a"
            : "#ff9f27";


    ctx.fill();


    /*
     * Rocket body.
     */

    ctx.beginPath();

    ctx.moveTo(
        0,
        -21
    );

    ctx.lineTo(
        -11,
        12
    );

    ctx.lineTo(
        0,
        7
    );

    ctx.lineTo(
        11,
        12
    );

    ctx.closePath();


    ctx.fillStyle =
        colour ||
        "#4fdcff";


    ctx.fill();


    ctx.strokeStyle =
        "#b9f2ff";

    ctx.lineWidth = 1.5;

    ctx.stroke();


    /*
     * Cockpit.
     */

    ctx.beginPath();

    ctx.arc(
        0,
        -6,
        4,
        0,
        Math.PI*2
    );


    ctx.fillStyle =
        "#061527";

    ctx.fill();


    ctx.strokeStyle =
        "#d5f7ff";

    ctx.stroke();


    /*
     * Tight subtle hitbox.
     */

    if(local){

        ctx.globalAlpha =
            invulnerable
                ? (
                    .25 +
                    Math.sin(
                        performance.now()*.012
                    )*.15
                )
                : .19;


        ctx.strokeStyle =
            "#69e5ff";

        ctx.lineWidth = 1;

        ctx.shadowBlur =
            invulnerable
                ? 10
                : 4;

        ctx.shadowColor =
            "#69e5ff";


        ctx.beginPath();

        ctx.moveTo(
            0,
            -22
        );

        ctx.lineTo(
            -9,
            9
        );

        ctx.lineTo(
            -6,
            13
        );

        ctx.lineTo(
            0,
            8
        );

        ctx.lineTo(
            6,
            13
        );

        ctx.lineTo(
            9,
            9
        );

        ctx.closePath();

        ctx.stroke();
    }


    ctx.restore();


    /*
     * Username above rocket.
     */

    if(
        username &&
        !local
    ){

        ctx.save();

        ctx.textAlign =
            "center";

        ctx.font =
            "10px sans-serif";

        ctx.fillStyle =
            colour ||
            "#fff";

        ctx.globalAlpha =
            .8;

        ctx.fillText(
            username,
            x,
            y-29
        );

        ctx.restore();
    }
}


/* =========================================================
   EFFECTS
========================================================= */

function createExplosion(
    x,
    y,
    power
){

    const maxRadius =
        45 * power;


    explosions.push({

        x,
        y,

        radius:5,

        maxRadius,

        life:0,

        maxLife:
            .42 +
            power*.06

    });


    shockwaves.push({

        x,
        y,

        radius:5,

        maxRadius,

        life:0,

        maxLife:.35

    });


    const count =
        Math.floor(
            22 * power
        );


    for(
        let i=0;
        i<count;
        i++
    ){

        const angle =
            Math.random() *
            Math.PI*2;


        const particleSpeed =
            (
                50 +
                Math.random()*190
            ) *
            power;


        const life =
            .25 +
            Math.random()*.4;


        particles.push({

            x,
            y,

            vx:
                Math.cos(angle) *
                particleSpeed,

            vy:
                Math.sin(angle) *
                particleSpeed,

            life,

            maxLife:life,

            size:
                1 +
                Math.random()*3

        });
    }
}


const floatingTexts=[];


function createFloatingText(
    text,
    x,
    y
){

    floatingTexts.push({

        text,
        x,
        y,

        life:1

    });
}


function updateEffects(dt){

    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const p =
            particles[i];


        p.x +=
            p.vx * dt;

        p.y +=
            p.vy * dt;


        p.life -= dt;


        if(
            p.life <= 0
        ){

            particles.splice(
                i,
                1
            );
        }
    }


    for(
        let i=explosions.length-1;
        i>=0;
        i--
    ){

        const e =
            explosions[i];


        e.life += dt;


        const progress =
            e.life /
            e.maxLife;


        e.radius =
            e.maxRadius *
            (
                1 -
                Math.pow(
                    1-progress,
                    2
                )
            );


        if(
            e.life >=
            e.maxLife
        ){

            explosions.splice(
                i,
                1
            );
        }
    }


    for(
        let i=shockwaves.length-1;
        i>=0;
        i--
    ){

        const s =
            shockwaves[i];


        s.life += dt;


        const progress =
            s.life /
            s.maxLife;


        s.radius =
            s.maxRadius *
            progress;


        if(
            s.life >=
            s.maxLife
        ){

            shockwaves.splice(
                i,
                1
            );
        }
    }


    for(
        let i=floatingTexts.length-1;
        i>=0;
        i--
    ){

        const f =
            floatingTexts[i];


        f.y -=
            25 * dt;

        f.life -= dt;


        if(
            f.life <= 0
        ){

            floatingTexts.splice(
                i,
                1
            );
        }
    }
}


function drawEffects(){

    for(
        const p of particles
    ){

        const pos =
            wrappedScreenPosition(
                p.x,
                p.y
            );


        ctx.globalAlpha =
            p.life /
            p.maxLife;


        ctx.fillStyle =
            "#6ce7ff";


        ctx.beginPath();

        ctx.arc(
            pos.x,
            pos.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();
    }


    for(
        const e of explosions
    ){

        const pos =
            wrappedScreenPosition(
                e.x,
                e.y
            );


        const alpha =
            1 -
            e.life /
            e.maxLife;


        const gradient =
            ctx.createRadialGradient(
                pos.x,
                pos.y,
                0,
                pos.x,
                pos.y,
                e.radius
            );


        gradient.addColorStop(
            0,
            `rgba(255,255,255,${alpha})`
        );

        gradient.addColorStop(
            .15,
            `rgba(90,230,255,${alpha*.95})`
        );

        gradient.addColorStop(
            .55,
            `rgba(100,100,255,${alpha*.3})`
        );

        gradient.addColorStop(
            1,
            "rgba(0,0,0,0)"
        );


        ctx.fillStyle =
            gradient;


        ctx.beginPath();

        ctx.arc(
            pos.x,
            pos.y,
            e.radius,
            0,
            Math.PI*2
        );

        ctx.fill();
    }


    for(
        const s of shockwaves
    ){

        const pos =
            wrappedScreenPosition(
                s.x,
                s.y
            );


        const alpha =
            1 -
            s.life /
            s.maxLife;


        ctx.globalAlpha =
            alpha*.7;


        ctx.strokeStyle =
            "#6ce7ff";

        ctx.lineWidth = 2;


        ctx.beginPath();

        ctx.arc(
            pos.x,
            pos.y,
            s.radius,
            0,
            Math.PI*2
        );

        ctx.stroke();
    }


    for(
        const f of floatingTexts
    ){

        ctx.globalAlpha =
            f.life;


        ctx.textAlign =
            "center";

        ctx.font =
            "bold 22px sans-serif";

        ctx.fillStyle =
            "#7ce7ff";


        ctx.fillText(
            f.text,
            f.x,
            f.y
        );
    }


    ctx.globalAlpha = 1;
}


/* =========================================================
   GAME START / DEATH
========================================================= */

function startGame(){

    const nameInput =
        document.getElementById(
            "username"
        );

    const colourInput =
        document.getElementById(
            "colour"
        );


    me.username =
        nameInput.value
            .trim()
            .slice(0,16)
            ||
            "Rocket";


    me.colour =
        colourInput.value ||
        "#4fdcff";


    /*
     * Reset local player.
     */

    me.x =
        worldW/2;

    me.y =
        worldH/2;

    me.angle =
        -Math.PI/2;

    me.alive = true;

    me.powerupCharges = 1;

    me.equippedPowerup =
        "tow";


    score = 0;

    lives = 3;

    speed = 2.4;


    playing = true;

    menu.style.display =
        "none";

    gameOver.style.display =
        "none";


    particles = [];
    explosions = [];
    shockwaves = [];


    if(!connected){

        connect();

    }else{

        send({

            type:"join",

            name:
                me.username,

            colour:
                me.colour

        });
    }


    updateHUD();
}


function showGameOver(){

    playing = false;

    dragging = false;

    me.alive = false;


    finalScore.textContent =
        score;


    gameOver.style.display =
        "flex";


    updateHUD();
}


function showMenu(){

    playing = false;

    dragging = false;

    gameOver.style.display =
        "none";

    menu.style.display =
        "flex";
}


/* =========================================================
   BUTTONS
========================================================= */

document
    .getElementById("play")
    .onclick =
    startGame;


document
    .getElementById("again")
    .onclick =
    startGame;


document
    .getElementById("menuButton")
    .onclick =
    showMenu;


document
    .getElementById("back")
    .onclick =
    () => {

        location.href =
            "index.html";
    };


/* =========================================================
   MAIN LOOP
========================================================= */

let lastFrame =
    performance.now();


function loop(){

    const now =
        performance.now();


    const dt =
        Math.min(
            .033,
            (
                now -
                lastFrame
            ) / 1000
        );


    lastFrame = now;


    updatePlayer();

    sendPlayer();


    /*
     * Remote players.
     */

    for(
        const p of players.values()
    ){

        if(
            p.id === myID
        ){
            continue;
        }


        p.drawX +=
            (
                p.netX -
                p.drawX
            ) * .22;


        p.drawY +=
            (
                p.netY -
                p.drawY
            ) * .22;


        let difference =
            p.netAngle -
            p.drawAngle;


        while(
            difference >
            Math.PI
        ){

            difference -=
                Math.PI*2;
        }


        while(
            difference <
            -Math.PI
        ){

            difference +=
                Math.PI*2;
        }


        p.drawAngle +=
            difference * .22;
    }


    /*
     * Asteroids.
     */

    for(
        const a of asteroids.values()
    ){

        a.drawX +=
            (
                a.netX -
                a.drawX
            ) * .24;


        a.drawY +=
            (
                a.netY -
                a.drawY
            ) * .24;


        a.drawAngle =
            a.angle;
    }


    updateEffects(dt);


    drawBackground();


    /*
     * Asteroids.
     */

    for(
        const a of asteroids.values()
    ){

        drawAsteroid(a);
    }


    /*
     * Other players.
     */

    for(
        const p of players.values()
    ){

        if(
            p.id === myID ||
            !p.alive
        ){
            continue;
        }


        const pos =
            wrappedScreenPosition(
                p.drawX,
                p.drawY
            );


        drawRocket(
            pos.x,
            pos.y,
            p.drawAngle,
            p.colour,
            false,
            p.username
        );
    }


    /*
     * Local rocket is always centred.
     */

    if(
        playing &&
        me.alive
    ){

        drawRocket(
            W/2,
            H/2,
            me.angle,
            me.colour,
            true,
            me.username
        );
    }


    drawEffects();


    requestAnimationFrame(
        loop
    );
}


connect();

loop();

</script>
