<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>Asteroid Impact — Multiplayer</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02050d;
    color:white;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
}

#hud{
    position:fixed;
    top:env(safe-area-inset-top,10px);
    left:0;
    width:100%;
    padding:12px 14px;

    display:flex;
    justify-content:space-between;

    z-index:5;
    pointer-events:none;
}

.box{
    padding:7px 11px;
    border-radius:12px;

    background:
        rgba(3,10,25,.68);

    border:
        1px solid
        rgba(100,200,255,.22);

    backdrop-filter:blur(8px);

    font-size:13px;
}

.box small{
    display:block;
    opacity:.55;
    font-size:9px;
    letter-spacing:1px;
    text-transform:uppercase;
}

.box strong{
    font-size:17px;
}

#status{
    position:fixed;

    top:70px;
    left:50%;

    transform:translateX(-50%);

    z-index:5;

    padding:5px 12px;

    border-radius:20px;

    background:
        rgba(3,10,25,.6);

    font-size:11px;

    pointer-events:none;
}

#dot{
    display:inline-block;

    width:7px;
    height:7px;

    border-radius:50%;

    background:#ff4d4d;

    margin-right:5px;
}

.overlay{
    position:fixed;
    inset:0;

    z-index:20;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:22px;

    background:
        radial-gradient(
            circle at center,
            rgba(15,45,100,.28),
            rgba(0,2,8,.96)
        );
}

.panel{
    width:min(400px,100%);

    padding:30px 22px;

    text-align:center;

    border-radius:22px;

    background:
        rgba(3,9,22,.92);

    border:
        1px solid
        rgba(100,190,255,.25);

    box-shadow:
        0 20px 80px
        rgba(0,0,0,.7);
}

.logo{
    font-size:45px;
}

h1{
    margin:5px 0 10px;
    font-size:29px;
}

.subtitle{
    opacity:.65;
    line-height:1.5;
    margin-bottom:22px;
}

button{
    width:100%;

    padding:16px;

    margin-top:10px;

    border:0;
    border-radius:14px;

    color:white;

    font-size:17px;
    font-weight:800;

    background:
        linear-gradient(
            135deg,
            #148fff,
            #713dff
        );

    cursor:pointer;
}

.secondary{
    background:
        rgba(255,255,255,.08);

    font-size:14px;
}

#gameOver{
    display:none;
}

.finalScore{
    font-size:48px;
    font-weight:900;
    margin:15px;
}


/* =========================================================
   SUBTLE HITBOX INDICATOR
========================================================= */

#hitboxHint{
    position:fixed;

    left:50%;
    top:50%;

    width:50px;
    height:66px;

    transform:
        translate(-50%,-50%)
        rotate(0deg);

    border:
        1px solid
        rgba(90,220,255,.22);

    border-radius:
        48% 48% 42% 42%;

    box-shadow:
        0 0 7px
        rgba(70,210,255,.16);

    pointer-events:none;

    z-index:4;

    opacity:.65;

    transition:
        opacity .2s,
        box-shadow .2s;
}

#hitboxHint.dragging{
    opacity:.95;

    border-color:
        rgba(100,230,255,.5);

    box-shadow:
        0 0 12px
        rgba(70,220,255,.32);
}

#hitboxHint.invulnerable{
    animation:
        shieldPulse .55s
        ease-in-out
        infinite alternate;
}

@keyframes shieldPulse{

    from{
        opacity:.35;
        box-shadow:
            0 0 5px
            rgba(100,220,255,.15);
    }

    to{
        opacity:.9;
        box-shadow:
            0 0 13px
            rgba(100,220,255,.42);
    }

}

</style>

</head>

<body>


<canvas id="game"></canvas>


<div id="hud">

    <div class="box">

        <small>Lives</small>

        <strong id="lives">
            ❤️❤️❤️
        </strong>

    </div>


    <div class="box">

        <small>Score</small>

        <strong id="score">
            0
        </strong>

    </div>


    <div class="box">

        <small>Players</small>

        <strong id="players">
            1
        </strong>

    </div>

</div>


<div id="status">

    <span id="dot"></span>

    <span id="statusText">
        Connecting...
    </span>

</div>


<div id="hitboxHint"></div>


<div
    class="overlay"
    id="menu"
>

    <div class="panel">

        <div class="logo">
            🚀
        </div>

        <h1>
            ASTEROID IMPACT
        </h1>

        <div class="subtitle">

            MULTIPLAYER

            <br><br>

            Tap asteroids to destroy them.

            <br>

            Drag from your rocket to move.

        </div>

        <button id="play">
            ▶ PLAY
        </button>

        <button
            class="secondary"
            id="back"
        >
            ← MAIN GAME
        </button>

    </div>

</div>


<div
    class="overlay"
    id="gameOver"
>

    <div class="panel">

        <div class="logo">
            💥
        </div>

        <h1>
            GAME OVER
        </h1>

        <div
            class="finalScore"
            id="finalScore"
        >
            0
        </div>

        <div>
            SCORE
        </div>

        <button id="again">
            🚀 PLAY AGAIN
        </button>

        <button
            class="secondary"
            id="menuButton"
        >
            MENU
        </button>

    </div>

</div>


<script>


/* =========================================================
   SERVER
========================================================= */

const SERVER=
    "wss://kinfo-game-studio.onrender.com";


/* =========================================================
   CANVAS
========================================================= */

const canvas=
    document.getElementById("game");

const ctx=
    canvas.getContext("2d");

let W=0;
let H=0;


function resize(){

    const dpr=
        Math.min(
            window.devicePixelRatio||1,
            2
        );

    W=innerWidth;
    H=innerHeight;

    canvas.width=W*dpr;
    canvas.height=H*dpr;

    canvas.style.width=W+"px";
    canvas.style.height=H+"px";

    ctx.setTransform(
        dpr,0,0,dpr,0,0
    );

}

addEventListener(
    "resize",
    resize
);

resize();


/* =========================================================
   WORLD
========================================================= */

let worldW=1200;
let worldH=800;

let cameraX=600;
let cameraY=400;


/* =========================================================
   GAME
========================================================= */

let playing=false;

let myID=null;

let connected=false;

let socket=null;

let reconnectTimer=null;

let score=0;

let lives=3;

let players=new Map();

let asteroids=new Map();

let particles=[];

let explosions=[];

let shockwaves=[];


/* =========================================================
   LOCAL PLAYER
========================================================= */

const me={

    x:600,
    y:400,

    angle:-Math.PI/2,

    alive:true,

    invulnerableUntil:0

};


let vx=0;
let vy=0;


/*
 * Movement is now based on a drag that begins on the rocket.
 */

let dragging=false;

let pointerID=null;

let dragStartX=0;
let dragStartY=0;

let targetX=W/2;
let targetY=H/2;


/* =========================================================
   HITBOX GEOMETRY
========================================================= */

const ROCKET_HITBOX=[

    {x:0,y:-22},

    {x:-9,y:9},

    {x:-6,y:13},

    {x:0,y:8},

    {x:6,y:13},

    {x:9,y:9}

];


/*
 * Same polygon is used visually and for determining whether
 * a pointer-down started on the rocket.
 */

function rotatePoint(
    x,
    y,
    angle
){

    const c=Math.cos(angle);
    const s=Math.sin(angle);

    return {

        x:x*c-y*s,
        y:x*s+y*c

    };

}


function pointInPolygon(
    px,
    py,
    polygon
){

    let inside=false;

    for(
        let i=0,
        j=polygon.length-1;

        i<polygon.length;

        j=i++
    ){

        const xi=polygon[i].x;
        const yi=polygon[i].y;

        const xj=polygon[j].x;
        const yj=polygon[j].y;


        const intersect=
            (
                yi>py
            ) !==
            (
                yj>py
            ) &&
            px<
            (
                xj-xi
            )*
            (
                py-yi
            )/
            (
                yj-yi
            )+
            xi;


        if(intersect){
            inside=!inside;
        }

    }

    return inside;

}


function pointerInsideRocket(
    screenX,
    screenY
){

    /*
     * Local rocket is centred on screen.
     */

    const dx=
        screenX-W/2;

    const dy=
        screenY-H/2;


    /*
     * Transform pointer into rocket-local coordinates.
     */

    const local=
        rotatePoint(
            dx,
            dy,
            -(
                me.angle+
                Math.PI/2
            )
        );


    /*
     * Small 5px tolerance so the ship doesn't feel
     * frustratingly difficult to grab.
     */

    const polygon=
        ROCKET_HITBOX.map(
            p=>({

                x:p.x,
                y:p.y

            })
        );


    if(
        pointInPolygon(
            local.x,
            local.y,
            polygon
        )
    ){
        return true;
    }


    /*
     * Slight forgiving area around the hull.
     */

    return (
        Math.hypot(
            local.x,
            local.y
        )<16
    );

}


/* =========================================================
   STARS
========================================================= */

const stars=[];

for(
    let i=0;
    i<180;
    i++
){

    stars.push({

        x:Math.random(),
        y:Math.random(),

        r:
            Math.random()*1.5+.3,

        a:
            Math.random()*.65+.2

    });

}


/* =========================================================
   UI
========================================================= */

const menu=
    document.getElementById("menu");

const gameOver=
    document.getElementById("gameOver");

const livesUI=
    document.getElementById("lives");

const scoreUI=
    document.getElementById("score");

const playersUI=
    document.getElementById("players");

const statusText=
    document.getElementById("statusText");

const dot=
    document.getElementById("dot");

const finalScore=
    document.getElementById("finalScore");

const hitboxHint=
    document.getElementById("hitboxHint");


function status(
    text,
    online
){

    statusText.textContent=text;

    dot.style.background=
        online
        ?" #35ff82"
        :"#ff4d4d";

}


function updateHUD(){

    let hearts="";

    for(
        let i=0;
        i<3;
        i++
    ){

        hearts+=
            i<lives
            ?"❤️"
            :"🖤";

    }

    livesUI.textContent=hearts;

    scoreUI.textContent=score;

    playersUI.textContent=
        players.size;

}


function updateHitboxUI(){

    hitboxHint.classList.toggle(
        "dragging",
        dragging
    );


    const invulnerable=
        Date.now()<
        me.invulnerableUntil;


    hitboxHint.classList.toggle(
        "invulnerable",
        invulnerable
    );


    /*
     * Match the actual rocket orientation.
     */

    hitboxHint.style.transform=
        `
        translate(-50%,-50%)
        rotate(${me.angle+Math.PI/2}rad)
        `;

}


/* =========================================================
   NETWORK
========================================================= */

function connect(){

    if(
        socket &&
        (
            socket.readyState===
            WebSocket.OPEN ||

            socket.readyState===
            WebSocket.CONNECTING
        )
    ){
        return;
    }


    status(
        "Connecting...",
        false
    );


    socket=
        new WebSocket(
            SERVER
        );


    socket.onopen=()=>{

        connected=true;

        status(
            "ONLINE",
            true
        );


        send({

            type:"join",
            name:"Rocket"

        });

    };


    socket.onmessage=
        event=>{

            let m;

            try{

                m=
                    JSON.parse(
                        event.data
                    );

            }catch{

                return;

            }

            receive(m);

        };


    socket.onclose=()=>{

        connected=false;

        status(
            "Disconnected",
            false
        );


        if(!reconnectTimer){

            reconnectTimer=
                setTimeout(
                    ()=>{

                        reconnectTimer=null;

                        connect();

                    },
                    2500
                );

        }

    };


    socket.onerror=()=>{

        connected=false;

        status(
            "Connection error",
            false
        );

    };

}


function send(data){

    if(
        socket &&
        socket.readyState===
        WebSocket.OPEN
    ){

        socket.send(
            JSON.stringify(data)
        );

    }

}


/* =========================================================
   RECEIVE
========================================================= */

function receive(m){

    if(
        m.type==="welcome"
    ){

        myID=m.id;

        worldW=m.worldWidth;
        worldH=m.worldHeight;

        return;

    }


    if(
        m.type==="world"
    ){

        syncWorld(m);

        return;

    }


    if(
        m.type==="playerJoined"
    ){

        players.set(
            m.player.id,
            {

                ...m.player,

                drawX:m.player.x,
                drawY:m.player.y,
                drawAngle:m.player.angle,

                netX:m.player.x,
                netY:m.player.y,
                netAngle:m.player.angle

            }
        );

        updateHUD();

        return;

    }


    if(
        m.type==="playerLeft"
    ){

        players.delete(m.id);

        updateHUD();

        return;

    }


    if(
        m.type==="playerHit"
    ){

        const p=
            players.get(m.id);


        if(p){

            p.lives=m.lives;

        }


        if(
            m.id===myID
        ){

            lives=m.lives;

            me.invulnerableUntil=
                m.invulnerableUntil;


            createExplosion(
                me.x,
                me.y,
                .75
            );


            updateHUD();

        }

        return;

    }


    if(
        m.type==="hit"
    ){

        lives=m.lives;

        me.invulnerableUntil=
            m.invulnerableUntil;

        updateHUD();

        return;

    }


    if(
        m.type==="playerGameOver"
    ){

        const p=
            players.get(m.id);


        if(p){

            p.alive=false;

        }

        return;

    }


    if(
        m.type==="score"
    ){

        if(
            m.playerId===myID
        ){

            score=m.score;

            scoreUI.textContent=
                score;

        }

        return;

    }


    if(
        m.type==="blast"
    ){

        createExplosion(
            m.x,
            m.y,
            m.power
        );

        return;

    }


    if(
        m.type==="gameOver"
    ){

        score=m.score;

        showGameOver();

    }

}


/* =========================================================
   WORLD SYNC
========================================================= */

function syncWorld(m){

    worldW=m.width;
    worldH=m.height;


    const newPlayers=
        new Map();


    for(
        const p of m.players
    ){

        const old=
            players.get(p.id);


        if(old){

            old.netX=p.x;
            old.netY=p.y;
            old.netAngle=p.angle;

            old.alive=p.alive;
            old.lives=p.lives;
            old.score=p.score;

            old.invulnerable=
                p.invulnerable;

            newPlayers.set(
                p.id,
                old
            );

        }else{

            newPlayers.set(

                p.id,

                {

                    ...p,

                    drawX:p.x,
                    drawY:p.y,
                    drawAngle:p.angle,

                    netX:p.x,
                    netY:p.y,
                    netAngle:p.angle

                }

            );

        }

    }


    players=newPlayers;


    const newAsteroids=
        new Map();


    for(
        const a of m.asteroids
    ){

        const old=
            asteroids.get(a.id);


        if(old){

            old.netX=a.x;
            old.netY=a.y;

            old.netVX=a.vx;
            old.netVY=a.vy;

            old.angle=a.angle;

            old.size=a.size;
            old.radius=a.radius;

            old.lastUpdate=
                performance.now();

            newAsteroids.set(
                a.id,
                old
            );

        }else{

            newAsteroids.set(

                a.id,

                {

                    ...a,

                    drawX:a.x,
                    drawY:a.y,

                    netX:a.x,
                    netY:a.y,

                    netVX:a.vx,
                    netVY:a.vy,

                    drawAngle:a.angle,

                    lastUpdate:
                        performance.now()

                }

            );

        }

    }


    asteroids=newAsteroids;


    const mine=
        players.get(myID);


    if(mine){

        lives=mine.lives;

        score=mine.score;

        me.alive=mine.alive;

        me.invulnerableUntil=
            mine.invulnerable
            ?Date.now()+100
            :0;

    }


    updateHUD();

}


/* =========================================================
   ASTEROIDS
========================================================= */

function updateAsteroids(){

    const now=
        performance.now();


    for(
        const a of asteroids.values()
    ){

        const dt=
            Math.min(
                .08,
                (
                    now-
                    a.lastUpdate
                )/1000
            );


        const predictedX=
            a.netX+
            a.netVX*dt;

        const predictedY=
            a.netY+
            a.netVY*dt;


        a.drawX+=
            (
                predictedX-
                a.drawX
            )*.24;


        a.drawY+=
            (
                predictedY-
                a.drawY
            )*.24;


        a.drawAngle=a.angle;

    }

}


/* =========================================================
   REMOTE PLAYERS
========================================================= */

function updateRemotePlayers(){

    for(
        const p of players.values()
    ){

        if(p.id===myID){
            continue;
        }


        p.drawX+=
            (
                p.netX-
                p.drawX
            )*.22;


        p.drawY+=
            (
                p.netY-
                p.drawY
            )*.22;


        let diff=
            p.netAngle-
            p.drawAngle;


        while(diff>Math.PI)
            diff-=Math.PI*2;

        while(diff<-Math.PI)
            diff+=Math.PI*2;


        p.drawAngle+=
            diff*.22;

    }

}


/* =========================================================
   ROCKET MOVEMENT
========================================================= */

function updatePlayer(){

    if(
        !playing ||
        !me.alive ||
        !dragging
    ){

        /*
         * Smoothly settle when the user releases.
         */

        vx*=.86;
        vy*=.86;

        me.x+=vx;
        me.y+=vy;

        return;

    }


    const dx=
        targetX-
        W/2;

    const dy=
        targetY-
        H/2;


    const d=
        Math.hypot(dx,dy);


    let wantedX=0;
    let wantedY=0;


    if(d>5){

        const speed=
            Math.min(
                d*.035,
                5
            );


        wantedX=
            dx/d*speed;

        wantedY=
            dy/d*speed;


        me.angle=
            Math.atan2(
                dy,
                dx
            );

    }


    vx+=
        (
            wantedX-vx
        )*.20;

    vy+=
        (
            wantedY-vy
        )*.20;


    me.x+=vx;
    me.y+=vy;


    me.x=
        Math.max(
            30,
            Math.min(
                worldW-30,
                me.x
            )
        );


    me.y=
        Math.max(
            30,
            Math.min(
                worldH-30,
                me.y
            )
        );


    cameraX+=
        (
            me.x-cameraX
        )*.12;


    cameraY+=
        (
            me.y-cameraY
        )*.12;

}


/* =========================================================
   SEND PLAYER
========================================================= */

let lastSend=0;


function sendPlayer(){

    if(
        !connected ||
        !me.alive
    ){
        return;
    }


    const now=
        performance.now();


    if(
        now-lastSend<
        50
    ){
        return;
    }


    lastSend=now;


    send({

        type:"state",

        x:me.x,
        y:me.y,
        angle:me.angle

    });

}


/* =========================================================
   POINTER CONTROL
========================================================= */

canvas.addEventListener(
    "pointerdown",
    e=>{

        if(
            !playing ||
            !me.alive
        ){
            return;
        }


        /*
         * IMPORTANT:
         *
         * Movement begins ONLY if the pointer starts on
         * the rocket.
         */

        if(
            pointerInsideRocket(
                e.clientX,
                e.clientY
            )
        ){

            dragging=true;

            pointerID=e.pointerId;

            dragStartX=e.clientX;
            dragStartY=e.clientY;

            targetX=e.clientX;
            targetY=e.clientY;

            canvas.setPointerCapture(
                e.pointerId
            );

            updateHitboxUI();

            return;

        }


        /*
         * Otherwise this is an asteroid tap.
         *
         * It does NOT influence movement.
         */

        const point=
            screenToWorld(
                e.clientX,
                e.clientY
            );


        send({

            type:"blast",

            x:point.x,
            y:point.y

        });

    }
);


canvas.addEventListener(
    "pointermove",
    e=>{

        if(
            !dragging ||
            e.pointerId!==pointerID
        ){
            return;
        }


        targetX=e.clientX;
        targetY=e.clientY;

    }
);


function releasePointer(e){

    if(
        e.pointerId!==pointerID
    ){
        return;
    }


    dragging=false;

    pointerID=null;

    updateHitboxUI();

}


canvas.addEventListener(
    "pointerup",
    releasePointer
);

canvas.addEventListener(
    "pointercancel",
    releasePointer
);


/* =========================================================
   COORDINATES
========================================================= */

function screenToWorld(
    x,
    y
){

    return {

        x:
            x-
            W/2+
            cameraX,

        y:
            y-
            H/2+
            cameraY

    };

}


function worldToScreen(
    x,
    y
){

    return {

        x:
            x-
            cameraX+
            W/2,

        y:
            y-
            cameraY+
            H/2

    };

}


/* =========================================================
   SPACE
========================================================= */

function drawSpace(){

    ctx.fillStyle=
        "#02050d";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    const g=
        ctx.createRadialGradient(
            W/2,
            H/2,
            0,
            W/2,
            H/2,
            Math.max(W,H)*.7
        );


    g.addColorStop(
        0,
        "rgba(20,50,100,.16)"
    );

    g.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );


    ctx.fillStyle=g;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    for(
        const s of stars
    ){

        ctx.globalAlpha=s.a;

        ctx.fillStyle="#fff";

        ctx.beginPath();

        ctx.arc(
            s.x*W,
            s.y*H,
            s.r,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    ctx.globalAlpha=1;

}


/* =========================================================
   ASTEROID
========================================================= */

function drawAsteroid(a){

    const p=
        worldToScreen(
            a.drawX,
            a.drawY
        );


    if(
        p.x<-100 ||
        p.x>W+100 ||
        p.y<-100 ||
        p.y>H+100
    ){
        return;
    }


    ctx.save();

    ctx.translate(
        p.x,
        p.y
    );

    ctx.rotate(
        a.drawAngle
    );


    const radius=a.radius;

    const points=
        a.size===3
        ?10
        :a.size===2
        ?9
        :8;


    ctx.beginPath();


    for(
        let i=0;
        i<points;
        i++
    ){

        let seed=0;

        for(
            let j=0;
            j<a.id.length;
            j++
        ){

            seed=
                (
                    seed*31+
                    a.id.charCodeAt(j)
                )>>>0;

        }


        seed=
            (
                seed+
                i*99991
            )>>>0;


        const variation=
            .78+
            (
                seed%100
            )/100*.4;


        const r=
            radius*variation;


        const angle=
            Math.PI*2/points*i;


        const x=
            Math.cos(angle)*r;

        const y=
            Math.sin(angle)*r;


        if(i===0)
            ctx.moveTo(x,y);
        else
            ctx.lineTo(x,y);

    }


    ctx.closePath();


    ctx.shadowBlur=12;

    ctx.shadowColor=
        "#5cdcff";


    ctx.fillStyle=
        a.hitFlash>0
        ?"white"
        :"rgba(8,15,30,.95)";


    ctx.fill();


    ctx.shadowBlur=0;


    ctx.lineWidth=2;

    ctx.strokeStyle=
        "#4fd6ff";

    ctx.stroke();


    ctx.globalAlpha=.28;

    ctx.fillStyle=
        "#4fd6ff";


    for(
        let i=0;
        i<Math.max(1,a.size);
        i++
    ){

        const ang=i*2.2;


        ctx.beginPath();

        ctx.arc(
            Math.cos(ang)*radius*.28,
            Math.sin(ang)*radius*.28,
            radius*.08,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    ctx.restore();

}


/* =========================================================
   ROCKET
========================================================= */

function drawRocket(
    x,
    y,
    angle,
    local
){

    ctx.save();

    ctx.translate(x,y);

    ctx.rotate(
        angle+
        Math.PI/2
    );


    const invulnerable=
        local &&
        Date.now()<
        me.invulnerableUntil;


    /*
     * Engine flame.
     */

    ctx.beginPath();

    ctx.moveTo(-6,11);

    ctx.lineTo(
        0,
        26+
        Math.random()*5
    );

    ctx.lineTo(6,11);

    ctx.closePath();

    ctx.fillStyle=
        "#ffb12b";

    ctx.fill();


    /*
     * Rocket hull.
     */

    ctx.beginPath();

    ctx.moveTo(0,-21);

    ctx.lineTo(-11,12);

    ctx.lineTo(0,7);

    ctx.lineTo(11,12);

    ctx.closePath();


    ctx.fillStyle=
        local
        ?"white"
        :"#54a8ff";


    ctx.fill();


    ctx.strokeStyle=
        "#65d9ff";

    ctx.lineWidth=2;

    ctx.stroke();


    /*
     * Cockpit.
     */

    ctx.beginPath();

    ctx.arc(
        0,
        -6,
        4,
        0,
        Math.PI*2
    );

    ctx.fillStyle=
        "#08162a";

    ctx.fill();

    ctx.strokeStyle=
        "#70dcff";

    ctx.stroke();


    /*
     * Very subtle local hitbox.
     *
     * This uses the same shape as the server collision
     * polygon.
     */

    if(local){

        ctx.globalAlpha=
            invulnerable
            ?(
                .22+
                Math.sin(
                    performance.now()*.012
                )*.13
            )
            :.20;


        ctx.strokeStyle=
            "#69e5ff";

        ctx.lineWidth=1;


        ctx.shadowBlur=
            invulnerable
            ?9
            :4;

        ctx.shadowColor=
            "#69e5ff";


        ctx.beginPath();


        ROCKET_HITBOX.forEach(
            (p,i)=>{

                if(i===0){

                    ctx.moveTo(
                        p.x,
                        p.y
                    );

                }else{

                    ctx.lineTo(
                        p.x,
                        p.y
                    );

                }

            }
        );


        ctx.closePath();

        ctx.stroke();

    }


    ctx.restore();

}


/* =========================================================
   EXPLOSION
========================================================= */

function createExplosion(
    x,
    y,
    power
){

    const maxRadius=
        45*power;


    explosions.push({

        x,
        y,

        radius:5,

        maxRadius,

        life:0,

        maxLife:
            .42+
            power*.06

    });


    shockwaves.push({

        x,
        y,

        radius:5,

        maxRadius,

        life:0,

        maxLife:.35

    });


    const count=
        Math.floor(
            22*power
        );


    for(
        let i=0;
        i<count;
        i++
    ){

        const angle=
            Math.random()*
            Math.PI*2;


        const speed=
            (
                50+
                Math.random()*190
            )*
            power;


        const life=
            .25+
            Math.random()*.4;


        particles.push({

            x,
            y,

            vx:
                Math.cos(angle)*
                speed,

            vy:
                Math.sin(angle)*
                speed,

            life,

            maxLife:life,

            size:
                1+
                Math.random()*3

        });

    }

}


/* =========================================================
   EFFECT UPDATE
========================================================= */

function updateEffects(dt){

    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const p=particles[i];

        p.x+=p.vx*dt;
        p.y+=p.vy*dt;

        p.life-=dt;


        if(p.life<=0){

            particles.splice(i,1);

        }

    }


    for(
        let i=explosions.length-1;
        i>=0;
        i--
    ){

        const e=explosions[i];

        e.life+=dt;


        const progress=
            e.life/e.maxLife;


        e.radius=
            e.maxRadius*
            (
                1-
                Math.pow(
                    1-progress,
                    2
                )
            );


        if(
            e.life>=
            e.maxLife
        ){

            explosions.splice(i,1);

        }

    }


    for(
        let i=shockwaves.length-1;
        i>=0;
        i--
    ){

        const s=shockwaves[i];

        s.life+=dt;


        const progress=
            s.life/s.maxLife;


        s.radius=
            s.maxRadius*
            progress;


        if(
            s.life>=
            s.maxLife
        ){

            shockwaves.splice(i,1);

        }

    }

}


/* =========================================================
   DRAW EFFECTS
========================================================= */

function drawEffects(){

    for(
        const p of particles
    ){

        const pos=
            worldToScreen(
                p.x,
                p.y
            );


        ctx.globalAlpha=
            p.life/
            p.maxLife;


        ctx.fillStyle=
            "#6ce7ff";


        ctx.beginPath();

        ctx.arc(
            pos.x,
            pos.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    for(
        const e of explosions
    ){

        const pos=
            worldToScreen(
                e.x,
                e.y
            );


        const alpha=
            1-
            e.life/e.maxLife;


        const g=
            ctx.createRadialGradient(
                pos.x,
                pos.y,
                0,
                pos.x,
                pos.y,
                e.radius
            );


        g.addColorStop(
            0,
            `rgba(255,255,255,${alpha})`
        );

        g.addColorStop(
            .15,
            `rgba(90,230,255,${alpha*.95})`
        );

        g.addColorStop(
            .55,
            `rgba(100,100,255,${alpha*.3})`
        );

        g.addColorStop(
            1,
            "rgba(0,0,0,0)"
        );


        ctx.fillStyle=g;

        ctx.beginPath();

        ctx.arc(
            pos.x,
            pos.y,
            e.radius,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    for(
        const s of shockwaves
    ){

        const pos=
            worldToScreen(
                s.x,
                s.y
            );


        const alpha=
            1-
            s.life/s.maxLife;


        ctx.globalAlpha=
            alpha*.7;


        ctx.strokeStyle=
            "#6ce7ff";

        ctx.lineWidth=2;


        ctx.beginPath();

        ctx.arc(
            pos.x,
            pos.y,
            s.radius,
            0,
            Math.PI*2
        );

        ctx.stroke();

    }


    ctx.globalAlpha=1;

}


/* =========================================================
   GAME CONTROL
========================================================= */

function startGame(){

    playing=true;

    menu.style.display="none";
    gameOver.style.display="none";

    if(!connected){
        connect();
    }

    dragging=false;

    vx=0;
    vy=0;

    particles=[];
    explosions=[];
    shockwaves=[];

    updateHitboxUI();

}


function showGameOver(){

    playing=false;

    dragging=false;

    finalScore.textContent=
        score;

    gameOver.style.display=
        "flex";

    updateHitboxUI();

}


function showMenu(){

    playing=false;

    dragging=false;

    gameOver.style.display=
        "none";

    menu.style.display=
        "flex";

    updateHitboxUI();

}


document
    .getElementById("play")
    .onclick=
    startGame;


document
    .getElementById("again")
    .onclick=
    startGame;


document
    .getElementById("menuButton")
    .onclick=
    showMenu;


document
    .getElementById("back")
    .onclick=
    ()=>{
        location.href=
            "index.html";
    };


/* =========================================================
   MAIN LOOP
========================================================= */

let lastFrame=
    performance.now();


function loop(){

    const now=
        performance.now();


    const dt=
        Math.min(
            .033,
            (now-lastFrame)/1000
        );


    lastFrame=now;


    updatePlayer();

    sendPlayer();

    updateAsteroids();

    updateRemotePlayers();

    updateEffects(dt);

    updateHitboxUI();


    drawSpace();


    for(
        const a of asteroids.values()
    ){

        drawAsteroid(a);

    }


    for(
        const p of players.values()
    ){

        if(
            p.id===myID ||
            !p.alive
        ){
            continue;
        }


        const pos=
            worldToScreen(
                p.drawX,
                p.drawY
            );


        drawRocket(
            pos.x,
            pos.y,
            p.drawAngle,
            false
        );

    }


    if(
        playing &&
        me.alive
    ){

        drawRocket(
            W/2,
            H/2,
            me.angle,
            true
        );

    }


    drawEffects();


    requestAnimationFrame(loop);

}


connect();

loop();

</script>
