<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Rocket Impact Multiplayer</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #02050d;
    color: white;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
}

#hud {
    position: fixed;
    top: env(safe-area-inset-top, 12px);
    left: 0;
    width: 100%;

    padding:
        12px
        14px
        0
        14px;

    display: flex;
    justify-content: space-between;
    align-items: flex-start;

    pointer-events: none;

    z-index: 5;
}

.hudBox {
    background: rgba(5, 10, 25, 0.72);
    border: 1px solid rgba(120, 180, 255, 0.25);
    border-radius: 14px;

    padding: 8px 12px;

    backdrop-filter: blur(8px);

    font-size: 13px;
}

.hudTitle {
    font-size: 10px;
    opacity: 0.6;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.hudValue {
    font-size: 17px;
    font-weight: 700;
}

#status {
    position: fixed;

    top:
        calc(
            env(safe-area-inset-top, 12px)
            + 72px
        );

    left: 50%;

    transform: translateX(-50%);

    padding: 7px 14px;

    border-radius: 20px;

    background: rgba(5, 10, 25, 0.7);

    font-size: 12px;

    pointer-events: none;

    z-index: 5;
}

#menu,
#gameOver {
    position: fixed;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 24px;

    background:
        radial-gradient(
            circle at center,
            rgba(15, 45, 100, 0.3),
            rgba(1, 3, 10, 0.96)
        );

    z-index: 20;
}

.panel {
    width: min(420px, 100%);

    padding: 32px 24px;

    border-radius: 24px;

    background:
        rgba(5, 10, 24, 0.9);

    border:
        1px solid
        rgba(130, 190, 255, 0.25);

    box-shadow:
        0 25px 80px
        rgba(0, 0, 0, 0.6);

    text-align: center;
}

.logo {
    font-size: 42px;
    margin-bottom: 8px;
}

h1 {
    margin: 0;

    font-size: 30px;
    letter-spacing: 1px;
}

.subtitle {
    margin:
        10px
        0
        28px;

    opacity: 0.65;

    line-height: 1.5;
}

.bigButton {
    width: 100%;

    border: 0;

    border-radius: 16px;

    padding: 17px;

    margin-top: 12px;

    font-size: 17px;
    font-weight: 800;

    color: white;

    background:
        linear-gradient(
            135deg,
            #1769ff,
            #7c35ff
        );

    cursor: pointer;

    box-shadow:
        0 8px 30px
        rgba(30, 100, 255, 0.25);
}

.secondaryButton {
    background:
        rgba(255,255,255,0.08);

    box-shadow: none;

    font-size: 14px;
}

.bigButton:active {
    transform: scale(0.98);
}

#gameOver {
    display: none;
}

.scoreBig {
    font-size: 48px;
    font-weight: 900;
    margin: 15px 0;
}

#connectionDot {
    display: inline-block;

    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #777;

    margin-right: 5px;
}

</style>

</head>

<body>

<canvas id="game"></canvas>

<div id="hud">

    <div class="hudBox">

        <div class="hudTitle">
            Lives
        </div>

        <div
            class="hudValue"
            id="lives"
        >
            ❤️❤️❤️
        </div>

    </div>

    <div class="hudBox">

        <div class="hudTitle">
            Score
        </div>

        <div
            class="hudValue"
            id="score"
        >
            0
        </div>

    </div>

    <div class="hudBox">

        <div class="hudTitle">
            Players
        </div>

        <div
            class="hudValue"
            id="players"
        >
            1
        </div>

    </div>

</div>

<div id="status">
    <span id="connectionDot"></span>
    <span id="connectionText">
        Connecting...
    </span>
</div>

<!-- MENU -->

<div id="menu">

    <div class="panel">

        <div class="logo">
            🚀
        </div>

        <h1>
            ROCKET IMPACT
        </h1>

        <div class="subtitle">
            Multiplayer asteroid survival.
            <br>
            Tap asteroids to destroy them.
            <br>
            Avoid the debris!
        </div>

        <button
            class="bigButton"
            id="playButton"
        >
            ▶ PLAY
        </button>

        <button
            class="bigButton secondaryButton"
            id="backButton"
        >
            ← BACK TO MAIN GAME
        </button>

    </div>

</div>

<!-- GAME OVER -->

<div id="gameOver">

    <div class="panel">

        <div class="logo">
            💥
        </div>

        <h1>
            GAME OVER
        </h1>

        <div class="subtitle">
            Your rocket was destroyed.
        </div>

        <div
            class="scoreBig"
            id="finalScore"
        >
            0
        </div>

        <div>
            FINAL SCORE
        </div>

        <button
            class="bigButton"
            id="againButton"
        >
            🚀 PLAY AGAIN
        </button>

        <button
            class="bigButton secondaryButton"
            id="menuButton"
        >
            MENU
        </button>

    </div>

</div>

<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const SERVER_URL =
    "wss://kinfo-game-studio.onrender.com";


/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

let screenWidth = 0;
let screenHeight = 0;

function resize() {

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    screenWidth =
        window.innerWidth;

    screenHeight =
        window.innerHeight;

    canvas.width =
        screenWidth * dpr;

    canvas.height =
        screenHeight * dpr;

    canvas.style.width =
        screenWidth + "px";

    canvas.style.height =
        screenHeight + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

window.addEventListener(
    "resize",
    resize
);

resize();


/* =========================================================
   GAME STATE
========================================================= */

let socket = null;

let myId = null;

let connected = false;

let playing = false;

let worldWidth = 1200;

let worldHeight = 800;

let cameraX = 0;
let cameraY = 0;

let players = new Map();

let asteroids = new Map();

let particles = [];

let explosions = [];

let stars = [];

let score = 0;

let lives = 3;

let reconnectTimer = null;

let lastStateSent = 0;


/* =========================================================
   LOCAL PLAYER
========================================================= */

let me = {

    x: worldWidth / 2,

    y: worldHeight / 2,

    angle: -Math.PI / 2,

    alive: true

};


/* =========================================================
   STARS
========================================================= */

for (
    let i = 0;
    i < 180;
    i++
) {

    stars.push({

        x: Math.random(),

        y: Math.random(),

        size:
            Math.random() * 1.8 + 0.3,

        alpha:
            Math.random() * 0.7 + 0.2
    });
}


/* =========================================================
   UI
========================================================= */

const menu =
    document.getElementById("menu");

const gameOver =
    document.getElementById("gameOver");

const livesElement =
    document.getElementById("lives");

const scoreElement =
    document.getElementById("score");

const playersElement =
    document.getElementById("players");

const statusElement =
    document.getElementById("connectionText");

const connectionDot =
    document.getElementById("connectionDot");

const finalScore =
    document.getElementById("finalScore");


function setStatus(
    text,
    online
) {

    statusElement.textContent =
        text;

    connectionDot.style.background =
        online
            ? "#35ff82"
            : "#ff5252";
}


function updateHUD() {

    let hearts = "";

    for (
        let i = 0;
        i < 3;
        i++
    ) {

        hearts +=
            i < lives
                ? "❤️"
                : "🖤";
    }

    livesElement.textContent =
        hearts;

    scoreElement.textContent =
        score;

    playersElement.textContent =
        players.size;
}


/* =========================================================
   WEBSOCKET
========================================================= */

function connect() {

    if (
        socket &&
        (
            socket.readyState ===
            WebSocket.OPEN ||

            socket.readyState ===
            WebSocket.CONNECTING
        )
    ) {
        return;
    }

    setStatus(
        "Connecting...",
        false
    );

    try {

        socket =
            new WebSocket(
                SERVER_URL
            );

    } catch (error) {

        setStatus(
            "Connection failed",
            false
        );

        scheduleReconnect();

        return;
    }


    socket.addEventListener(
        "open",
        () => {

            connected = true;

            setStatus(
                "ONLINE",
                true
            );

            /*
             * IMPORTANT:
             * We do NOT create another player here.
             *
             * The server already created our player
             * when this WebSocket connected.
             */

            send({

                type: "join",

                name: "Rocket"
            });
        }
    );


    socket.addEventListener(
        "message",
        event => {

            let message;

            try {

                message =
                    JSON.parse(
                        event.data
                    );

            } catch {

                return;
            }

            handleMessage(
                message
            );
        }
    );


    socket.addEventListener(
        "close",
        () => {

            connected = false;

            setStatus(
                "Disconnected",
                false
            );

            /*
             * If the socket genuinely closes,
             * reconnect.
             *
             * Death does NOT close the socket.
             */

            scheduleReconnect();
        }
    );


    socket.addEventListener(
        "error",
        () => {

            connected = false;

            setStatus(
                "Connection error",
                false
            );
        }
    );
}


function scheduleReconnect() {

    if (reconnectTimer) {
        return;
    }

    reconnectTimer =
        setTimeout(
            () => {

                reconnectTimer =
                    null;

                connect();

            },
            3000
        );
}


function send(data) {

    if (
        socket &&
        socket.readyState ===
        WebSocket.OPEN
    ) {

        socket.send(
            JSON.stringify(data)
        );
    }
}


/* =========================================================
   SERVER MESSAGES
========================================================= */

function handleMessage(
    message
) {

    switch (
        message.type
    ) {

        case "welcome":

            myId =
                message.id;

            worldWidth =
                message.worldWidth;

            worldHeight =
                message.worldHeight;

            break;


        case "world":

            worldWidth =
                message.width;

            worldHeight =
                message.height;

            /*
             * Synchronise players.
             */

            players.clear();

            for (
                const player
                of message.players
            ) {

                players.set(
                    player.id,
                    player
                );

                if (
                    player.id === myId
                ) {

                    me.x =
                        player.x;

                    me.y =
                        player.y;

                    me.angle =
                        player.angle;

                    me.alive =
                        player.alive;

                    lives =
                        player.lives;

                    score =
                        player.score;
                }
            }


            /*
             * Synchronise asteroids.
             */

            asteroids.clear();

            for (
                const asteroid
                of message.asteroids
            ) {

                asteroids.set(
                    asteroid.id,
                    asteroid
                );
            }

            updateHUD();

            break;


        case "playerJoined":

            players.set(
                message.player.id,
                message.player
            );

            updateHUD();

            break;


        case "playerUpdated":

            players.set(
                message.player.id,
                message.player
            );

            updateHUD();

            break;


        case "playerLeft":

            players.delete(
                message.id
            );

            updateHUD();

            break;


        case "blast":

            createExplosion(
                message.x,
                message.y,
                message.size
            );

            /*
             * The server sends the asteroid list
             * shortly afterwards.
             */

            break;


        case "score":

            if (
                message.playerId ===
                myId
            ) {

                score =
                    message.score;

                scoreElement.textContent =
                    score;
            }

            break;


        case "death":

            lives =
                message.lives;

            me.alive =
                false;

            updateHUD();

            createExplosion(
                me.x,
                me.y,
                50
            );

            break;


        case "respawn":

            me.x =
                message.player.x;

            me.y =
                message.player.y;

            me.angle =
                message.player.angle;

            me.alive =
                true;

            lives =
                message.player.lives;

            score =
                message.player.score;

            updateHUD();

            break;


        case "playerDeath":

            {

                const player =
                    players.get(
                        message.id
                    );

                if (player) {

                    player.alive =
                        false;

                    player.lives =
                        message.lives;
                }

                updateHUD();
            }

            break;


        case "playerRespawn":

            players.set(
                message.player.id,
                message.player
            );

            updateHUD();

            break;


        case "gameOver":

            score =
                message.score;

            showGameOver();

            break;
    }
}


/* =========================================================
   START / STOP
========================================================= */

function startGame() {

    playing = true;

    menu.style.display =
        "none";

    gameOver.style.display =
        "none";

    /*
     * Reset only local visual state.
     *
     * We do NOT open a new WebSocket.
     *
     * This is the fix for the duplicate player bug.
     */

    if (!connected) {
        connect();
    }

    me.alive = true;

    particles = [];

    explosions = [];
}


function showGameOver() {

    playing = false;

    finalScore.textContent =
        score;

    gameOver.style.display =
        "flex";
}


function returnToMenu() {

    playing = false;

    gameOver.style.display =
        "none";

    menu.style.display =
        "flex";
}


/* =========================================================
   BUTTONS
========================================================= */

document
    .getElementById("playButton")
    .addEventListener(
        "click",
        startGame
    );


document
    .getElementById("againButton")
    .addEventListener(
        "click",
        startGame
    );


document
    .getElementById("menuButton")
    .addEventListener(
        "click",
        returnToMenu
    );


document
    .getElementById("backButton")
    .addEventListener(
        "click",
        () => {

            window.location.href =
                "index.html";
        }
    );


/* =========================================================
   TOUCH / MOUSE
========================================================= */

function screenToWorld(
    x,
    y
) {

    return {

        x:
            x -
            screenWidth / 2 +
            cameraX,

        y:
            y -
            screenHeight / 2 +
            cameraY
    };
}


function blastAt(
    screenX,
    screenY
) {

    if (
        !playing ||
        !me.alive
    ) {
        return;
    }

    const point =
        screenToWorld(
            screenX,
            screenY
        );

    /*
     * Send the blast to the server.
     *
     * The server decides which asteroid(s)
     * are actually destroyed.
     */

    send({

        type: "blast",

        x: point.x,

        y: point.y,

        size: 32
    });
}


canvas.addEventListener(
    "pointerdown",
    event => {

        if (!playing) {
            return;
        }

        blastAt(
            event.clientX,
            event.clientY
        );
    },
    {
        passive: true
    }
);


/* =========================================================
   ROCKET MOVEMENT
========================================================= */

let targetX =
    screenWidth / 2;

let targetY =
    screenHeight / 2;


canvas.addEventListener(
    "pointermove",
    event => {

        targetX =
            event.clientX;

        targetY =
            event.clientY;
    }
);


canvas.addEventListener(
    "pointerdown",
    event => {

        targetX =
            event.clientX;

        targetY =
            event.clientY;
    }
);


function updateRocket() {

    if (
        !playing ||
        !me.alive
    ) {
        return;
    }

    const dx =
        targetX -
        screenWidth / 2;

    const dy =
        targetY -
        screenHeight / 2;

    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );

    if (
        distance > 10
    ) {

        const speed =
            Math.min(
                distance * 0.035,
                5
            );

        me.x +=
            dx /
            distance *
            speed;

        me.y +=
            dy /
            distance *
            speed;

        me.angle =
            Math.atan2(
                dy,
                dx
            );
    }

    me.x =
        Math.max(
            20,
            Math.min(
                worldWidth - 20,
                me.x
            )
        );

    me.y =
        Math.max(
            20,
            Math.min(
                worldHeight - 20,
                me.y
            )
        );
}


/* =========================================================
   SEND PLAYER POSITION
========================================================= */

function sendPlayerState() {

    if (
        !connected ||
        !me.alive
    ) {
        return;
    }

    const now =
        performance.now();

    /*
     * 20 updates/sec.
     */

    if (
        now -
        lastStateSent <
        50
    ) {
        return;
    }

    lastStateSent =
        now;

    send({

        type: "state",

        x: me.x,

        y: me.y,

        angle: me.angle
    });
}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera() {

    cameraX =
        me.x;

    cameraY =
        me.y;
}


/* =========================================================
   DRAW SPACE
========================================================= */

function drawSpace() {

    ctx.fillStyle =
        "#02050d";

    ctx.fillRect(
        0,
        0,
        screenWidth,
        screenHeight
    );


    for (
        const star
        of stars
    ) {

        const x =
            star.x *
            screenWidth;

        const y =
            star.y *
            screenHeight;

        ctx.globalAlpha =
            star.alpha;

        ctx.fillStyle =
            "#ffffff";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            star.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.globalAlpha =
        1;
}


/* =========================================================
   WORLD COORDINATES
========================================================= */

function worldToScreen(
    x,
    y
) {

    return {

        x:
            x -
            cameraX +
            screenWidth / 2,

        y:
            y -
            cameraY +
            screenHeight / 2
    };
}


/* =========================================================
   ASTEROIDS
========================================================= */

function drawAsteroid(
    asteroid
) {

    const pos =
        worldToScreen(
            asteroid.x,
            asteroid.y
        );

    const size =
        asteroid.size;

    if (
        pos.x < -100 ||
        pos.x >
        screenWidth + 100 ||
        pos.y < -100 ||
        pos.y >
        screenHeight + 100
    ) {
        return;
    }

    ctx.save();

    ctx.translate(
        pos.x,
        pos.y
    );

    ctx.rotate(
        asteroid.rotation
    );

    ctx.beginPath();

    const points = 9;

    for (
        let i = 0;
        i < points;
        i++
    ) {

        const angle =
            i /
            points *
            Math.PI *
            2;

        const variation =
            0.72 +
            Math.sin(
                i * 7.13 +
                asteroid.id.length
            ) *
            0.22;

        const radius =
            size *
            variation;

        const x =
            Math.cos(angle) *
            radius;

        const y =
            Math.sin(angle) *
            radius;

        if (i === 0) {
            ctx.moveTo(
                x,
                y
            );
        } else {
            ctx.lineTo(
                x,
                y
            );
        }
    }

    ctx.closePath();

    ctx.fillStyle =
        "#465064";

    ctx.fill();

    ctx.strokeStyle =
        "#8b96aa";

    ctx.lineWidth =
        1.5;

    ctx.stroke();


    /* Craters */

    ctx.globalAlpha =
        0.4;

    ctx.fillStyle =
        "#171d2a";

    for (
        let i = 0;
        i < 3;
        i++
    ) {

        const a =
            i * 2.2;

        const r =
            size *
            (0.12 + i * 0.025);

        ctx.beginPath();

        ctx.arc(
            Math.cos(a) *
            size *
            0.35,

            Math.sin(a) *
            size *
            0.35,

            r,

            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.restore();
}


/* =========================================================
   ROCKET
========================================================= */

function drawRocket(
    player,
    local = false
) {

    if (
        !player.alive
    ) {
        return;
    }

    const pos =
        worldToScreen(
            player.x,
            player.y
        );

    ctx.save();

    ctx.translate(
        pos.x,
        pos.y
    );

    ctx.rotate(
        player.angle +
        Math.PI / 2
    );


    /* Engine flame */

    ctx.beginPath();

    ctx.moveTo(
        -7,
        14
    );

    ctx.lineTo(
        0,
        30 +
        Math.random() * 7
    );

    ctx.lineTo(
        7,
        14
    );

    ctx.closePath();

    ctx.fillStyle =
        "#ffad33";

    ctx.fill();


    /* Rocket body */

    ctx.beginPath();

    ctx.moveTo(
        0,
        -20
    );

    ctx.lineTo(
        -10,
        12
    );

    ctx.lineTo(
        0,
        8
    );

    ctx.lineTo(
        10,
        12
    );

    ctx.closePath();

    ctx.fillStyle =
        local
            ? "#ffffff"
            : "#4d9cff";

    ctx.fill();

    ctx.strokeStyle =
        local
            ? "#75b5ff"
            : "#8dc6ff";

    ctx.lineWidth =
        2;

    ctx.stroke();


    /* Window */

    ctx.beginPath();

    ctx.arc(
        0,
        -6,
        4,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#091529";

    ctx.fill();

    ctx.strokeStyle =
        "#80c7ff";

    ctx.stroke();


    ctx.restore();


    /* Name */

    if (!local) {

        ctx.font =
            "11px system-ui";

        ctx.textAlign =
            "center";

        ctx.fillStyle =
            "rgba(180,215,255,0.8)";

        ctx.fillText(
            player.name || "Rocket",
            pos.x,
            pos.y - 30
        );
    }
}


/* =========================================================
   PARTICLES
========================================================= */

function createExplosion(
    x,
    y,
    size
) {

    explosions.push({

        x,
        y,

        radius: 5,

        maxRadius:
            size * 2,

        life: 1
    });


    for (
        let i = 0;
        i < 28;
        i++
    ) {

        const angle =
            Math.random() *
            Math.PI *
            2;

        const speed =
            Math.random() *
            5 +
            1;

        particles.push({

            x,
            y,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            life: 1,

            size:
                Math.random() *
                3 +
                1
        });
    }
}


function updateParticles() {

    for (
        let i =
            particles.length - 1;
        i >= 0;
        i--
    ) {

        const p =
            particles[i];

        p.x +=
            p.vx;

        p.y +=
            p.vy;

        p.vx *=
            0.97;

        p.vy *=
            0.97;

        p.life -=
            0.025;

        if (
            p.life <= 0
        ) {

            particles.splice(
                i,
                1
            );
        }
    }


    for (
        let i =
            explosions.length - 1;
        i >= 0;
        i--
    ) {

        const e =
            explosions[i];

        e.radius +=
            e.maxRadius *
            0.08;

        e.life -=
            0.04;

        if (
            e.life <= 0
        ) {

            explosions.splice(
                i,
                1
            );
        }
    }
}


function drawParticles() {

    for (
        const p
        of particles
    ) {

        const pos =
            worldToScreen(
                p.x,
                p.y
            );

        ctx.globalAlpha =
            p.life;

        ctx.fillStyle =
            "#ffffff";

        ctx.beginPath();

        ctx.arc(
            pos.x,
            pos.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }


    for (
        const e
        of explosions
    ) {

        const pos =
            worldToScreen(
                e.x,
                e.y
            );

        ctx.globalAlpha =
            e.life;

        ctx.strokeStyle =
            "#ffffff";

        ctx.lineWidth =
            3;

        ctx.beginPath();

        ctx.arc(
            pos.x,
            pos.y,
            e.radius,
            0,
            Math.PI * 2
        );

        ctx.stroke();
    }

    ctx.globalAlpha =
        1;
}


/* =========================================================
   MAIN DRAW
========================================================= */

function draw() {

    drawSpace();

    /*
     * Draw asteroids.
     */

    for (
        const asteroid
        of asteroids.values()
    ) {

        drawAsteroid(
            asteroid
        );
    }


    /*
     * Draw other players.
     */

    for (
        const player
        of players.values()
    ) {

        if (
            player.id === myId
        ) {
            continue;
        }

        drawRocket(
            player,
            false
        );
    }


    /*
     * Draw our rocket last.
     */

    if (
        playing &&
        me.alive
    ) {

        drawRocket(
            {

                x: me.x,

                y: me.y,

                angle: me.angle,

                alive: true

            },
            true
        );
    }


    drawParticles();
}


/* =========================================================
   GAME LOOP
========================================================= */

function loop() {

    updateRocket();

    updateCamera();

    sendPlayerState();

    updateParticles();

    draw();

    requestAnimationFrame(
        loop
    );
}


/* =========================================================
   INITIALISE
========================================================= */

connect();

loop();

</script>
