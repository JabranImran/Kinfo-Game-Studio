<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Rocket Impact Multiplayer</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02050d;
    color:white;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
}

#hud{
    position:fixed;
    top:env(safe-area-inset-top,12px);
    left:0;
    width:100%;

    padding:
        12px
        14px
        0
        14px;

    display:flex;
    justify-content:space-between;
    align-items:flex-start;

    pointer-events:none;
    z-index:5;
}

.hudBox{
    background:rgba(5,10,25,.72);
    border:1px solid rgba(120,180,255,.25);
    border-radius:14px;

    padding:8px 12px;

    backdrop-filter:blur(8px);

    font-size:13px;
}

.hudTitle{
    font-size:10px;
    opacity:.6;
    text-transform:uppercase;
    letter-spacing:1px;
}

.hudValue{
    font-size:17px;
    font-weight:700;
}

#status{
    position:fixed;

    top:
        calc(
            env(safe-area-inset-top,12px)
            +72px
        );

    left:50%;

    transform:translateX(-50%);

    padding:7px 14px;

    border-radius:20px;

    background:rgba(5,10,25,.7);

    font-size:12px;

    pointer-events:none;
    z-index:5;
}

#connectionDot{
    display:inline-block;

    width:8px;
    height:8px;

    border-radius:50%;

    background:#777;

    margin-right:5px;
}

#menu,
#gameOver{
    position:fixed;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:24px;

    background:
        radial-gradient(
            circle at center,
            rgba(15,45,100,.3),
            rgba(1,3,10,.96)
        );

    z-index:20;
}

.panel{
    width:min(420px,100%);

    padding:32px 24px;

    border-radius:24px;

    background:rgba(5,10,24,.9);

    border:
        1px solid
        rgba(130,190,255,.25);

    box-shadow:
        0 25px 80px
        rgba(0,0,0,.6);

    text-align:center;
}

.logo{
    font-size:42px;
    margin-bottom:8px;
}

h1{
    margin:0;
    font-size:30px;
    letter-spacing:1px;
}

.subtitle{
    margin:10px 0 28px;

    opacity:.65;

    line-height:1.5;
}

.bigButton{
    width:100%;

    border:0;

    border-radius:16px;

    padding:17px;

    margin-top:12px;

    font-size:17px;
    font-weight:800;

    color:white;

    background:
        linear-gradient(
            135deg,
            #1769ff,
            #7c35ff
        );

    cursor:pointer;

    box-shadow:
        0 8px 30px
        rgba(30,100,255,.25);
}

.secondaryButton{
    background:
        rgba(255,255,255,.08);

    box-shadow:none;

    font-size:14px;
}

.bigButton:active{
    transform:scale(.98);
}

#gameOver{
    display:none;
}

.scoreBig{
    font-size:48px;
    font-weight:900;
    margin:15px 0;
}

</style>

</head>

<body>

<canvas id="game"></canvas>


<!-- HUD -->

<div id="hud">

    <div class="hudBox">

        <div class="hudTitle">
            Lives
        </div>

        <div
            class="hudValue"
            id="lives"
        >
            ❤️❤️❤️
        </div>

    </div>


    <div class="hudBox">

        <div class="hudTitle">
            Score
        </div>

        <div
            class="hudValue"
            id="score"
        >
            0
        </div>

    </div>


    <div class="hudBox">

        <div class="hudTitle">
            Players
        </div>

        <div
            class="hudValue"
            id="players"
        >
            1
        </div>

    </div>

</div>


<div id="status">

    <span id="connectionDot"></span>

    <span id="connectionText">
        Connecting...
    </span>

</div>


<!-- MENU -->

<div id="menu">

    <div class="panel">

        <div class="logo">
            🚀
        </div>

        <h1>
            ROCKET IMPACT
        </h1>

        <div class="subtitle">

            Multiplayer asteroid survival.

            <br>

            Tap asteroids to destroy them.

            <br>

            Nearby asteroids are blasted away.

        </div>


        <button
            class="bigButton"
            id="playButton"
        >
            ▶ PLAY
        </button>


        <button
            class="bigButton secondaryButton"
            id="backButton"
        >
            ← BACK TO MAIN GAME
        </button>

    </div>

</div>


<!-- GAME OVER -->

<div id="gameOver">

    <div class="panel">

        <div class="logo">
            💥
        </div>

        <h1>
            GAME OVER
        </h1>

        <div class="subtitle">
            Your rocket was destroyed.
        </div>

        <div
            class="scoreBig"
            id="finalScore"
        >
            0
        </div>

        <div>
            FINAL SCORE
        </div>


        <button
            class="bigButton"
            id="againButton"
        >
            🚀 PLAY AGAIN
        </button>


        <button
            class="bigButton secondaryButton"
            id="menuButton"
        >
            MENU
        </button>

    </div>

</div>


<script>

/* =========================================================
   SERVER
========================================================= */

const SERVER_URL =
    "wss://kinfo-game-studio.onrender.com";


/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

let W=0;
let H=0;

function resize(){

    const dpr=
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    W=
        window.innerWidth;

    H=
        window.innerHeight;

    canvas.width=
        W*dpr;

    canvas.height=
        H*dpr;

    canvas.style.width=
        W+"px";

    canvas.style.height=
        H+"px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

window.addEventListener(
    "resize",
    resize
);

resize();


/* =========================================================
   WORLD
========================================================= */

let worldWidth=1200;
let worldHeight=800;

let cameraX=600;
let cameraY=400;


/* =========================================================
   NETWORK
========================================================= */

let socket=null;

let myId=null;

let connected=false;

let reconnectTimer=null;

let lastStateSent=0;


/* =========================================================
   GAME
========================================================= */

let playing=false;

let score=0;

let lives=3;

let players=new Map();

let asteroids=new Map();

let particles=[];

let explosions=[];

let shockwaves=[];


/* =========================================================
   LOCAL PLAYER
========================================================= */

let me={

    x:600,

    y:400,

    angle:-Math.PI/2,

    alive:true

};


/*
 * We keep the exact same basic movement model:
 *
 * pointer location determines where the rocket wants to go.
 *
 * The smoothing below prevents the network/game loop from
 * making the player's movement look jerky.
 */

let targetX=W/2;

let targetY=H/2;

let velocityX=0;

let velocityY=0;


/* =========================================================
   STARS
========================================================= */

const stars=[];

for(
    let i=0;
    i<220;
    i++
){

    stars.push({

        x:Math.random(),

        y:Math.random(),

        size:
            Math.random()*1.7+.3,

        alpha:
            Math.random()*.7+.2

    });

}


/* =========================================================
   UI
========================================================= */

const menu=
    document.getElementById("menu");

const gameOver=
    document.getElementById("gameOver");

const livesElement=
    document.getElementById("lives");

const scoreElement=
    document.getElementById("score");

const playersElement=
    document.getElementById("players");

const statusElement=
    document.getElementById("connectionText");

const connectionDot=
    document.getElementById("connectionDot");

const finalScore=
    document.getElementById("finalScore");


function setStatus(
    text,
    online
){

    statusElement.textContent=
        text;

    connectionDot.style.background=
        online
        ?"#35ff82"
        :"#ff5252";
}


function updateHUD(){

    let hearts="";

    for(
        let i=0;
        i<3;
        i++
    ){

        hearts+=
            i<lives
            ?"❤️"
            :"🖤";
    }

    livesElement.textContent=
        hearts;

    scoreElement.textContent=
        score;

    playersElement.textContent=
        players.size;
}


/* =========================================================
   NETWORK CONNECTION
========================================================= */

function connect(){

    if(
        socket &&
        (
            socket.readyState===
            WebSocket.OPEN ||

            socket.readyState===
            WebSocket.CONNECTING
        )
    ){

        return;
    }

    setStatus(
        "Connecting...",
        false
    );

    try{

        socket=
            new WebSocket(
                SERVER_URL
            );

    }catch(error){

        setStatus(
            "Connection failed",
            false
        );

        scheduleReconnect();

        return;
    }


    socket.addEventListener(
        "open",
        ()=>{

            connected=true;

            setStatus(
                "ONLINE",
                true
            );

            /*
             * IMPORTANT:
             *
             * We do NOT create a new player here.
             *
             * The WebSocket itself represents the player.
             */

            send({

                type:"join",

                name:"Rocket"

            });

        }
    );


    socket.addEventListener(
        "message",
        event=>{

            let message;

            try{

                message=
                    JSON.parse(
                        event.data
                    );

            }catch{

                return;
            }

            handleMessage(
                message
            );
        }
    );


    socket.addEventListener(
        "close",
        ()=>{

            connected=false;

            setStatus(
                "Disconnected",
                false
            );

            scheduleReconnect();

        }
    );


    socket.addEventListener(
        "error",
        ()=>{

            connected=false;

            setStatus(
                "Connection error",
                false
            );

        }
    );
}


function scheduleReconnect(){

    if(
        reconnectTimer
    ){

        return;
    }

    reconnectTimer=
        setTimeout(
            ()=>{

                reconnectTimer=
                    null;

                connect();

            },
            3000
        );
}


function send(data){

    if(
        socket &&
        socket.readyState===
        WebSocket.OPEN
    ){

        socket.send(
            JSON.stringify(
                data
            )
        );
    }
}


/* =========================================================
   SERVER MESSAGES
========================================================= */

function handleMessage(
    message
){

    switch(
        message.type
    ){

        case "welcome":

            myId=
                message.id;

            worldWidth=
                message.worldWidth;

            worldHeight=
                message.worldHeight;

            break;


        case "world":

            receiveWorld(
                message
            );

            break;


        case "playerJoined":

            players.set(
                message.player.id,
                message.player
            );

            updateHUD();

            break;


        case "playerUpdated":

            players.set(
                message.player.id,
                message.player
            );

            updateHUD();

            break;


        case "playerLeft":

            players.delete(
                message.id
            );

            updateHUD();

            break;


        case "blast":

            /*
             * Server has already applied the real physics.
             *
             * This is only the visual explosion.
             */

            createExplosion(
                message.x,
                message.y,
                message.size
            );

            break;


        case "score":

            if(
                message.playerId===
                myId
            ){

                score=
                    message.score;

                scoreElement.textContent=
                    score;
            }

            break;


        case "death":

            lives=
                message.lives;

            me.alive=false;

            createExplosion(
                me.x,
                me.y,
                50
            );

            updateHUD();

            break;


        case "respawn":

            me.x=
                message.player.x;

            me.y=
                message.player.y;

            me.angle=
                message.player.angle;

            me.alive=true;

            lives=
                message.player.lives;

            score=
                message.player.score;

            /*
             * Clear residual velocity so the rocket doesn't
             * shoot off immediately after respawning.
             */

            velocityX=0;
            velocityY=0;

            updateHUD();

            break;


        case "playerDeath":

            {

                const player=
                    players.get(
                        message.id
                    );

                if(player){

                    player.alive=false;

                    player.lives=
                        message.lives;

                }

                updateHUD();

            }

            break;


        case "playerRespawn":

            players.set(
                message.player.id,
                message.player
            );

            updateHUD();

            break;


        case "gameOver":

            score=
                message.score;

            showGameOver();

            break;

    }
}


/* =========================================================
   WORLD SYNCHRONISATION
========================================================= */

/*
 * This is the big visual improvement.
 *
 * Previously:
 *
 *     server snapshot
 *          ↓
 *     instantly replace x/y
 *          ↓
 *     visible jump
 *
 * Now:
 *
 *     server snapshot
 *          ↓
 *     preserve current visual position
 *          ↓
 *     smoothly move toward predicted server position
 *
 * This makes the asteroid motion look continuous.
 */

function receiveWorld(
    message
){

    worldWidth=
        message.width;

    worldHeight=
        message.height;


    /* -----------------------------------------
       PLAYERS
    ----------------------------------------- */

    const incomingPlayers=
        new Map();

    for(
        const player
        of message.players
    ){

        incomingPlayers.set(
            player.id,
            player
        );

        const existing=
            players.get(
                player.id
            );

        if(existing){

            /*
             * Keep a visual position separate from the
             * authoritative network position.
             */

            existing.netX=
                player.x;

            existing.netY=
                player.y;

            existing.netAngle=
                player.angle;

            existing.alive=
                player.alive;

            existing.lives=
                player.lives;

            existing.score=
                player.score;

            existing.name=
                player.name;

        }else{

            incomingPlayers
                .get(player.id)
                .drawX=
                    player.x;

            incomingPlayers
                .get(player.id)
                .drawY=
                    player.y;

            incomingPlayers
                .get(player.id)
                .drawAngle=
                    player.angle;

        }
    }


    /*
     * Remove players which actually disappeared.
     */

    players=
        incomingPlayers;


    /*
     * Rebuild visual values for newly received players.
     */

    for(
        const player
        of players.values()
    ){

        if(
            player.drawX===undefined
        ){

            player.drawX=
                player.x;
        }

        if(
            player.drawY===undefined
        ){

            player.drawY=
                player.y;
        }

        if(
            player.drawAngle===undefined
        ){

            player.drawAngle=
                player.angle;
        }

    }


    /* -----------------------------------------
       ASTEROIDS
    ----------------------------------------- */

    const incomingAsteroids=
        new Map();


    for(
        const asteroid
        of message.asteroids
    ){

        const existing=
            asteroids.get(
                asteroid.id
            );


        if(existing){

            /*
             * Authoritative network state.
             */

            existing.netX=
                asteroid.x;

            existing.netY=
                asteroid.y;

            existing.netVX=
                asteroid.vx;

            existing.netVY=
                asteroid.vy;

            existing.size=
                asteroid.size;

            existing.netRotation=
                asteroid.rotation;

            existing.rotationSpeed=
                asteroid.rotationSpeed;

            existing.lastNetworkTime=
                performance.now();

            incomingAsteroids.set(
                asteroid.id,
                existing
            );

        }else{

            /*
             * Brand new asteroid.
             */

            asteroid.drawX=
                asteroid.x;

            asteroid.drawY=
                asteroid.y;

            asteroid.drawVX=
                asteroid.vx;

            asteroid.drawVY=
                asteroid.vy;

            asteroid.drawRotation=
                asteroid.rotation;

            asteroid.lastNetworkTime=
                performance.now();

            incomingAsteroids.set(
                asteroid.id,
                asteroid
            );

        }

    }


    asteroids=
        incomingAsteroids;


    /*
     * Update our own authoritative state.
     */

    const mine=
        players.get(
            myId
        );

    if(mine){

        me.netX=
            mine.x;

        me.netY=
            mine.y;

        me.netAngle=
            mine.angle;

        /*
         * We don't snap the local rocket here.
         *
         * The local rocket is controlled immediately by the
         * player, which gives it the responsive feel you liked.
         */

        me.alive=
            mine.alive;

        lives=
            mine.lives;

        score=
            mine.score;
    }

    updateHUD();
}


/* =========================================================
   SMOOTH ASTEROIDS
========================================================= */

function updateAsteroidVisuals(){

    const now=
        performance.now();


    for(
        const asteroid
        of asteroids.values()
    ){

        /*
         * Extrapolate slightly using the latest velocity.
         *
         * This is particularly important immediately after
         * an explosion because the server has changed the
         * asteroid velocity.
         */

        const elapsed=
            Math.min(
                0.12,
                (
                    now-
                    asteroid.lastNetworkTime
                )/1000
            );


        const predictedX=
            asteroid.netX+
            asteroid.netVX*
            elapsed;

        const predictedY=
            asteroid.netY+
            asteroid.netVY*
            elapsed;


        /*
         * Smoothly approach the predicted position.
         *
         * 0.28 is deliberately responsive enough that a blast
         * feels immediate while eliminating visible network
         * stepping.
         */

        asteroid.drawX+=
            (
                predictedX-
                asteroid.drawX
            )*.28;

        asteroid.drawY+=
            (
                predictedY-
                asteroid.drawY
            )*.28;


        /*
         * Rotation is also interpolated.
         */

        asteroid.drawRotation+=
            asteroid.rotationSpeed;


        /*
         * Prevent floating point drift.
         */

        if(
            Math.abs(
                predictedX-
                asteroid.drawX
            )>.01
        ){

            asteroid.drawX=
                asteroid.drawX;
        }

    }
}


/* =========================================================
   SMOOTH REMOTE PLAYERS
========================================================= */

function updateRemotePlayers(){

    for(
        const player
        of players.values()
    ){

        if(
            player.id===
            myId
        ){

            continue;
        }

        if(
            player.drawX===
            undefined
        ){

            player.drawX=
                player.x;

            player.drawY=
                player.y;

            player.drawAngle=
                player.angle;

        }


        player.drawX+=
            (
                player.netX-
                player.drawX
            )*.22;

        player.drawY+=
            (
                player.netY-
                player.drawY
            )*.22;


        /*
         * Smooth angular movement using the shortest route.
         */

        let angleDifference=
            player.netAngle-
            player.drawAngle;


        while(
            angleDifference>
            Math.PI
        ){

            angleDifference-=
                Math.PI*2;
        }


        while(
            angleDifference<
            -Math.PI
        ){

            angleDifference+=
                Math.PI*2;
        }


        player.drawAngle+=
            angleDifference*.22;

    }
}


/* =========================================================
   GAME START
========================================================= */

function startGame(){

    playing=true;

    menu.style.display=
        "none";

    gameOver.style.display=
        "none";


    /*
     * DO NOT create a new socket.
     *
     * This is what prevents the old dead-player bug.
     */

    if(!connected){

        connect();

    }


    particles=[];

    explosions=[];

    shockwaves=[];

    velocityX=0;
    velocityY=0;

    me.alive=true;

}


function showGameOver(){

    playing=false;

    finalScore.textContent=
        score;

    gameOver.style.display=
        "flex";
}


function returnToMenu(){

    playing=false;

    gameOver.style.display=
        "none";

    menu.style.display=
        "flex";
}


/* =========================================================
   BUTTONS
========================================================= */

document
    .getElementById("playButton")
    .addEventListener(
        "click",
        startGame
    );


document
    .getElementById("againButton")
    .addEventListener(
        "click",
        startGame
    );


document
    .getElementById("menuButton")
    .addEventListener(
        "click",
        returnToMenu
    );


document
    .getElementById("backButton")
    .addEventListener(
        "click",
        ()=>{
            window.location.href=
                "index.html";
        }
    );


/* =========================================================
   POINTER INPUT
========================================================= */

canvas.addEventListener(
    "pointermove",
    event=>{

        targetX=
            event.clientX;

        targetY=
            event.clientY;

    }
);


canvas.addEventListener(
    "pointerdown",
    event=>{

        targetX=
            event.clientX;

        targetY=
            event.clientY;

        blastAt(
            event.clientX,
            event.clientY
        );

    }
);


/* =========================================================
   SCREEN → WORLD
========================================================= */

function screenToWorld(
    x,
    y
){

    return {

        x:
            x-
            W/2+
            cameraX,

        y:
            y-
            H/2+
            cameraY

    };
}


/* =========================================================
   BLAST
========================================================= */

function blastAt(
    screenX,
    screenY
){

    if(
        !playing ||
        !me.alive
    ){

        return;
    }


    const point=
        screenToWorld(
            screenX,
            screenY
        );


    /*
     * The server performs the actual destruction and physics.
     */

    send({

        type:"blast",

        x:point.x,

        y:point.y,

        size:32

    });

}


/* =========================================================
   ROCKET MOVEMENT
========================================================= */

function updateRocket(){

    if(
        !playing ||
        !me.alive
    ){

        return;
    }


    /*
     * Same basic movement behaviour as before.
     *
     * Instead of directly changing position every frame,
     * we use a small velocity smoothing term.
     *
     * This removes the tiny visual "micro-jumps" without
     * making the rocket feel floaty.
     */

    const dx=
        targetX-
        W/2;

    const dy=
        targetY-
        H/2;


    const distance=
        Math.hypot(
            dx,
            dy
        );


    let desiredVX=0;
    let desiredVY=0;


    if(
        distance>10
    ){

        const speed=
            Math.min(
                distance*.035,
                5
            );

        desiredVX=
            dx/
            distance*
            speed;

        desiredVY=
            dy/
            distance*
            speed;

        me.angle=
            Math.atan2(
                dy,
                dx
            );

    }


    /*
     * Fast acceleration, slightly softer deceleration.
     */

    velocityX+=
        (
            desiredVX-
            velocityX
        )*.20;

    velocityY+=
        (
            desiredVY-
            velocityY
        )*.20;


    me.x+=
        velocityX;

    me.y+=
        velocityY;


    me.x=
        Math.max(
            20,
            Math.min(
                worldWidth-20,
                me.x
            )
        );

    me.y=
        Math.max(
            20,
            Math.min(
                worldHeight-20,
                me.y
            )
        );


    /*
     * The camera follows the rocket smoothly rather than
     * snapping to every network update.
     */

    cameraX+=
        (
            me.x-
            cameraX
        )*.12;

    cameraY+=
        (
            me.y-
            cameraY
        )*.12;
}


/* =========================================================
   SEND PLAYER POSITION
========================================================= */

function sendPlayerState(){

    if(
        !connected ||
        !me.alive
    ){

        return;
    }


    const now=
        performance.now();


    /*
     * 20 network updates per second.
     */

    if(
        now-
        lastStateSent<
        50
    ){

        return;
    }


    lastStateSent=
        now;


    send({

        type:"state",

        x:me.x,

        y:me.y,

        angle:me.angle

    });

}


/* =========================================================
   WORLD → SCREEN
========================================================= */

function worldToScreen(
    x,
    y
){

    return {

        x:
            x-
            cameraX+
            W/2,

        y:
            y-
            cameraY+
            H/2

    };
}


/* =========================================================
   BACKGROUND
========================================================= */

function drawSpace(){

    ctx.fillStyle=
        "#02050d";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
     * Subtle deep-space gradient.
     */

    const gradient=
        ctx.createRadialGradient(
            W/2,
            H/2,
            0,
            W/2,
            H/2,
            Math.max(W,H)*.7
        );

    gradient.addColorStop(
        0,
        "rgba(20,40,85,.15)"
    );

    gradient.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle=
        gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    for(
        const star
        of stars
    ){

        const x=
            star.x*W;

        const y=
            star.y*H;

        ctx.globalAlpha=
            star.alpha;

        ctx.fillStyle=
            "#ffffff";

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            star.size,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    ctx.globalAlpha=1;

}


/* =========================================================
   ASTEROID
========================================================= */

function drawAsteroid(
    asteroid
){

    const pos=
        worldToScreen(
            asteroid.drawX,
            asteroid.drawY
        );


    const size=
        asteroid.size;


    if(
        pos.x<
            -100 ||
        pos.x>
            W+100 ||
        pos.y<
            -100 ||
        pos.y>
            H+100
    ){

        return;
    }


    ctx.save();


    ctx.translate(
        pos.x,
        pos.y
    );


    ctx.rotate(
        asteroid.drawRotation
    );


    /*
     * Soft asteroid glow.
     */

    ctx.shadowBlur=8;

    ctx.shadowColor=
        "rgba(150,180,220,.25)";


    ctx.beginPath();


    const points=9;


    for(
        let i=0;
        i<points;
        i++
    ){

        const angle=
            i/
            points*
            Math.PI*
            2;


        const variation=
            .76+
            Math.sin(
                i*7.13+
                asteroid.id.length
            )*.18;


        const radius=
            size*
            variation;


        const x=
            Math.cos(angle)*
            radius;

        const y=
            Math.sin(angle)*
            radius;


        if(i===0){

            ctx.moveTo(
                x,
                y
            );

        }else{

            ctx.lineTo(
                x,
                y
            );

        }

    }


    ctx.closePath();


    ctx.shadowBlur=0;


    ctx.fillStyle=
        "#465064";

    ctx.fill();


    ctx.strokeStyle=
        "#8b96aa";

    ctx.lineWidth=
        1.5;

    ctx.stroke();


    /*
     * Craters.
     */

    ctx.globalAlpha=.38;

    ctx.fillStyle=
        "#171d2a";


    for(
        let i=0;
        i<3;
        i++
    ){

        const angle=
            i*2.2;

        const radius=
            size*
            (.12+
            i*.025);


        ctx.beginPath();

        ctx.arc(

            Math.cos(angle)*
            size*.35,

            Math.sin(angle)*
            size*.35,

            radius,

            0,
            Math.PI*2

        );

        ctx.fill();

    }


    ctx.restore();

}


/* =========================================================
   ROCKET
========================================================= */

function drawRocket(
    player,
    local=false
){

    if(
        !player.alive
    ){

        return;
    }


    const x=
        local
        ?W/2
        :worldToScreen(
            player.drawX,
            player.drawY
        ).x;


    const y=
        local
        ?H/2
        :worldToScreen(
            player.drawX,
            player.drawY
        ).y;


    const angle=
        local
        ?me.angle
        :player.drawAngle;


    ctx.save();


    ctx.translate(
        x,
        y
    );


    ctx.rotate(
        angle+
        Math.PI/2
    );


    /*
     * Engine flame.
     */

    ctx.beginPath();

    ctx.moveTo(
        -7,
        13
    );

    ctx.lineTo(
        0,
        29+
        Math.random()*6
    );

    ctx.lineTo(
        7,
        13
    );

    ctx.closePath();


    ctx.fillStyle=
        "#ffad33";

    ctx.fill();


    /*
     * Outer flame.
     */

    ctx.globalAlpha=.5;

    ctx.beginPath();

    ctx.moveTo(
        -4,
        13
    );

    ctx.lineTo(
        0,
        23
    );

    ctx.lineTo(
        4,
        13
    );

    ctx.closePath();

    ctx.fillStyle=
        "#fff1a0";

    ctx.fill();

    ctx.globalAlpha=1;


    /*
     * Rocket body.
     */

    ctx.beginPath();

    ctx.moveTo(
        0,
        -20
    );

    ctx.lineTo(
        -10,
        12
    );

    ctx.lineTo(
        0,
        8
    );

    ctx.lineTo(
        10,
        12
    );

    ctx.closePath();


    ctx.fillStyle=
        local
        ?"#ffffff"
        :"#4d9cff";

    ctx.fill();


    ctx.strokeStyle=
        local
        ?"#75b5ff"
        :"#8dc6ff";

    ctx.lineWidth=2;

    ctx.stroke();


    /*
     * Window.
     */

    ctx.beginPath();

    ctx.arc(
        0,
        -6,
        4,
        0,
        Math.PI*2
    );

    ctx.fillStyle=
        "#091529";

    ctx.fill();

    ctx.strokeStyle=
        "#80c7ff";

    ctx.stroke();


    ctx.restore();


    /*
     * Remote player name.
     */

    if(!local){

        ctx.font=
            "11px system-ui";

        ctx.textAlign=
            "center";

        ctx.fillStyle=
            "rgba(180,215,255,.8)";

        ctx.fillText(
            player.name||
            "Rocket",

            x,

            y-30
        );

    }

}


/* =========================================================
   EXPLOSION
========================================================= */

function createExplosion(
    x,
    y,
    size
){

    /*
     * Large shockwave.
     *
     * This is deliberately closer to the feel of the original
     * game, where an asteroid explosion creates a large,
     * satisfying radial effect.
     */

    shockwaves.push({

        x,
        y,

        radius:8,

        maxRadius:
            size*
            3.2,

        life:1

    });


    explosions.push({

        x,
        y,

        radius:5,

        maxRadius:
            size*
            1.8,

        life:1

    });


    /*
     * Debris.
     */

    for(
        let i=0;
        i<32;
        i++
    ){

        const angle=
            Math.random()*
            Math.PI*
            2;


        const speed=
            Math.random()*
            4+
            1;


        particles.push({

            x,
            y,

            vx:
                Math.cos(angle)*
                speed,

            vy:
                Math.sin(angle)*
                speed,

            life:1,

            size:
                Math.random()*
                3+
                1

        });

    }

}


/* =========================================================
   EFFECT UPDATE
========================================================= */

function updateEffects(){

    /*
     * Particles.
     */

    for(
        let i=
            particles.length-1;
        i>=0;
        i--
    ){

        const p=
            particles[i];


        p.x+=
            p.vx;

        p.y+=
            p.vy;


        p.vx*=.97;
        p.vy*=.97;


        p.life-=.025;


        if(
            p.life<=0
        ){

            particles.splice(
                i,
                1
            );

        }

    }


    /*
     * Explosions.
     */

    for(
        let i=
            explosions.length-1;
        i>=0;
        i--
    ){

        const e=
            explosions[i];


        e.radius+=
            (
                e.maxRadius-
                e.radius
            )*.18;


        e.life-=.045;


        if(
            e.life<=0
        ){

            explosions.splice(
                i,
                1
            );

        }

    }


    /*
     * Shockwaves.
     */

    for(
        let i=
            shockwaves.length-1;
        i>=0;
        i--
    ){

        const s=
            shockwaves[i];


        s.radius+=
            (
                s.maxRadius-
                s.radius
            )*.18;


        s.life-=.035;


        if(
            s.life<=0
        ){

            shockwaves.splice(
                i,
                1
            );

        }

    }

}


/* =========================================================
   DRAW EFFECTS
========================================================= */

function drawEffects(){

    /*
     * Particles.
     */

    for(
        const p
        of particles
    ){

        const pos=
            worldToScreen(
                p.x,
                p.y
            );


        ctx.globalAlpha=
            p.life;

        ctx.fillStyle=
            "#ffffff";


        ctx.beginPath();

        ctx.arc(
            pos.x,
            pos.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    /*
     * Inner explosions.
     */

    for(
        const e
        of explosions
    ){

        const pos=
            worldToScreen(
                e.x,
                e.y
            );


        const gradient=
            ctx.createRadialGradient(
                pos.x,
                pos.y,
                0,
                pos.x,
                pos.y,
                e.radius
            );


        gradient.addColorStop(
            0,
            "rgba(255,255,255,.9)"
        );

        gradient.addColorStop(
            .2,
            "rgba(255,190,80,.65)"
        );

        gradient.addColorStop(
            1,
            "rgba(255,90,30,0)"
        );


        ctx.globalAlpha=
            e.life;

        ctx.fillStyle=
            gradient;


        ctx.beginPath();

        ctx.arc(
            pos.x,
            pos.y,
            e.radius,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    /*
     * Shockwaves.
     */

    for(
        const s
        of shockwaves
    ){

        const pos=
            worldToScreen(
                s.x,
                s.y
            );


        ctx.globalAlpha=
            s.life*
            .65;


        ctx.strokeStyle=
            "#8fd8ff";


        ctx.lineWidth=
            2.5;


        ctx.beginPath();

        ctx.arc(
            pos.x,
            pos.y,
            s.radius,
            0,
            Math.PI*2
        );

        ctx.stroke();

    }


    ctx.globalAlpha=1;

}


/* =========================================================
   DRAW
========================================================= */

function draw(){

    drawSpace();


    /*
     * Asteroids.
     */

    for(
        const asteroid
        of asteroids.values()
    ){

        drawAsteroid(
            asteroid
        );

    }


    /*
     * Other players.
     */

    for(
        const player
        of players.values()
    ){

        if(
            player.id===
            myId
        ){

            continue;
        }


        drawRocket(
            player,
            false
        );

    }


    /*
     * Local rocket.
     */

    if(
        playing &&
        me.alive
    ){

        drawRocket(

            {
                alive:true
            },

            true

        );

    }


    drawEffects();

}


/* =========================================================
   MAIN LOOP
========================================================= */

function loop(){

    updateRocket();

    sendPlayerState();

    updateAsteroidVisuals();

    updateRemotePlayers();

    updateEffects();

    draw();

    requestAnimationFrame(
        loop
    );

}


/* =========================================================
   START
========================================================= */

connect();

loop();

</script>
